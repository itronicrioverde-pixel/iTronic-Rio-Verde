<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132820">
  <title>iTronic CRM | Relacionamento e Vendas</title>
  <style>
    :root{--green:#a5db00;--deep:#132820;--ink:#173126;--muted:#668076;--line:#dce9dc;--paper:#f9fcf7;--card:#fff;--mint:#eaf8d1;--amber:#ffcc75;--red:#d56d67;--shadow:0 16px 45px rgba(24,72,43,.10)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Arial,sans-serif;background:radial-gradient(circle at 9% 3%,#fff 0,transparent 34%),radial-gradient(circle at 85% 65%,#d8efa4 0,transparent 44%),linear-gradient(130deg,#edf9e7,#dcf0d1 52%,#c4e57a);min-height:100vh}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit}
    .app{display:grid;grid-template-columns:234px minmax(0,1fr);min-height:100vh}
    .sidebar{background:linear-gradient(165deg,#10271e,#173a2b 65%,#0c2219);color:#f3fff4;padding:24px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
    .brand{display:flex;align-items:center;gap:10px;padding:7px 10px 31px}
    .kpi-icon svg{width:20px;height:20px}
    .brandmark{width:41px;height:41px;display:grid;place-items:center;background:var(--green);color:#18321b;border-radius:13px;font-weight:900;font-size:21px;letter-spacing:-.08em;box-shadow:0 8px 20px #0004}
    .brand b{display:block;font-size:19px;letter-spacing:-.04em;line-height:1}
    .brand small{color:#a7c8ab;letter-spacing:.16em;font-size:9px;font-weight:800}
    .navcaption{color:#89a993;font-size:10px;font-weight:800;letter-spacing:.14em;padding:0 14px 10px}
    .nav{display:grid;gap:5px}
    .nav button,.backlink{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:13px;background:transparent;color:#b8cfbd;padding:12px 13px;font-weight:650;text-decoration:none;transition:background .2s,transform .2s,color .2s}
    .nav button:hover,.backlink:hover{background:#ffffff13;color:#fff;transform:translateX(2px)}
    .nav button.active{background:var(--green);color:#173018;box-shadow:0 8px 20px #071c1670}
    .nav svg,.backlink svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .sidebar-bottom{margin-top:auto;padding:12px 5px;border-top:1px solid #ffffff20}
    .backlink{font-size:13px}
    .sidebar-note{color:#91af9b;font-size:11px;line-height:1.5;margin:12px 10px 0}
    main{max-width:1590px;width:100%;margin:0 auto;padding:28px clamp(16px,3.3vw,48px) 80px;min-width:0}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:27px}
    .crumb{font-size:12px;color:var(--muted);font-weight:700}.crumb b{color:var(--ink)}
    .top-actions,.hero-actions,.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
    .btn{border:1px solid #cfe0cb;background:#fff;color:var(--ink);border-radius:13px;padding:10px 14px;font-size:13px;font-weight:800;min-height:40px;box-shadow:0 4px 14px #1238200c;transition:transform .18s,box-shadow .18s,background .18s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px #12382023}
    .btn.primary{background:var(--green);border-color:var(--green);color:#173018}
    .btn.quiet{background:#eff6e9}
    .btn.danger{color:#9a4440;background:#fff4f2;border-color:#f4d0cb}
    .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:19px}
    .eyebrow{font-size:10px;font-weight:900;letter-spacing:.17em;color:#448051;text-transform:uppercase}
    h1{font-size:clamp(28px,3.6vw,42px);letter-spacing:-.055em;line-height:1.1;margin:5px 0 6px}
    .hero p{margin:0;color:var(--muted);font-size:13px}
    .search{display:flex;align-items:center;gap:9px;min-width:230px;max-width:360px;flex:1;background:#fff;border:1px solid var(--line);border-radius:13px;padding:0 12px;box-shadow:0 8px 24px #1238200b}
    .search svg{width:17px;height:17px;color:var(--muted)}
    .search input{border:0;background:transparent;outline:0;min-width:0;width:100%;padding:11px 0;color:var(--ink);font-size:13px}
    .view{animation:rise .29s ease both}
    @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
    .card{background:rgba(255,255,255,.92);border:1px solid #fff;border-radius:20px;box-shadow:var(--shadow)}
    .kpi{padding:18px;min-height:136px}
    .kpi-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:750}
    .kpi-icon{width:33px;height:33px;display:grid;place-items:center;border-radius:11px;background:var(--mint);color:#347749;font-size:17px}
    .kpi strong{display:block;font-size:clamp(21px,2.4vw,30px);letter-spacing:-.05em;margin:12px 0 2px}
    .kpi small{color:var(--muted);font-size:11px}
    .panels{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr);gap:13px}
    .panel{padding:20px;min-width:0}
    .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:19px}
    h2{font-size:17px;letter-spacing:-.035em;margin:0}
    .panel-head p{font-size:11px;color:var(--muted);margin:3px 0 0}
    .mini-link{border:0;background:none;color:#397a43;font-size:12px;font-weight:850;white-space:nowrap;padding:3px}
    .stage-bars{display:grid;gap:15px;margin:14px 0}
    .stage-bar-line{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;margin-bottom:6px}
    .stage-bar-line b{color:var(--muted)}
    .track{height:9px;border-radius:99px;background:#edf3e9;overflow:hidden}
    .track i{display:block;height:100%;min-width:0;border-radius:99px;background:linear-gradient(90deg,#4c9e63,#abdc65);transition:width .4s}
    .item{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:13px 2px;min-width:0}
    .item:first-child{border-top:0}
    .avatar{display:grid;place-items:center;width:37px;height:37px;flex:none;border-radius:12px;background:#eaf3df;color:#4a7550;font-weight:850}
    .item-main{min-width:0;flex:1}.item-main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.item-main small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
    .item-value{text-align:right;font-size:12px;font-weight:850;white-space:nowrap}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:850;background:#eaf7de;color:#377647;white-space:nowrap}
    .pill.warn{background:#fff0cf;color:#9a6a20}.pill.late{background:#ffebe6;color:#b9574e}
    .empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed #c9dcca;border-radius:15px;background:#f8fbf5}
    .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}
    .empty .btn{margin-top:12px}
    .toolbar{justify-content:space-between;margin:0 0 14px}
    .toolbar p{color:var(--muted);font-size:12px;margin:0}
    .pipeline{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(235px,1fr);gap:12px;overflow-x:auto;overscroll-behavior-x:contain;padding:3px 2px 18px;scrollbar-color:#b6d38b transparent}
    .column{background:#ffffff88;border:1px solid #ffffffc2;border-radius:17px;padding:12px;min-height:420px;transition:background .2s,box-shadow .2s}
    .column.dragover{background:#e4f8c4;box-shadow:inset 0 0 0 2px #a5db00}
    .column-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 12px;font-size:12px;font-weight:850}
    .column-head span{display:flex;align-items:center;gap:7px}.stage-dot{width:8px;height:8px;border-radius:50%;background:var(--dot,#91bf72)}
    .column-head small{color:var(--muted);background:#fff;border-radius:99px;padding:3px 7px}
    .deal-card{padding:14px;margin-bottom:9px;border:1px solid #e9efe7;border-radius:14px;background:#fff;box-shadow:0 7px 19px #1438200c;cursor:pointer;transition:transform .17s,box-shadow .17s}
    .deal-card:hover{transform:translateY(-3px);box-shadow:0 13px 24px #14382020}
    .deal-card:focus-visible{outline:2px solid #679e31}
    .deal-card b{display:block;font-size:13px;line-height:1.3}.deal-card strong{display:block;font-size:16px;letter-spacing:-.03em;margin:12px 0 8px}.deal-card small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
    .deal-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:9px;font-size:10px;color:var(--muted)}
    .people-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .person{padding:17px;min-width:0}.person-top{display:flex;gap:10px;align-items:center;margin-bottom:15px}.person-top b{font-size:14px}.person-top small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
    .person-note{font-size:12px;color:var(--muted);line-height:1.5;min-height:37px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
    .person-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:13px;font-size:11px}
    .text-button{border:0;background:none;color:#377647;font-weight:850;padding:3px}
    .follow-list{display:grid;gap:10px}
    .follow{display:flex;align-items:center;gap:13px;padding:14px 16px}
    .follow .datebox{flex:none;width:49px;text-align:center;border-radius:11px;background:#eef8dc;padding:5px;color:#3e7544}
    .datebox b{display:block;font-size:18px;line-height:1}.datebox small{font-size:9px;font-weight:800;text-transform:uppercase}
    .follow .item-main small{white-space:normal}
    .follow .btn{padding:8px 10px;min-height:34px}
    .notice{border:1px solid #d0e4c0;background:#f2fae7;border-radius:13px;padding:12px 14px;color:#3c6945;font-size:12px;margin-top:14px}
    dialog{border:0;border-radius:22px;padding:0;max-width:min(500px,calc(100vw - 24px));width:100%;background:#fff;color:var(--ink);box-shadow:0 30px 90px #071e1660}
    dialog::backdrop{background:#0b2219a8;backdrop-filter:blur(7px)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 22px;border-bottom:1px solid var(--line)}
    .modal-head h2{font-size:20px}.close{border:0;border-radius:10px;background:#edf4e9;width:32px;height:32px;font-size:19px}
    .modal-body{padding:18px 22px 23px;max-height:min(72vh,650px);overflow:auto}
    .field{display:block;font-size:12px;font-weight:800;margin:0 0 12px}
    .field input,.field select,.field textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid #d7e3d5;border-radius:11px;background:#fbfdf9;color:var(--ink);outline:0;font-size:14px}
    .field textarea{resize:vertical;min-height:80px}.field :focus{border-color:#7caf53;box-shadow:0 0 0 3px #b7df813b}
    .form-two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}
    .detail-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:11px 0;font-size:13px}.detail-row span{color:var(--muted)}
    .toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(25px);background:#123725;color:#fff;border-radius:99px;padding:10px 16px;font-size:12px;font-weight:750;opacity:0;pointer-events:none;transition:.22s;z-index:200}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .mobilebar{display:none}
    .global-click-wave{position:fixed;width:28px;height:28px;border-radius:50%;border:1.5px solid #a5db55;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.15);animation:clickRipple .38s ease-out forwards;z-index:2147483647}
    .global-click-wave.second{animation-delay:.055s}
    @keyframes clickRipple{0%{opacity:.7;transform:translate(-50%,-50%) scale(.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}}
    @media(max-width:1100px){.people-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{display:none}main{padding:22px 16px 95px}.mobilebar{display:flex;position:fixed;z-index:90;left:0;right:0;bottom:0;justify-content:space-around;background:#122d22ed;border-top:1px solid #4b6b50;padding:8px 4px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}.mobilebar button{flex:1;border:0;background:transparent;color:#a9c9ae;display:grid;justify-items:center;gap:2px;font-size:10px;font-weight:750;border-radius:11px;padding:7px 2px}.mobilebar button.active{background:var(--green);color:#173018}.mobilebar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}.panels{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.topline{margin-bottom:22px}}
    @media(max-width:550px){.people-grid{grid-template-columns:1fr}.kpis{gap:9px}.kpi{padding:14px;min-height:117px}.hero-actions{width:100%}.hero-actions .btn{flex:1}.search{max-width:none;width:100%}.form-two{grid-template-columns:1fr}.top-actions .btn{font-size:11px;padding:8px 10px}.topline{align-items:flex-start}.pipeline{grid-auto-columns:78vw}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.global-click-wave{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark">iT</div><div><b>iTronic</b><small>CRM · RIO VERDE</small></div></div>
    <div class="navcaption">ÁREA DE TRABALHO</div>
    <nav class="nav" aria-label="CRM">
      <button data-view="overview" class="active"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9H3zM9 20v-6h6v6"/></svg>Visão geral</button>
      <button data-view="pipeline"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><rect x="17" y="4" width="4" height="16" rx="1"/></svg>Funil de vendas</button>
      <button data-view="contacts"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1H3m3-6h6m6-7a3 3 0 0 1 0 6m1 3a5 5 0 0 1 2 4v1"/></svg>Clientes</button>
      <button data-view="followups"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h4"/></svg>Retornos</button>
    </nav>
    <div class="sidebar-bottom">
      <a class="backlink" href="#" onclick="if(window.parent!==window){window.parent.postMessage({type:'itronic:crm-back'},'*');return false}"><svg viewBox="0 0 24 24"><path d="m12 19-7-7 7-7M5 12h15"/></svg>Voltar ao iTronic</a>
      <p class="sidebar-note">Atendimento próximo gera vendas melhores.</p>
    </div>
  </aside>
  <main>
    <div class="topline"><div class="crumb">iTronic <span aria-hidden="true">/</span> <b>CRM</b></div><div class="top-actions"><button class="btn quiet" data-action="import-erp">Importar clientes iTronic</button><button class="btn" data-action="export">Exportar backup</button><button class="btn quiet" data-action="restore">Restaurar backup</button><input id="backup-input" type="file" accept=".json,application/json" hidden></div></div>
    <div class="hero"><div><div class="eyebrow">RELACIONAMENTO & VENDAS</div><h1 id="view-title">Seu atendimento, em movimento.</h1><p id="view-subtitle">Cada conversa tem um próximo passo.</p></div><div class="hero-actions"><button class="btn" data-action="new-contact">+ Cliente</button><button class="btn primary" data-action="new-deal">+ Oportunidade</button></div></div>
    <div class="toolbar"><p id="view-count">Acompanhe os próximos passos de cada cliente.</p><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Buscar cliente ou aparelho" autocomplete="off" aria-label="Buscar"></label></div>
    <div id="view" class="view"></div>
  </main>
</div>
<nav class="mobilebar" aria-label="CRM no celular">
  <button data-view="overview" class="active"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9H3zM9 20v-6h6v6"/></svg>Início</button>
  <button data-view="pipeline"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><rect x="17" y="4" width="4" height="16" rx="1"/></svg>Funil</button>
  <button data-view="contacts"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1H3"/></svg>Clientes</button>
  <button data-view="followups"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg>Retornos</button>
</nav>
<dialog id="modal"><div id="modal-content"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const STORE='itronic_crm_v1';
const STAGES=[
  {id:'novo',label:'Novo contato',color:'#c8d66e'},
  {id:'atendimento',label:'Em atendimento',color:'#7fb9a7'},
  {id:'orcamento',label:'Orçamento enviado',color:'#e2bd68'},
  {id:'negociacao',label:'Negociação',color:'#95a7cf'},
  {id:'ganho',label:'Venda fechada',color:'#79bc84'},
  {id:'perdido',label:'Perdido',color:'#d8a29a'}
];
const TITLES={overview:['Seu atendimento, em movimento.','Cada conversa tem um próximo passo.'],pipeline:['Funil de vendas','Visualize cada oportunidade até o fechamento.'],contacts:['Pessoas primeiro.','Conheça seus clientes e mantenha o relacionamento.'],followups:['Retornos no tempo certo.','Nunca deixe uma conversa importante esfriar.']};
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>('c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const today=()=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`};
const money=n=>BRL.format(Number(n)||0);
const stageOf=k=>STAGES.find(s=>s.id===k)||STAGES[0];
let state={version:1,contacts:[],deals:[]},currentView='overview',query='',toastTimer;
try{const data=JSON.parse(localStorage.getItem(STORE)||'null');if(data&&Array.isArray(data.contacts)&&Array.isArray(data.deals))state={version:1,contacts:data.contacts,deals:data.deals}}catch(_){}
const contactFor=d=>state.contacts.find(c=>c.id===d.contactId);
function notify(message){const box=document.getElementById('toast');box.textContent=message;box.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.remove('show'),2800)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));render()}catch(_){notify('Não foi possível salvar neste navegador. Exporte um backup.')}} 
function initials(name){return String(name||'iT').trim().split(/\s+/).slice(0,2).map(x=>x.charAt(0).toUpperCase()).join('')}
function phoneLink(c){let p=String(c.whatsapp||c.phone||'').replace(/\D/g,'');if(p.length===10||p.length===11)p='55'+p;return p.length>=12?'https://wa.me/'+p:''}
function dateLabel(s){if(!s)return 'Sem data';const d=s.split('-');return d.length===3?d[2]+'/'+d[1]+'/'+d[0]:s}
function matches(d){const c=contactFor(d);return !query||[d.title,d.notes,c?.name,c?.phone].some(v=>String(v||'').toLocaleLowerCase('pt-BR').includes(query))}
function show(view){currentView=view;query='';document.getElementById('search').value='';render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));
  document.getElementById('view-title').textContent=TITLES[currentView][0];
  document.getElementById('view-subtitle').textContent=TITLES[currentView][1];
  const view=document.getElementById('view');
  view.classList.remove('view');void view.offsetWidth;view.classList.add('view');
  view.innerHTML=currentView==='pipeline'?pipeline():currentView==='contacts'?contacts():currentView==='followups'?followups():overview();
}
function empty(title,detail,action,label){return '<div class="empty"><b>'+esc(title)+'</b>'+esc(detail)+(action?'<br><button class="btn primary" data-action="'+action+'">'+esc(label)+'</button>':'')+'</div>'}
const crmIcon=path=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+path+'</svg>';
function overview(){
  document.getElementById('view-count').textContent='Acompanhe os próximos passos de cada cliente.';
  const open=state.deals.filter(d=>!['ganho','perdido'].includes(d.stage));
  const won=state.deals.filter(d=>d.stage==='ganho'&&String(d.closedAt||d.updatedAt||'').slice(0,7)===today().slice(0,7));
  const overdue=open.filter(d=>d.followup&&d.followup<today()).length;
  const due=open.filter(d=>d.followup).sort((a,b)=>a.followup.localeCompare(b.followup)).slice(0,5);
  const recent=state.deals.slice().sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt))).slice(0,5);
  const kpis=[
    [crmIcon('<path d="m12 2 9 5-9 5-9-5zM3 7v10l9 5 9-5V7M12 12v10"/>'),'Oportunidades ativas',open.length,'Conversas em andamento'],
    [crmIcon('<path d="M3 17l6-6 4 4 8-8M17 7h4v4"/>'),'Em negociação',money(open.reduce((n,d)=>n+Number(d.value||0),0)),'Valor potencial'],
    [crmIcon('<path d="m4 12 5 5L20 6"/>'),'Fechadas no mês',won.length,'Negócios ganhos'],
    [crmIcon('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),'Retornos atrasados',overdue,'Precisam de atenção']
  ];
  let html='<div class="kpis">'+kpis.map(k=>'<div class="card kpi"><div class="kpi-top"><span>'+k[1]+'</span><span class="kpi-icon">'+k[0]+'</span></div><strong>'+k[2]+'</strong><small>'+k[3]+'</small></div>').join('')+'</div>';
  html+='<div class="panels"><section class="card panel"><div class="panel-head"><div><h2>Movimento do funil</h2><p>Onde estão as conversas da loja</p></div><button class="mini-link" data-view="pipeline">Abrir funil ↗</button></div><div class="stage-bars">';
  const max=Math.max(1,...STAGES.map(s=>state.deals.filter(d=>d.stage===s.id).length));
  html+=STAGES.map(s=>{const n=state.deals.filter(d=>d.stage===s.id).length;return '<div><div class="stage-bar-line"><span>'+s.label+'</span><b>'+n+'</b></div><div class="track"><i style="width:'+(n/max*100)+'%;background:'+s.color+'"></i></div></div>'}).join('');
  html+='</div></section><section class="card panel"><div class="panel-head"><div><h2>Próximos retornos</h2><p>Contatos que merecem atenção</p></div><button class="mini-link" data-view="followups">Ver todos ↗</button></div>';
  html+=due.length?due.map(followRow).join(''):empty('Tudo em dia','Defina uma data de retorno nas oportunidades.');
  html+='</section></div><section class="card panel" style="margin-top:13px"><div class="panel-head"><div><h2>Atividade recente</h2><p>Últimas oportunidades movimentadas</p></div></div>';
  html+=recent.length?recent.map(d=>'<div class="item"><span class="avatar">'+esc(initials(contactFor(d)?.name))+'</span><div class="item-main"><b>'+esc(d.title)+'</b><small>'+esc(contactFor(d)?.name||'Cliente removido')+' · '+stageOf(d.stage).label+'</small></div><span class="item-value">'+money(d.value)+'</span><button class="text-button" data-action="view-deal" data-id="'+d.id+'">Abrir</button></div>').join(''):empty('Seu CRM começa aqui','Cadastre um cliente e registre a primeira oportunidade.','new-contact','Cadastrar cliente');
  return html+'</section><div class="notice">Os dados deste CRM ficam neste navegador. Use “Exportar backup” regularmente. Você pode importar os clientes já cadastrados neste navegador no iTronic.</div>';
}
function dealCard(d){const c=contactFor(d);return '<div class="deal-card" draggable="true" tabindex="0" role="button" data-action="view-deal" data-id="'+d.id+'"><b>'+esc(d.title)+'</b><small>'+esc(c?.name||'Cliente removido')+'</small><strong>'+money(d.value)+'</strong><div class="deal-foot"><span>'+esc(d.source||c?.source||'iTronic')+'</span><span>'+(d.followup?'◷ '+dateLabel(d.followup):'Sem retorno')+'</span></div></div>'}
function pipeline(){
  const list=state.deals.filter(matches);
  document.getElementById('view-count').textContent=list.length+' oportunidade(s) no funil · arraste um cartão para mudar de etapa';
  return '<div class="pipeline">'+STAGES.map(s=>{const deals=list.filter(d=>d.stage===s.id);return '<section class="column" data-stage="'+s.id+'"><div class="column-head"><span><i class="stage-dot" style="--dot:'+s.color+'"></i>'+s.label+'</span><small>'+deals.length+'</small></div>'+deals.map(dealCard).join('')+(deals.length?'':'<div class="empty">Nenhuma oportunidade nesta etapa.</div>')+'</section>'}).join('')+'</div>';
}
function contacts(){
  const list=state.contacts.filter(c=>!query||[c.name,c.phone,c.whatsapp,c.notes].some(v=>String(v||'').toLocaleLowerCase('pt-BR').includes(query))).slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  document.getElementById('view-count').textContent=list.length+' cliente(s) encontrado(s)';
  if(!list.length)return empty(query?'Nenhum cliente encontrado':'Ainda não há clientes',query?'Tente outro nome ou telefone.':'Cadastre o primeiro cliente ou importe os contatos do iTronic.','new-contact','Cadastrar cliente');
  return '<div class="people-grid">'+list.map(c=>{const n=state.deals.filter(d=>d.contactId===c.id).length;const link=phoneLink(c);return '<article class="card person"><div class="person-top"><span class="avatar">'+esc(initials(c.name))+'</span><div><b>'+esc(c.name)+'</b><small>'+esc(c.phone||'Telefone não informado')+'</small></div></div><div class="person-note">'+esc(c.notes||'Acompanhe interesses e conversas deste cliente.')+'</div><div class="person-bottom"><span>'+n+' oportunidade(s)</span><span><button class="text-button" data-action="view-contact" data-id="'+c.id+'">Ver perfil</button>'+(link?' · <a class="text-button" href="'+link+'" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp de '+esc(c.name)+'">WhatsApp ↗</a>':'')+'</span></div></article>'}).join('')+'</div>';
}
function followRow(d){
  const c=contactFor(d),parts=d.followup.split('-'),late=d.followup<today();
  return '<div class="item"><span class="datebox"><b>'+esc(parts[2]||'')+'</b><small>'+esc(new Intl.DateTimeFormat('pt-BR',{month:'short',timeZone:'UTC'}).format(new Date(d.followup+'T12:00:00Z')))+'</small></span><div class="item-main"><b>'+esc(c?.name||'Cliente removido')+'</b><small>'+esc(d.title)+' · '+(late?'Atrasado':'Retornar em '+dateLabel(d.followup))+'</small></div><span class="pill '+(late?'late':'')+'">'+(late?'Atrasado':'Agendado')+'</span><button class="text-button" data-action="view-deal" data-id="'+d.id+'">Abrir</button></div>'
}
function followups(){
  const list=state.deals.filter(d=>d.followup&&!['ganho','perdido'].includes(d.stage)&&matches(d)).sort((a,b)=>a.followup.localeCompare(b.followup));
  document.getElementById('view-count').textContent=list.length+' retorno(s) agendado(s)';
  return '<section class="card panel"><div class="panel-head"><div><h2>Agenda de atendimento</h2><p>Altere a data ou conclua o retorno ao abrir a oportunidade.</p></div></div>'+(list.length?'<div class="follow-list">'+list.map(followRow).join('')+'</div>':empty('Nenhum retorno agendado','Defina a próxima data de contato ao criar ou editar uma oportunidade.','new-deal','Nova oportunidade'))+'</section>';
}
function modal(title,content){document.getElementById('modal-content').innerHTML='<div class="modal-head"><h2>'+esc(title)+'</h2><button class="close" data-action="close-modal" aria-label="Fechar">×</button></div><div class="modal-body">'+content+'</div>';document.getElementById('modal').showModal()}
function contactForm(c){
  c=c||{};
  const body='<form id="contact-form" data-id="'+esc(c.id||'')+'"><label class="field">Nome do cliente *<input name="name" required maxlength="100" value="'+esc(c.name||'')+'" placeholder="Ex.: Ana Martins"></label><div class="form-two"><label class="field">Telefone / WhatsApp<input name="phone" type="tel" maxlength="25" value="'+esc(c.phone||'')+'" placeholder="(64) 99999-9999"></label><label class="field">Origem<select name="source">'+['WhatsApp','Instagram','Indicação','Loja','Outro'].map(x=>'<option '+(x===(c.source||'WhatsApp')?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div><label class="field">Observações<textarea name="notes" maxlength="1000" placeholder="Interesses, preferências e contexto de atendimento">'+esc(c.notes||'')+'</textarea></label><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" type="submit">Salvar cliente</button></div></form>';
  modal(c.id?'Editar cliente':'Novo cliente',body);
  document.getElementById('contact-form').onsubmit=function(ev){
    ev.preventDefault();const f=new FormData(ev.currentTarget),name=String(f.get('name')||'').trim();
    if(!name)return;
    const old=state.contacts.find(x=>x.id===c.id);
    const data={name,phone:String(f.get('phone')||'').trim(),source:String(f.get('source')||''),notes:String(f.get('notes')||'').trim()};
    if(old)Object.assign(old,data,{updatedAt:new Date().toISOString()});else state.contacts.push({id:id(),createdAt:new Date().toISOString(),...data});
    document.getElementById('modal').close();save();notify(old?'Cliente atualizado':'Cliente cadastrado');
  };
}
function dealForm(d){
  d=d||{};
  if(!state.contacts.length){notify('Cadastre um cliente antes de criar uma oportunidade.');contactForm();return}
  const options=state.contacts.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(c=>'<option value="'+c.id+'" '+(d.contactId===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('');
  const stages=STAGES.map(s=>'<option value="'+s.id+'" '+((d.stage||'novo')===s.id?'selected':'')+'>'+s.label+'</option>').join('');
  const body='<form id="deal-form" data-id="'+esc(d.id||'')+'"><label class="field">Cliente *<select name="contactId" required><option value="">Selecione</option>'+options+'</select></label><label class="field">Produto ou serviço de interesse *<input name="title" required maxlength="120" value="'+esc(d.title||'')+'" placeholder="Ex.: iPhone 17 Pro Max 256 GB"></label><div class="form-two"><label class="field">Valor estimado (R$)<input name="value" type="number" min="0" step="0.01" inputmode="decimal" value="'+esc(d.value||'')+'"></label><label class="field">Etapa<select name="stage">'+stages+'</select></label></div><div class="form-two"><label class="field">Próximo retorno<input name="followup" type="date" value="'+esc(d.followup||'')+'"></label><label class="field">Prioridade<select name="priority">'+['Normal','Alta','Baixa'].map(x=>'<option '+((d.priority||'Normal')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div><label class="field">Resumo da conversa<textarea name="notes" maxlength="1500" placeholder="O que o cliente procura? Qual o próximo passo?">'+esc(d.notes||'')+'</textarea></label><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" type="submit">Salvar oportunidade</button></div></form>';
  modal(d.id?'Editar oportunidade':'Nova oportunidade',body);
  document.getElementById('deal-form').onsubmit=function(ev){
    ev.preventDefault();const f=new FormData(ev.currentTarget),title=String(f.get('title')||'').trim(),contactId=String(f.get('contactId')||'');
    if(!title||!state.contacts.some(c=>c.id===contactId))return;
    const old=state.deals.find(x=>x.id===d.id),stage=String(f.get('stage')||'novo');
    const data={contactId,title,value:Math.max(0,Number(f.get('value')||0)),stage,followup:String(f.get('followup')||''),priority:String(f.get('priority')||'Normal'),notes:String(f.get('notes')||'').trim(),updatedAt:new Date().toISOString()};
    if(stage==='ganho')data.closedAt=old?.closedAt||today();else data.closedAt='';
    if(old)Object.assign(old,data);else state.deals.push({id:id(),createdAt:new Date().toISOString(),...data});
    document.getElementById('modal').close();save();notify(old?'Oportunidade atualizada':'Oportunidade criada');
  };
}
function viewDeal(idValue){
  const d=state.deals.find(x=>x.id===idValue);if(!d)return;const c=contactFor(d),link=c&&phoneLink(c);
  let content='<div class="pill">'+stageOf(d.stage).label+'</div><h2 style="font-size:25px;margin:13px 0 4px">'+esc(d.title)+'</h2><p style="color:var(--muted);margin:0 0 14px">'+esc(c?.name||'Cliente removido')+'</p>';
  content+='<div class="detail-row"><span>Valor estimado</span><b>'+money(d.value)+'</b></div><div class="detail-row"><span>Próximo retorno</span><b>'+dateLabel(d.followup)+'</b></div><div class="detail-row"><span>Prioridade</span><b>'+esc(d.priority||'Normal')+'</b></div>';
  if(d.notes)content+='<p class="notice" style="white-space:pre-wrap">'+esc(d.notes)+'</p>';
  content+='<div class="modal-actions" style="flex-wrap:wrap;justify-content:flex-start">'+(link?'<a class="btn quiet" href="'+link+'" target="_blank" rel="noopener noreferrer">Abrir WhatsApp ↗</a>':'')+'<button class="btn" data-action="edit-deal" data-id="'+d.id+'">Editar</button><button class="btn danger" data-action="delete-deal" data-id="'+d.id+'">Excluir</button></div>';
  modal('Oportunidade',content);
}
function viewContact(idValue){
  const c=state.contacts.find(x=>x.id===idValue);if(!c)return;const link=phoneLink(c),deals=state.deals.filter(d=>d.contactId===c.id);
  let content='<div style="display:flex;gap:12px;align-items:center;margin-bottom:12px"><span class="avatar" style="width:51px;height:51px;font-size:19px">'+esc(initials(c.name))+'</span><div><h2 style="font-size:22px">'+esc(c.name)+'</h2><small>'+esc(c.phone||'Telefone não informado')+'</small></div></div>';
  content+='<div class="detail-row"><span>Origem</span><b>'+esc(c.source||'Não informada')+'</b></div><div class="detail-row"><span>Oportunidades</span><b>'+deals.length+'</b></div>';
  if(c.notes)content+='<p class="notice" style="white-space:pre-wrap">'+esc(c.notes)+'</p>';
  content+='<div class="modal-actions" style="flex-wrap:wrap;justify-content:flex-start">'+(link?'<a class="btn quiet" href="'+link+'" target="_blank" rel="noopener noreferrer">Abrir WhatsApp ↗</a>':'')+'<button class="btn" data-action="edit-contact" data-id="'+c.id+'">Editar</button><button class="btn danger" data-action="delete-contact" data-id="'+c.id+'">Excluir</button></div>';
  if(deals.length)content+='<h2 style="margin:22px 0 9px">Negociações</h2>'+deals.map(d=>'<div class="item"><div class="item-main"><b>'+esc(d.title)+'</b><small>'+stageOf(d.stage).label+'</small></div><b>'+money(d.value)+'</b></div>').join('');
  modal('Cliente',content);
}
function importERP(){
  let db;try{db=JSON.parse(localStorage.getItem('itronic_db_v1')||'null')}catch(_){}
  if(!db||!Array.isArray(db.clientes)){notify('Nenhum cadastro local do iTronic foi encontrado neste navegador.');return}
  let added=0;
  for(const c of db.clientes){
    if(!c?.nome)continue;
    const number=String(c.whatsapp||c.telefone||'').replace(/\D/g,'');
    if(state.contacts.some(x=>x.erpId===c.id||(number&&String(x.phone||'').replace(/\D/g,'')===number)))continue;
    state.contacts.push({id:id(),erpId:c.id||'',name:String(c.nome),phone:String(c.whatsapp||c.telefone||''),source:'iTronic',notes:String(c.obs||''),createdAt:new Date().toISOString()});added++;
  }
  if(added)save();notify(added+' cliente(s) importado(s)');
}
function exportBackup(){
  const file=new Blob([JSON.stringify({app:'iTronic CRM',exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download='itronic-crm-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.addEventListener('click',ev=>{
  const nav=ev.target.closest('[data-view]');if(nav){show(nav.dataset.view);return}
  const btn=ev.target.closest('[data-action]');if(!btn)return;
  const a=btn.dataset.action,ref=btn.dataset.id;
  if(a==='new-contact')contactForm();
  if(a==='new-deal')dealForm();
  if(a==='view-contact')viewContact(ref);
  if(a==='view-deal')viewDeal(ref);
  if(a==='edit-contact'){document.getElementById('modal').close();contactForm(state.contacts.find(c=>c.id===ref))}
  if(a==='edit-deal'){document.getElementById('modal').close();dealForm(state.deals.find(d=>d.id===ref))}
  if(a==='delete-contact'){if(state.deals.some(d=>d.contactId===ref)){notify('Remova as oportunidades do cliente antes de excluí-lo.');return}if(confirm('Excluir este cliente?')){state.contacts=state.contacts.filter(c=>c.id!==ref);document.getElementById('modal').close();save();notify('Cliente excluído')}}
  if(a==='delete-deal'){if(confirm('Excluir esta oportunidade?')){state.deals=state.deals.filter(d=>d.id!==ref);document.getElementById('modal').close();save();notify('Oportunidade excluída')}}
  if(a==='close-modal')document.getElementById('modal').close();
  if(a==='import-erp')importERP();
  if(a==='export')exportBackup();
  if(a==='restore')document.getElementById('backup-input').click();
});
document.getElementById('search').addEventListener('input',ev=>{query=ev.target.value.trim().toLocaleLowerCase('pt-BR');render()});
document.getElementById('modal').addEventListener('click',ev=>{if(ev.target.id==='modal')ev.target.close()});
document.addEventListener('dragstart',ev=>{const card=ev.target.closest('.deal-card');if(card){ev.dataTransfer.setData('text/plain',card.dataset.id);ev.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',ev=>{const col=ev.target.closest('.column');if(col){ev.preventDefault();col.classList.add('dragover')}});
document.addEventListener('dragleave',ev=>{const col=ev.target.closest('.column');if(col&&!col.contains(ev.relatedTarget))col.classList.remove('dragover')});
document.addEventListener('drop',ev=>{const col=ev.target.closest('.column');if(!col)return;ev.preventDefault();col.classList.remove('dragover');const d=state.deals.find(x=>x.id===ev.dataTransfer.getData('text/plain'));if(d&&d.stage!==col.dataset.stage){d.stage=col.dataset.stage;d.updatedAt=new Date().toISOString();d.closedAt=d.stage==='ganho'?today():'';save();notify('Etapa atualizada')}});
document.addEventListener('keydown',ev=>{const card=ev.target.closest('.deal-card');if(card&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();viewDeal(card.dataset.id)}});
const backupInput=document.getElementById('backup-input');
backupInput.addEventListener('change',async ev=>{const file=ev.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.contacts)||!Array.isArray(data.deals))throw new Error('Formato inválido');if(!confirm('Substituir os dados atuais por este backup?'))return;state={version:1,contacts:data.contacts,deals:data.deals};save();notify('Backup restaurado')}catch(_){notify('Arquivo de backup inválido')}finally{backupInput.value=''}});

clickSound.preload='auto';clickSound.volume=.7;let lastSound=-Infinity;
const clickSelector='button,a[href],input,select,textarea,label,[role="button"],[data-action],[data-view]';
function clickedControl(ev){const node=ev.target?.nodeType===1?ev.target:ev.target?.parentElement;return node?.closest(clickSelector)}
function playClick(){const time=performance.now();if(time-lastSound<70)return;lastSound=time;try{clickSound.pause();if(clickSound.readyState>0)clickSound.currentTime=0;const p=clickSound.play();if(p&&typeof p.catch==='function')p.catch(()=>{})}catch(_){} }
document.addEventListener('pointerdown',ev=>{if(!clickedControl(ev))return;playClick();if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<2;i++){const wave=document.createElement('i');wave.className='global-click-wave'+(i?' second':'');wave.style.left=ev.clientX+'px';wave.style.top=ev.clientY+'px';document.body.appendChild(wave);setTimeout(()=>wave.remove(),480)}},true);
document.addEventListener('click',ev=>{if(!ev.isTrusted||!clickedControl(ev))return;if(ev.detail===0)playClick()},true);
render();
