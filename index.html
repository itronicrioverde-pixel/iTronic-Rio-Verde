        <div class="pay-val">${money(vDebito)}</div>
      </div>
      <div class="pay-opt pay-cred">
        <div class="pay-ico">💳</div>
        <div class="pay-mid"><div class="pay-nome">Crédito ${parc}x</div><div class="pay-sub">taxa ${taxaCred}%${imposto?' + imp '+imposto+'%':''}</div></div>
        <div class="pay-val">${money(vCredito)}<div class="pay-parc">${parc}x de ${money(vCredito/parc)}</div></div>

    `;
  }
}

/* ============ FLUXO DE CAIXA ============ */
let caixaPeriodo='dia';
function caixaSaldoHoje(){ return resumoCaixa('dia').saldo; }
function movimentosCaixa(periodo){
  // junta entradas de vendas (automáticas) + lançamentos manuais
  const t=todayStr(), mes=t.slice(0,7);
  const dentro = (data)=> periodo==='dia' ? data===t : data.slice(0,7)===mes;
  const movs=[];
  // vendas = entradas automáticas (valor líquido, na data da venda)
  db.vendas.forEach(v=>{
    if(dentro(v.data)){
      movs.push({ auto:true, tipo:'entrada', data:v.data, hora:v.hora||'',
        cat:'Venda', desc:v.clienteNome+' · '+v.itens.map(i=>i.nome).join(', '),
        valor:vendaCaixa(v), ref:v.id });
    }
  });
  // lançamentos manuais do caixa
  (db.caixa||[]).forEach(m=>{
    if(dentro(m.data)) movs.push(Object.assign({auto:false},m));
  });
  movs.sort((a,b)=> (b.data+ (b.hora||'')).localeCompare(a.data+(a.hora||'')) );
  return movs;
}
function resumoCaixa(periodo){
  const movs=movimentosCaixa(periodo);
  let entrada=0, saida=0;
  movs.forEach(m=>{ if(m.tipo==='entrada') entrada+=Number(m.valor)||0; else saida+=Number(m.valor)||0; });
  return {entrada, saida, saldo:entrada-saida, movs};
}
function openCaixa(periodo){
  caixaPeriodo = periodo||caixaPeriodo||'dia';
  drawCaixa();
}
function drawCaixa(){
  const r=resumoCaixa(caixaPeriodo);
  const isDia=caixaPeriodo==='dia';
  const porCat={};
  r.movs.forEach(m=>{

}

function novaCat(){
  const nome=prompt('Nome da nova categoria:');

  const c=nome.trim();
  if(!db.categorias.includes(c)){ db.categorias.push(c); saveDB(); }

  const grid=el('mv-cats');
  if(grid){
    const nova=document.createElement('div');
    nova.className='p active'; nova.textContent=c;

/* ============ FINANCEIRO ============ */
function diasPara(dateStr){
  if(!dateStr) return null;
  const hoje=new Date(todayStr()+'T12:00');
  const venc=new Date(dateStr+'T12:00');
  return Math.round((venc-hoje)/86400000);
}
function avisoVencimentos(){
  // conta a pagar pendente vencendo em até 5 dias ou vencida
  const proximas=(db.contas||[]).filter(c=>c.status!=='pago'&&c.tipo==='pagar'&&c.venc).map(c=>({c,d:diasPara(c.venc)})).filter(x=>x.d!==null&&x.d<=5).sort((a,b)=>a.d-b.d);
  if(proximas.length===0) return '';
  const x=proximas[0];
  const txt = x.d<0 ? `Venceu há ${Math.abs(x.d)} dia(s)` : x.d===0 ? 'Vence hoje' : `Vence em ${x.d} dia(s)`;
  const extra = proximas.length>1 ? ` · +${proximas.length-1} conta(s)` : '';
  return `<div class="stat" onclick="openFinanceiro('pagar')" style="cursor:pointer;margin-top:12px;background:linear-gradient(135deg,rgba(255,59,48,.12),rgba(255,59,48,.04))">
    <div class="lbl" style="color:var(--red)">⚠️ Conta a pagar</div>
    <div style="font-weight:600;margin-top:4px">${x.c.desc||'Conta'} — ${money(x.c.valor)}</div>
    <div style="font-size:12px;color:var(--text2);margin-top:2px">${txt}${extra}</div>
  </div>`;
}
let finTab='pagar';
function openFinanceiro(tipo){
  finTab=tipo||'pagar';
  drawFinanceiro();
}
function drawFinanceiro(){
  const contas=(db.contas||[]).filter(c=>c.tipo===finTab);
  const pend=contas.filter(c=>c.status!=='pago');
  const pagas=contas.filter(c=>c.status==='pago');
  const totalPend=pend.reduce((s,c)=>s+(Number(c.valor)||0),0);
  // ordena pendentes por vencimento
  pend.sort((a,b)=>(a.venc||'9999').localeCompare(b.venc||'9999'));
  const isPagar=finTab==='pagar';
  const rotulo=isPagar?'Total a pagar':'Total a receber';

  const linha=(c)=>{
    const d=diasPara(c.venc);
    let sub='';
    if(c.venc){
      if(d<0) sub=`<span style="color:var(--red)">Venceu há ${Math.abs(d)}d</span>`;
      else if(d===0) sub=`<span style="color:var(--orange)">Vence hoje</span>`;
      else if(d<=5) sub=`<span style="color:var(--orange)">Vence em ${d}d</span>`;
      else sub=`Vence ${fmtData(c.venc)}`;
    }
    return `<div class="row" onclick="openContaDetail('${c.id}')">
      <div class="thumb">${isPagar?'📤':'📥'}</div>
      <div class="info"><div class="t">${c.desc||'Conta'}</div><div class="s">${[c.fornecedor||c.cliente||'',sub].filter(Boolean).join(' · ')}</div></div>
      <div class="right"><div class="p money-in">${money(c.valor)}</div></div>
    </div>`;
  };

  const html=`
    <div class="seg" style="margin-bottom:16px">
      <button class="${isPagar?'active':''}" onclick="finTab='pagar';drawFinanceiro()">A pagar</button>
      <button class="${!isPagar?'active':''}" onclick="finTab='receber';drawFinanceiro()">A receber</button>
    </div>
    <div class="stat" style="margin-bottom:14px">
      <div class="lbl">${rotulo}</div>
      <div class="val money-in ${isPagar?(totalPend>0?'neg':''):(totalPend>0?'pos':'')}">${money(totalPend)}</div>
      <div style="font-size:12px;color:var(--text2);margin-top:2px">${pend.length} conta(s) pendente(s)</div>
    </div>
    <button class="btn" onclick="openConta(null,'${finTab}')">+ Nova conta ${isPagar?'a pagar':'a receber'}</button>

    <div class="sec-title">Pendentes</div>
    ${pend.length?`<div class="list">${pend.map(linha).join('')}</div>`:`<div class="empty" style="padding:26px">Nenhuma conta pendente.</div>`}

    ${finTab==='receber'?dividasDeVenda():''}

    ${pagas.length?`<div class="sec-title">Pagas / Recebidas</div><div class="list">${pagas.slice().reverse().map(linha).join('')}</div>`:''}
    <div style="height:20px"></div>
  `;
  openSheet(isPagar?'Contas a pagar':'Contas a receber', html);
}
function dividasDeVenda(){
  // mostra também o que clientes devem de vendas (a receber que veio de venda)
  const dev=db.vendas.filter(v=>Number(v.aReceber)>0);
  if(dev.length===0) return '';
  return `<div class="sec-title">De vendas (clientes devendo)</div><div class="list">${dev.map(v=>`
    <div class="row" onclick="openVendaDetail('${v.id}')">
      <div class="thumb">${thumbVenda(v)}</div>
      <div class="info"><div class="t">${v.clienteNome}</div><div class="s">${v.itens.map(i=>i.nome).join(', ')} · ${fmtData(v.data)}</div></div>
      <div class="right"><div class="p money-in neg">${money(v.aReceber)}</div></div>
    </div>`).join('')}</div>`;
}
function openConta(id,tipoDefault){
  const c = id ? db.contas.find(x=>x.id===id) : {tipo:tipoDefault||'pagar'};
  const isPagar=c.tipo==='pagar';
  const html=`
    ${fld(isPagar?'Descrição (ex: fornecedor, aluguel)':'Descrição (ex: cliente, serviço)','ct-desc',{val:c.desc,ph:isPagar?'Fornecedor X - iPhones':'Fulano - conserto'})}
    ${fld(isPagar?'Fornecedor/quem':'Cliente/quem','ct-quem',{val:c.fornecedor||c.cliente,ph:'nome (opcional)'})}
    ${fld('Valor','ct-valor',{val:c.valor,ph:'0,00',inputmode:'decimal'})}
    ${fld('Vencimento','ct-venc',{type:'date',val:c.venc||todayStr()})}
    <div class="field"><label>Observações</label><textarea class="input" id="ct-obs" rows="2" placeholder="opcional">${c.obs||''}</textarea></div>
    <div style="height:10px"></div>
  `;
  openSheet(id?'Editar conta':(isPagar?'Nova conta a pagar':'Nova conta a receber'), html, 'Salvar', ()=>saveConta(id,c.tipo));
}
function saveConta(id,tipo){
  const desc=getV('ct-desc'); const valor=getN('ct-valor');
  if(!desc){ toast('Informe a descrição'); return; }
  if(valor<=0){ toast('Informe o valor'); return; }
  const data={tipo, desc, valor, venc:getV('ct-venc'), obs:el('ct-obs').value.trim()};
  const quem=getV('ct-quem');
  if(tipo==='pagar') data.fornecedor=quem; else data.cliente=quem;
  if(id){
    Object.assign(db.contas.find(c=>c.id===id),data); toast('Conta atualizada');
  }else{
    data.id=uid(); data.status='pendente'; data.criado=todayStr();
    db.contas.push(data); toast('Conta lançada');
  }
  saveDB(); drawFinanceiro();
}
function openContaDetail(id){
  const c=db.contas.find(x=>x.id===id); if(!c)return;
  const isPagar=c.tipo==='pagar';
  const d=diasPara(c.venc);
  let vencTxt=c.venc?fmtData(c.venc):'—';
  if(c.status!=='pago'&&c.venc){
    if(d<0) vencTxt+=` (venceu há ${Math.abs(d)}d)`;
    else if(d===0) vencTxt+=' (hoje)';
    else vencTxt+=` (em ${d}d)`;
  }
  const html=`
    <div class="big-num money-in">${money(c.valor)}</div>
    <div style="text-align:center;margin-bottom:16px"><span class="badge ${c.status==='pago'?'vend':(isPagar?'res':'disp')}">${c.status==='pago'?(isPagar?'Pago':'Recebido'):'Pendente'}</span></div>
    <div class="card" style="padding:2px 16px">
      <div class="detail-line"><span class="k">Descrição</span><span class="v">${c.desc}</span></div>
      ${(c.fornecedor||c.cliente)?`<div class="detail-line"><span class="k">${isPagar?'Fornecedor':'Cliente'}</span><span class="v">${c.fornecedor||c.cliente}</span></div>`:''}
      <div class="detail-line"><span class="k">Vencimento</span><span class="v">${vencTxt}</span></div>
      ${c.obs?`<div class="detail-line"><span class="k">Obs</span><span class="v" style="max-width:60%">${c.obs}</span></div>`:''}
    </div>
    ${c.status!=='pago'?`<button class="btn" onclick="quitarConta('${c.id}')" style="margin-top:14px;background:var(--green)">${isPagar?'Marcar como paga':'Marcar como recebida'}</button>`:`<button class="btn secondary" onclick="reabrirConta('${c.id}')" style="margin-top:14px">Reabrir (marcar pendente)</button>`}
    <button class="btn secondary" onclick="openConta('${c.id}')" style="margin-top:8px">Editar</button>
    <button class="btn danger" onclick="delConta('${c.id}')" style="margin-top:8px">Remover conta</button>
    <div style="height:30px"></div>
  `;
  openSheet('Detalhes da conta', html);
}
function quitarConta(id){ const c=db.contas.find(x=>x.id===id); c.status='pago'; c.pagoEm=todayStr(); saveDB(); closeSheet(); if(currentTab==='dash')render('dash'); toast(c.tipo==='pagar'?'Conta paga ✓':'Conta recebida ✓'); }
function reabrirConta(id){ const c=db.contas.find(x=>x.id===id); c.status='pendente'; delete c.pagoEm; saveDB(); closeSheet(); toast('Conta reaberta'); }
function delConta(id){ askConfirm('Remover esta conta?', ()=>{ db.contas=db.contas.filter(c=>c.id!==id); saveDB(); closeSheet(); if(currentTab==='dash')render('dash'); toast('Conta removida'); }); }

function relVendas(){
  const todos = relMesSelecionado==='todos';
  const mes=todos?'todos':(relMesSelecionado||todayStr().slice(0,7));
  const nomes=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  let nomeMes='Todos os meses';
  if(!todos){ const[a,mm]=mes.split('-'); nomeMes=nomes[parseInt(mm)-1]+'/'+a; }
  const vs=(todos?vendasVisiveis():vendasVisiveis().filter(v=>v.data.slice(0,7)===mes)).slice().reverse();
  const totalMes=vs.reduce((s,v)=>s+vendaLiquido(v),0);
  const html=vs.length?`
    <div class="card" style="padding:2px 16px;margin-bottom:12px">
      <div class="detail-line"><span class="k">Vendas em ${nomeMes}</span><span class="v">${vs.length}</span></div>

    </div>
    <div class="list">${vs.map(v=>`<div class="row" onclick="openVendaDetail('${v.id}')"><div class="thumb">${thumbVenda(v)}</div><div class="info"><div class="t">${v.itens.map(i=>i.nome).join(', ')}</div><div class="s">${v.clienteNome} · ${fmtData(v.data)}</div></div><div class="right"><div class="p money-in">${money(vendaLiquido(v))}</div></div></div>`).join('')}</div>`:`<div class="empty">Nenhuma venda em ${nomeMes}.</div>`;
  openSheet('Vendas · '+nomeMes, html);
}

      const usuariosAtuais = db.users; // preserva os logins de acesso

      db.users = usuariosAtuais;
      saveDB();
      closeSheet();
      go('dash');

}

    ${fld('Parcelas no cartão (sem juros)','cp-parc',{ph:'3',val:c.parcelasCartao,inputmode:'numeric'})}
    <label style="display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px"><input type="checkbox" id="cp-dinheiro" ${c.mostrarDinheiro!==false?'checked':''}> Mostrar "Dinheiro com desconto"</label>
    ${fld('Desconto no dinheiro (%)','cp-desc',{ph:'5',val:c.descontoDinheiro,inputmode:'numeric'})}
  `;
  openSheet('Condições de pagamento', html, 'Salvar', ()=>{

    };

function openUsuarios(){
  const html=`
    <button class="btn secondary" onclick="closeSheet();setTimeout(openNovoUser,320)" style="margin-bottom:14px">+ Novo usuário</button>
    <div class="list">${db.users.map(u=>{
      const ehAdmin=u.role==='Administrador';
      const perm = ehAdmin ? 'Vê tudo' : (u.vePainel?'Vê Painel ✅':'Sem Painel');
      const btnPerm = ehAdmin ? '' : `<button onclick="toggleVePainel('${u.id}')" style="color:var(--blue);font-size:13px">${u.vePainel?'Tirar Painel':'Dar Painel'}</button>`;
      return `<div class="row"><div class="thumb">👤</div><div class="info"><div class="t">${u.nome}</div><div class="s">${u.user} · ${u.role} · ${perm}</div></div>${btnPerm}${u.user!=='admin'?`<button onclick="delUser('${u.id}')" style="color:var(--red);margin-left:10px">Excluir</button>`:''}</div>`;
    }).join('')}</div>
  `;
  openSheet('Usuários', html);
}
function toggleVePainel(id){
  const u=db.users.find(x=>x.id===id);
  if(!u) return;
  u.vePainel=!u.vePainel;
  // se for o usuário logado, atualiza a sessão na hora
  if(session && session.id===id){ session.vePainel=u.vePainel; aplicarPermissoes(); }
  saveDB(); openUsuarios();
  toast(u.vePainel?'Painel liberado':'Painel bloqueado');
}
function openNovoUser(){
  const html=`
    ${fld('Nome','u-nome',{ph:'nome do funcionário'})}
    ${fld('Usuário (login)','u-user',{ph:'ex: joao'})}
    ${fld('Senha','u-pass',{ph:'senha'})}
    ${selFld('Nível de acesso','u-role',['Vendedor','Administrador'],'Vendedor')}
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px"><input type="checkbox" id="u-vepainel"> Pode ver Painel e Relatórios</label>
  `;
  openSheet('Novo usuário', html, 'Salvar', ()=>{
    const nome=getV('u-nome'),user=getV('u-user').toLowerCase(),pass=getV('u-pass');
    if(!nome||!user||!pass){toast('Preencha tudo');return;}
    if(db.users.some(x=>x.user===user)){toast('Usuário já existe');return;}
    const vePainel=el('u-vepainel')&&el('u-vepainel').checked;
    db.users.push({id:uid(),nome,user,pass,role:getV('u-role'),vePainel});
    saveDB(); closeSheet(); toast('Usuário criado');
  });
}
function delUser(id){ askConfirm('Remover este usuário?', ()=>{ db.users=db.users.filter(u=>u.id!==id); saveDB(); openUsuarios(); toast('Usuário removido'); }); }
function openLogins(){
  const html=db.logins.length?`<div class="list">${db.logins.slice(0,80).map(l=>`<div class="row"><div class="thumb">🔑</div><div class="info"><div class="t">${l.nome}</div><div class="s">${fmtData(l.data)} · ${l.hora}</div></div></div>`).join('')}</div>`:`<div class="empty">Nenhum registro.</div>`;
  openSheet('Acessos', html);
}

/* ============ BACKUP ============ */
function montarBackupCompleto(){
  // devolve uma cópia do db com as fotos embutidas (resolve refs pelo cache) — backup completo
  const copia=JSON.parse(JSON.stringify(db));
  const embutir=(arr)=>{ (arr||[]).forEach(o=>{ if(Array.isArray(o.fotos)) o.fotos=o.fotos.map(f=> ehRefFoto(f) ? (window.fotoCache[idDaRef(f)]||f) : f ); }); };
  embutir(copia.produtos); embutir(copia.acessorios); embutir(copia.servicos);
  return JSON.stringify(copia);
}
function exportBackup(){
  const dados=montarBackupCompleto();
  const kb=Math.round(dados.length/1024);
  const html=`
    <div style="text-align:center;margin:6px 0 4px">
      <div class="thumb" style="width:60px;height:60px;font-size:28px;margin:0 auto 12px">💾</div>
      <div style="font-size:15px;color:var(--text2);line-height:1.5;padding:0 6px">Escolha onde salvar a cópia dos seus dados.<br>Guarde num lugar seguro fora do celular.</div>
    </div>
    <div class="list" style="margin-top:18px">
      <div class="row" onclick="bkpArquivos()"><div class="thumb">📁</div><div class="info"><div class="t">Salvar no aparelho</div><div class="s">Baixa o arquivo · o iPhone pergunta onde guardar</div></div>${chev()}</div>
      <div class="row" onclick="bkpWhatsapp()"><div class="thumb">💬</div><div class="info"><div class="t">Enviar pelo WhatsApp</div><div class="s">Abre o WhatsApp pra você mandar pra si mesmo</div></div>${chev()}</div>
      <div class="row" onclick="bkpCopiar()"><div class="thumb">📋</div><div class="info"><div class="t">Copiar</div><div class="s">Copia os dados pra colar onde quiser</div></div>${chev()}</div>
    </div>
    <div style="text-align:center;color:var(--text2);font-size:12px;margin-top:14px">Tamanho do backup: ${kb} KB</div>
    <div style="height:20px"></div>
  `;
  openSheet('Salvar backup', html);
}
async function bkpArquivos(){
  const nome='itronic-backup-'+todayStr()+'.json';
  const dados=montarBackupCompleto();
  // Melhor caminho no iPhone: compartilhar o ARQUIVO pela tela nativa do iOS
  // (abre "Salvar em Arquivos", WhatsApp, etc). Só funciona por HTTPS.
  try{
    if(navigator.canShare){
      const file=new File([dados],nome,{type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'Backup iTronic'});
        toast('Backup pronto para salvar');
        return;
      }
    }
  }catch(e){
    if(e&&e.name==='AbortError'){ return; } // usuário cancelou, tudo bem
  }
  // Reserva: download tradicional
  try{
    const blob=new Blob([dados],{type:'application/octet-stream'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('Backup baixado');
  }catch(e){
    toast('Não consegui salvar. Use a opção Copiar.');
  }
}
function bkpWhatsapp(){
  const dados=montarBackupCompleto();
  // WhatsApp por link só manda texto. Backups grandes (com muitas fotos) não cabem.
  if(dados.length > 30000){
    askConfirm('Este backup é grande (tem fotos) e não cabe no WhatsApp como mensagem. Use "Salvar no aparelho" e depois anexe o arquivo no WhatsApp manualmente.', bkpArquivos, 'Salvar no aparelho');
    return;
  }
  const txt='Backup iTronic '+todayStr()+' (não apague, serve para restaurar o sistema):\n\n'+dados;
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
  toast('Abrindo WhatsApp...');
}
function bkpCopiar(){
  const dados=montarBackupCompleto();
  const done=()=>toast('Backup copiado ✓');
  const fail=()=>toast('Não consegui copiar. Use Salvar no aparelho.');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(dados).then(done).catch(fail);
  }else{
    // fallback antigo
    const ta=document.createElement('textarea'); ta.value=dados; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ fail(); } ta.remove();
  }
}
function importBackup(e){
  const file=e.target.files[0]; if(!file)return;
  const doImport=()=>{
    const r=new FileReader();
    r.onload=()=>{ try{ db=JSON.parse(r.result); if(!db.logins)db.logins=[]; saveDB(); applyTheme(); closeSheet(); render(currentTab); toast('Backup restaurado'); }catch(err){ toast('Arquivo inválido'); } };
    r.readAsText(file);
  };
  e.target.value='';
  askConfirm('Importar vai substituir todos os dados atuais. Continuar?', doImport, 'Importar');
}

/* ============ UTIL ============ */
function fotoVenda(v){
  const it=(v.itens||[])[0];
  if(it){
    if(it.prodId){ const p=db.produtos.find(x=>x.id===it.prodId); if(p&&temFoto(p.fotos&&p.fotos[0])) return imgFoto(p.fotos[0]); }
    if(it.acessId){ const a=(db.acessorios||[]).find(x=>x.id===it.acessId); if(a&&temFoto(a.fotos&&a.fotos[0])) return imgFoto(a.fotos[0]); }
  }
  return null;
}
function thumbVenda(v,fallback){
  const f=fotoVenda(v);
  return f?`<img src="${f}">`:(fallback||'🧾');
}
function fmtData(s){ if(!s)return'—'; const d=new Date(s.length<=10?s+'T12:00':s); return d.toLocaleDateString('pt-BR'); }
let toastT;
function toast(msg){
  const t=el('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

/* confirmação própria (o confirm nativo é bloqueado em muitos navegadores de celular) */
let confirmFn=null;
function askConfirm(msg, onYes, yesLabel){
  confirmFn=onYes;
  el('confirm-msg').textContent=msg;
  el('confirm-yes').textContent=yesLabel||'Remover';
  el('confirm-bg').classList.add('show');
}
function confirmYes(){ el('confirm-bg').classList.remove('show'); if(confirmFn){const f=confirmFn;confirmFn=null;f();} }
function confirmNo(){ el('confirm-bg').classList.remove('show'); confirmFn=null; }
