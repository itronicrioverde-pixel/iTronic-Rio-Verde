<style>
:root{
  --bg:#ffffff;
  --bg2:#f5f5f7;
  --card:#ffffff;
  --text:#1d1d1f;
  --text2:#6e6e73;
  --line:#e5e5ea;
  --blue:#467a3d;
  --blueh:#365f30;
  --green:#34c759;
  --red:#ff3b30;
  --orange:#ff9500;
  --purple:#af52de;
  --shadow:0 2px 8px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03);
  --shadow-lg:0 8px 28px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.05);
  --radius:20px;
  --radius-sm:14px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
.dark{
  --bg:#000000;
  --bg2:#1c1c1e;
  --card:#1c1c1e;
  --text:#f5f5f7;
  --text2:#98989d;
  --line:#38383a;
  --blue:#0a84ff;
  --blueh:#409cff;
  --green:#30d158;
  --red:#ff453a;
  --orange:#ff9f0a;
  --purple:#bf5af2;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  background:var(--bg2);
  color:var(--text);
  font-size:16px;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
input,select,textarea,button{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{display:none}

/* ---------- LOGIN ---------- */
#login{
  position:fixed;inset:0;background:var(--bg);z-index:200;
  display:flex;flex-direction:column;justify-content:center;
  padding:32px 26px calc(32px + var(--safe-b));
}
.logo-box{text-align:center;margin-bottom:40px}
.brand-logo{width:220px;max-width:70%;height:auto;display:block;margin:0 auto}
.dash-logo{width:180px}
.logo-mark{
  width:76px;height:76px;border-radius:20px;margin:0 auto 18px;
  background:linear-gradient(160deg,#1d1d1f,#3a3a3c);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
}
.dark .logo-mark{background:linear-gradient(160deg,#2c2c2e,#48484a)}
.logo-mark svg{width:40px;height:40px}
.logo-title{font-size:26px;font-weight:700;letter-spacing:-.5px}
.logo-sub{color:var(--text2);font-size:15px;margin-top:3px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--text2);margin:0 0 6px 4px;font-weight:500}
.input{
  width:100%;background:var(--bg2);border:1px solid transparent;
  border-radius:var(--radius-sm);padding:15px 16px;outline:none;color:var(--text);
  transition:border-color .15s;
}
.input:focus{border-color:var(--blue)}
.dark .input{background:#1c1c1e}
select.input{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236e6e73' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 16px center;padding-right:44px}
.btn{
  width:100%;background:var(--blue);color:#fff;border-radius:15px;
  padding:16px;font-size:17px;font-weight:600;transition:opacity .15s,transform .1s,box-shadow .15s;
  border:none;cursor:pointer;display:block;text-align:center;-webkit-appearance:none;appearance:none;
  box-shadow:0 4px 14px rgba(0,113,227,.25);
}
.btn *{pointer-events:none}
.btn:active{opacity:.9;transform:scale(.98)}
.btn.secondary{background:var(--bg2);color:var(--text);box-shadow:none}
.dark .btn.secondary{background:#2c2c2e}
.btn.ghost{background:none;color:var(--blue);font-weight:500}
.btn.danger{background:var(--red);color:#fff}
.login-hint{text-align:center;color:var(--text2);font-size:13px;margin-top:22px;line-height:1.6}
.login-version{text-align:center;margin-top:40px;font-size:12px;font-weight:700;letter-spacing:3px;color:var(--text2);opacity:.55}
.login-version span{font-weight:400;letter-spacing:1px;opacity:.8}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100dvh;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 10px)}
.topbar{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg2) 82%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 20px 10px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:.5px solid var(--line);
}
.topbar h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.topbar .actions{display:flex;gap:6px;align-items:center}
.icon-btn{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--card);box-shadow:var(--shadow);color:var(--text);
}
.icon-btn svg{width:19px;height:19px}
.icon-btn:active{opacity:.6}
.cart-btn{position:relative}
.cart-badge{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg2)}
.page{display:none;padding:16px 16px calc(80px + var(--safe-b));animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- BOTTOM NAV ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);
  display:flex;align-items:flex-start;justify-content:space-around;
  padding-bottom:max(6px, calc(var(--safe-b) - 8px));
  padding-top:10px;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:2px 0;color:var(--text2);min-width:0}
.tab svg{width:23px;height:23px}
.tab-emoji{font-size:32px;line-height:1}
.tab.active .tab-emoji{transform:scale(1.05)}
.tab span{font-size:13px;font-weight:600;white-space:nowrap}
.tab.active{color:var(--blue)}

/* ---------- CARDS / GRID ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px 16px;transition:transform .12s}
.stat:active{transform:scale(.98)}
.stat .lbl{font-size:12.5px;color:var(--text2);font-weight:500;display:flex;align-items:center;gap:5px}
.stat .lbl svg{width:14px;height:14px}
.stat .val{font-size:24px;font-weight:800;letter-spacing:-.6px;margin-top:7px}
.stat .val.sm{font-size:20px}
.sec-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin:24px 4px 11px}
.sec-title:first-child{margin-top:6px}

/* ---------- LIST ROWS ---------- */
.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:.5px solid var(--line);position:relative}
.row:last-child{border-bottom:none}
.row:active{background:var(--bg2)}
.row .thumb{width:48px;height:48px;border-radius:13px;background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px}
.row .thumb img{width:100%;height:100%;object-fit:cover}
.row .info{flex:1;min-width:0}
.row .info .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .info .s{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .right{text-align:right;flex-shrink:0}
.row .right .p{font-weight:600;font-size:15px}
.chevron{color:var(--text2);opacity:.5}
.chevron svg{width:16px;height:16px;display:block}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-top:3px}
.badge.disp{background:rgba(52,199,89,.15);color:var(--green)}
.badge.res{background:rgba(255,149,0,.15);color:var(--orange)}
.badge.vend{background:rgba(142,142,147,.18);color:var(--text2)}
.empty{text-align:center;color:var(--text2);padding:50px 20px;font-size:15px}
.empty svg{width:44px;height:44px;opacity:.35;margin-bottom:12px}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.search svg{width:18px;height:18px;color:var(--text2);flex-shrink:0}
.search input{border:none;background:none;outline:none;flex:1;color:var(--text)}
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.chip{white-space:nowrap;padding:7px 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:500;color:var(--text2)}
.chip.active{background:var(--blue);color:#fff}

/* FAB */
.fab{
  position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:70;
  width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,113,227,.4);
}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.92)}

/* ---------- MODAL / SHEET ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--bg);
  border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:calc(100vh - env(safe-area-inset-top,0px) - 12px);display:flex;flex-direction:column;
  pointer-events:none;
}
.sheet.show{transform:translateY(0);pointer-events:auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 10px;border-bottom:.5px solid var(--line);flex-shrink:0}
.sheet-head .grip{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:36px;height:5px;border-radius:3px;background:var(--line)}
.sheet-head h2{font-size:18px;font-weight:700}
.sheet-body{overflow-y:auto;padding:16px 18px calc(24px + var(--safe-b));flex:1}
.sheet-head .x{color:var(--blue);font-weight:500;font-size:16px}
.sheet-head .save{color:var(--blue);font-weight:600;font-size:16px}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:.5px solid var(--line);font-size:15px}
.detail-line:last-child{border-bottom:none}
.detail-line .k{color:var(--text2)}
.detail-line .v{font-weight:600;text-align:right}
.big-num{font-size:34px;font-weight:700;letter-spacing:-1px;text-align:center;margin:6px 0}
.pill-select{display:flex;flex-wrap:wrap;gap:8px}
.pill-select .p{padding:9px 15px;border-radius:20px;background:var(--bg2);font-size:14px;font-weight:500}
.pill-select .p.active{background:var(--blue);color:#fff}
.dark .pill-select .p{background:#2c2c2e}
.dark .pill-select .p.active{background:var(--blue)}

.photo-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photo-grid .ph{width:70px;height:70px;border-radius:12px;object-fit:cover;position:relative}
.photo-add{width:70px;height:70px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--text2)}
.dark .photo-add{background:#2c2c2e}
.photo-wrap{position:relative}
.photo-wrap .del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0) + 16px);transform:translateX(-50%) translateY(-80px);z-index:300;background:rgba(30,30,32,.95);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:transform .3s;max-width:88%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:32px;opacity:0;pointer-events:none;transition:opacity .2s}
.confirm-bg.show{opacity:1;pointer-events:auto}
.confirm-box{background:var(--bg);border-radius:20px;max-width:320px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);transform:scale(.92);transition:transform .2s}
.confirm-bg.show .confirm-box{transform:scale(1)}
.confirm-msg{font-size:16px;text-align:center;margin-bottom:20px;line-height:1.45}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{flex:1;padding:13px;border-radius:12px;font-size:16px;font-weight:600}
.confirm-cancel{background:var(--bg2);color:var(--text)}
.dark .confirm-cancel{background:#2c2c2e}
.confirm-ok{background:var(--red);color:#fff}

.money-in{font-variant-numeric:tabular-nums}
.pos{color:var(--green)}
.neg{color:var(--red)}
.divider{height:.5px;background:var(--line);margin:14px 0}
.mini-lbl{font-size:13px;color:var(--text2);margin:0 4px 6px;font-weight:500}
.pay-opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;margin-bottom:10px;border:1.5px solid transparent}
.pay-opt .pay-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.6);flex-shrink:0}
.pay-opt .pay-mid{flex:1;min-width:0}
.pay-opt .pay-nome{font-weight:700;font-size:16px;color:#1d1d1f}
.pay-opt .pay-sub{font-size:12px;color:#6e6e73;margin-top:1px}
.pay-opt .pay-val{font-weight:800;font-size:18px;text-align:right;color:#1d1d1f}
.pay-opt .pay-parc{font-size:12px;font-weight:600;color:#6e6e73;margin-top:2px}
.pay-pix{background:linear-gradient(135deg,#e3f9ee,#d0f5e2);border-color:#34c759}
.pay-pix .pay-val{color:#1a8f4a}
.pay-deb{background:linear-gradient(135deg,#e7f0ff,#dbe8ff);border-color:#3b82f6}
.pay-deb .pay-val{color:#1d5fd4}
.pay-cred{background:linear-gradient(135deg,#f3ecff,#e9dcff);border-color:#8b5cf6}
.pay-cred .pay-val{color:#6d28d9}
.sim-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.sim-difer-box{background:linear-gradient(135deg,#1d1d1f,#3a3a3c);border-radius:18px;padding:18px 20px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.sim-difer-box .k{color:rgba(255,255,255,.7);font-size:14px}
.sim-difer-box .v{color:#fff;font-size:26px;font-weight:800}
.inline-2{display:flex;gap:10px;align-items:center}
.link-row{padding:14px 16px;font-size:16px;color:var(--text);display:flex;justify-content:space-between;align-items:center;border-bottom:.5px solid var(--line)}
.link-row:last-child{border-bottom:none}
.link-row .rv{color:var(--text2)}
.seg{display:flex;background:var(--bg2);border-radius:10px;padding:3px;margin-bottom:14px}
.dark .seg{background:#1c1c1e}
.seg button{flex:1;padding:8px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text2)}
.seg button.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* ============ RESPONSIVO ============ */
/* No celular fica como está. A partir de tablet, o conteúdo é centralizado
   e as gavetas de baixo viram um cartão centralizado na tela. */
@media (min-width:768px){
  body{background:var(--bg2)}
  /* login vira um cartão centralizado */
  #login{align-items:center;background:var(--bg2)}
  #login > *{width:100%;max-width:380px}
  .logo-box{max-width:380px}
  /* barra do topo e conteúdo centralizados numa coluna confortável */
  .topbar{padding-left:max(20px,calc((100% - 720px)/2));padding-right:max(20px,calc((100% - 720px)/2))}
  .page{max-width:720px;margin:0 auto;padding:20px 20px 0}
  #app{padding-bottom:calc(var(--nav-h) + 24px)}

  /* menu de navegação centralizado, sem grudar nas bordas */
  .tabbar{padding-left:calc((100% - 560px)/2);padding-right:calc((100% - 560px)/2)}

  /* FAB acompanha a coluna central */
  .fab{right:calc((100% - 720px)/2 + 8px)}

  /* as gavetas viram modal centralizado */
  .sheet{
    left:50%;right:auto;bottom:auto;top:50%;
    width:600px;max-width:92vw;max-height:88vh;
    border-radius:20px;
    transform:translate(-50%,-50%) scale(.96);
    opacity:0;transition:opacity .25s,transform .25s;
  }
  .sheet.show{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet-head{padding-top:16px}
  .sheet-head .grip{display:none}
  .sheet-body{padding-bottom:24px}
}

/* Notebook / desktop: aproveita mais espaço nas estatísticas */
@media (min-width:1024px){
  .topbar{padding-left:max(20px,calc((100% - 860px)/2));padding-right:max(20px,calc((100% - 860px)/2))}
  .page{max-width:860px}
  .fab{right:calc((100% - 860px)/2 + 8px)}
  /* dashboard e estoque: os pares de cartões viram quatro colunas quando fizer sentido */
  .grid2{grid-template-columns:repeat(2,1fr)}
}

/* Desktop largo */
@media (min-width:1280px){
  .topbar{padding-left:max(20px,calc((100% - 960px)/2));padding-right:max(20px,calc((100% - 960px)/2))}
  .page{max-width:960px}
  .fab{right:calc((100% - 960px)/2 + 8px)}
}

/* Em telas grandes, mouse tem hover — dá um retorno visual nas linhas */
@media (hover:hover) and (min-width:768px){
  .row:hover{background:var(--bg2);cursor:pointer}
  .chip:hover,.link-row:hover{cursor:pointer}
  .fab:hover{filter:brightness(1.05)}
}
/* ============ ITRONIC · DIREÇÃO A (ATELIER) ============ */
:root{
  --brand:#a5db00;
  --brand-deep:#2e5b33;
  --brand-ink:#152513;
  --bg:#ffffff;
  --bg2:#f3f6ef;
  --card:#ffffff;
  --text:#19231b;
  --text2:#667368;
  --line:#e2e9df;
  --blue:#315c37;
  --blueh:#254b2c;
  --green:#257c48;
  --shadow:0 8px 28px rgba(20,45,25,.055),0 1px 4px rgba(20,45,25,.035);
  --shadow-lg:0 22px 60px rgba(20,45,25,.15);
  --radius:20px;
  --radius-sm:13px;
}
.dark{
  --bg:#14221a;
  --bg2:#0d1912;
  --card:#1a2a20;
  --text:#eef6ea;
  --text2:#a4baa5;
  --line:#314638;
  --blue:#b6e958;
  --blueh:#c7f277;
  --green:#86d39a;
  --shadow:0 10px 30px rgba(0,0,0,.17);
}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;letter-spacing:-.01em;background:var(--bg2)}
#login{background:radial-gradient(circle at 80% 12%,rgba(165,219,0,.16),transparent 36%),var(--bg2)}
.logo-box{margin-bottom:34px}
.brand-logo{width:204px}
.logo-sub{font-size:13px;letter-spacing:.01em}
.login-version{color:var(--text2)}
.input{border-color:var(--line);background:var(--card);transition:border-color .18s,box-shadow .18s}
.input:focus{border-color:var(--brand-deep);box-shadow:0 0 0 3px rgba(165,219,0,.19)}
.dark .input{background:var(--card)}
.btn{background:var(--brand);color:var(--brand-ink);border-radius:14px;box-shadow:0 8px 19px rgba(105,160,0,.18);font-size:15px}
.btn:hover{filter:brightness(.98);box-shadow:0 10px 23px rgba(105,160,0,.23)}
.btn.ghost{color:var(--blue);box-shadow:none}
.btn.secondary{background:var(--card);border:1px solid var(--line)}
.btn.danger{background:var(--red);color:#fff;box-shadow:none}
.btn[style*="background:#25D366"]{background:var(--brand)!important;color:var(--brand-ink)!important}
.dash-welcome{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 22px}
.dash-kicker{font-size:11px;letter-spacing:.11em;color:#507536;font-weight:850;text-transform:uppercase}
.dash-welcome h2{font-size:clamp(25px,2.5vw,35px);line-height:1.08;letter-spacing:-.045em;margin:6px 0}
.dash-welcome p{color:var(--text2);font-size:13px;margin:0}
.dash-welcome .dash-action{border:0;background:var(--brand);color:var(--brand-ink);border-radius:13px;padding:11px 17px;font-weight:800;font-size:12px;box-shadow:0 8px 16px rgba(148,201,27,.15);white-space:nowrap;transition:transform .18s,box-shadow .18s}
.dash-welcome .dash-action:hover{transform:translateY(-2px);box-shadow:0 12px 20px rgba(148,201,27,.23)}
.dark .dash-kicker{color:#c4e97c}
.dash-kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dash-kpi,.dash-panel{background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}
.dash-kpi{padding:17px;min-width:0;min-height:122px;transition:transform .2s,box-shadow .2s}
.dash-kpi:hover{transform:translateY(-2px);box-shadow:0 15px 36px rgba(20,45,25,.10)}
.dash-kpi-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#f1f7e2;color:#3d713b;margin-bottom:16px}
.dash-kpi-icon svg{width:17px;height:17px}
.dash-kpi-label{font-size:11px;color:var(--text2);font-weight:700}
.dash-kpi-value{font-size:clamp(18px,2vw,24px);font-weight:800;letter-spacing:-.04em;line-height:1.1;margin:4px 0;overflow-wrap:anywhere}
.dash-kpi-extra{font-size:10px;color:#368647;font-weight:750}
.dash-focus-grid,.dash-lower-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);gap:13px;margin-top:13px}
.dash-panel{padding:20px;min-width:0}
.dash-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dash-panel-head h3{font-size:16px;letter-spacing:-.025em;margin:0}
.dash-panel-head p{font-size:12px;color:var(--text2);margin:3px 0 0}
.dash-period{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11px;color:var(--text2);font-weight:650;white-space:nowrap}
.dash-chart-wrap{position:relative;height:205px;margin-top:13px}
.dash-chart-wrap svg{width:100%;height:100%}
.dash-chart-empty{position:absolute;left:50%;top:26%;transform:translateX(-50%);border-radius:12px;background:var(--card);border:1px solid var(--line);padding:8px 11px;text-align:center;white-space:nowrap;font-size:11px;color:var(--text2)}
.dash-legend{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text2);font-weight:650}
.dash-legend span{width:9px;height:9px;border-radius:50%;background:#427343}
.dash-hero{position:relative;overflow:hidden;min-height:300px;border-radius:19px;padding:21px;background:#173d31;color:#f7fff2;box-shadow:var(--shadow)}
.dash-hero:before{content:"";position:absolute;right:-95px;top:-135px;width:270px;height:270px;border-radius:50%;background:var(--brand);opacity:.19}
.dash-hero:after{content:"";position:absolute;right:-36px;bottom:-75px;width:180px;height:180px;border:1px solid #b4e26b7a;border-radius:50%}
.dash-hero>*{position:relative;z-index:1}
.dash-hero-kicker{font-size:10px;font-weight:850;letter-spacing:.12em;color:#d1f394}
.dash-hero h3{max-width:300px;font-size:clamp(21px,2.1vw,26px);line-height:1.15;letter-spacing:-.035em;margin:9px 0}
.dash-hero p{max-width:300px;font-size:12px;line-height:1.5;color:#bed4c2;margin:0}
.dash-hero-value{font-size:clamp(27px,2.8vw,38px);font-weight:850;letter-spacing:-.055em;margin-top:25px}
.dash-hero-sub{font-size:11px;color:#c8ddc6;margin-top:2px}
.dash-hero button{background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:10px 14px;font-size:12px;font-weight:800;margin-top:16px}
.dash-text-link{background:none;border:0;color:var(--brand-deep);font-size:11px;font-weight:750;white-space:nowrap}
.dash-activity{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dash-activity:last-child{border:0}
.dash-activity-icon{flex:none;display:grid;place-items:center;width:35px;height:35px;background:#edf6e5;color:#4b793e;border-radius:11px}
.dash-activity-icon svg{width:18px;height:18px}
.dash-activity-info{min-width:0;flex:1}
.dash-activity-info b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-activity-info small{display:block;color:var(--text2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.dash-activity strong{font-size:12px;white-space:nowrap}
.dash-activity:hover,.dash-attention:hover{background:var(--bg2)}
.dash-empty{font-size:12px;color:var(--text2);padding:25px 0}
.dash-attention{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
.dash-attention:last-child{border:0}
.dash-attention small{display:block;color:var(--text2);font-size:11px;margin-top:3px}
.dash-attention b{white-space:nowrap;font-size:12px}
.dash-detail{font-size:11px;color:var(--text2);margin-top:7px}
.dash-detail b{color:var(--text)}
.dash-detail svg,.dash-kpi svg,.dash-panel svg{flex:none}
.dash-extra-grid{margin-bottom:12px}
.dash-extra-grid .stat{margin:0}
.dark .dash-kpi-icon,.dark .dash-activity-icon{background:#334d32;color:#c4ec8d}
.dark .dash-text-link{color:#b9e67a}
.module-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:4px 0 18px}
.module-heading .eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--brand-deep)}
.module-heading h2{font-size:clamp(24px,2.6vw,34px);letter-spacing:-.045em;line-height:1.12;margin:5px 0}
.module-heading p{font-size:13px;color:var(--text2);margin:0}
.module-switch{display:flex;gap:8px;margin-bottom:17px}
.module-switch .btn{width:auto;flex:none!important;padding:10px 16px;font-size:13px;border-radius:12px;box-shadow:none}
.module-switch .btn.secondary{background:var(--card)}
.module-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:0 0 18px}
.module-metrics>.grid2{display:contents}
.module-metrics .stat{min-height:125px}
.module-metrics .stat .lbl{display:flex;align-items:center;gap:7px}
.module-metrics .stat .lbl svg{width:17px;height:17px;color:var(--brand-deep)}
.module-metrics .stat .val{margin-top:18px}
.module-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0}
.module-actions .btn{width:auto;margin:0!important;padding:12px 16px}
.sale-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr);gap:14px;margin-top:16px;align-items:start}
.sale-main,.sale-summary{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;min-width:0}
.sale-main .sec-title:first-child{margin-top:0}
.sale-summary h3{font-size:16px;margin:0 0 4px}
.sale-summary>p{font-size:12px;color:var(--text2);margin:0 0 20px}
.sale-summary .detail-line{padding:13px 0}
.sale-summary .sale-total{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:18px;margin-top:22px;font-weight:750}
.sale-summary .sale-total strong{font-size:22px;letter-spacing:-.045em}
.sale-summary .btn{margin-top:18px}
.sale-summary .btn.ghost{margin-top:5px}
.sale-summary .empty{padding:20px 8px}
.dark .module-heading .eyebrow,.dark .module-metrics .stat .lbl svg{color:#c2e57e}
.topbar{background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.topbar .breadcrumb{display:flex;gap:7px;align-items:center;color:var(--text2);font-size:12px;font-weight:650}
.topbar .breadcrumb .slash{opacity:.45}
.topbar h1{font-size:12px;font-weight:700;letter-spacing:0;color:var(--text2);margin:0}
.topbar .user-chip{display:flex;align-items:center;gap:9px;padding:4px 11px 4px 4px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;white-space:nowrap}
.topbar .user-dot{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#daf3a0;color:#284012;font-weight:800}
.icon-btn{border:1px solid var(--line);border-radius:12px;box-shadow:none;transition:background .2s,transform .2s}
.icon-btn:hover{background:var(--card);transform:translateY(-1px)}
.page{animation:atelier-in .24s ease}
@keyframes atelier-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.card,.stat,.list,.search{border:1px solid var(--line);box-shadow:var(--shadow)}
.card,.stat{border-radius:var(--radius)}
.stat{min-height:104px;transition:transform .18s,box-shadow .18s}
.stat:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(20,45,25,.09)}
.stat .lbl{font-size:12px;font-weight:650}
.stat .val{font-size:clamp(19px,2.2vw,27px);letter-spacing:-.045em;line-height:1.1}
.stat .val.sm{font-size:clamp(18px,1.9vw,23px)}
.sec-title{letter-spacing:.1em;font-size:11px;color:var(--brand-deep);margin-top:25px}
.dark .sec-title{color:#bedf7b}
.row{transition:background .18s}
.row .thumb{background:var(--bg2);border-radius:12px}
.row .info .t{font-weight:680}
.row .info .s{font-size:12px}
.badge.disp{background:rgba(37,124,72,.13);color:var(--green)}
.search{border-radius:14px}
.search:focus-within{border-color:var(--brand-deep);box-shadow:0 0 0 3px rgba(165,219,0,.15)}
.chip{border:1px solid var(--line);box-shadow:none;font-weight:650}
.chip.active,.pill-select .p.active{background:var(--brand);color:var(--brand-ink)}
.dark .pill-select .p.active{background:var(--brand);color:var(--brand-ink)}
.fab{background:var(--brand);color:var(--brand-ink);box-shadow:0 8px 26px rgba(85,141,0,.25)}
.sheet{border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.sheet-head{border-bottom:1px solid var(--line)}
.sheet-head .save,.sheet-head .x{color:var(--blue);font-weight:700}
.confirm-box{border:1px solid var(--line)}
.seg{border:1px solid var(--line);border-radius:12px}
.seg button.active{border-radius:9px}
.pos{color:var(--green)}
.tabbar{border-color:var(--line)}
.tab svg{width:21px;height:21px;flex:none}
.tab.active{color:var(--brand-deep)}
.sidebar-brand,.sidebar-caption,.sidebar-footer,.sidebar-spine{display:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}
}

  .tab{

  .tab svg{width:20px;height:20px}

  .tab.active{background:var(--brand);color:var(--brand-ink);box-shadow:0 8px 24px rgba(3,21,8,.15)}
  .tab:not(.active):hover{background:rgba(255,255,255,.09);color:#fff;transform:translateX(2px)}
  .sidebar-footer{

  .fab{right:max(32px,calc((100vw - 224px - 1360px)/2 + 32px));bottom:26px}
  .sheet{max-height:88vh}
  .grid2{gap:15px}
  .stat{padding:20px}
  .list .row{padding:16px 18px}

/* Fundo verde luminoso inspirado na referência enviada */
:root{
  --itronic-light-gradient:
    radial-gradient(ellipse at 11% 7%,rgba(246,255,236,.95),transparent 48%),
    radial-gradient(ellipse at 87% 66%,rgba(165,219,0,.30),transparent 51%),
    linear-gradient(115deg,#edf8e8 0%,#d7edbc 49%,#a9d923 100%);
}
body:not(.dark),body:not(.dark) #app,body:not(.dark) #login{
  background:var(--itronic-light-gradient);
  background-attachment:fixed;
}
body:not(.dark) .dash-kpi,body:not(.dark) .dash-panel,
body:not(.dark) .card,body:not(.dark) .stat,body:not(.dark) .list,
body:not(.dark) .sale-main,body:not(.dark) .sale-summary{
  background:rgba(255,255,255,.86);
  border-color:rgba(255,255,255,.68);
  box-shadow:0 12px 35px rgba(44,117,74,.10),0 1px 3px rgba(44,117,74,.05);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
@media (max-width:1023px){
  body:not(.dark) .topbar{background:rgba(233,248,223,.84)}
  body:not(.dark) .tabbar{background:rgba(248,255,243,.91)}
}

/* Modo noite: verde profundo com a luz atravessando da esquerda para a direita */
body.dark,body.dark #app,body.dark #login{
  background:
    radial-gradient(ellipse at 82% 18%,rgba(101,178,116,.22),transparent 53%),
    linear-gradient(90deg,#1c4130 0%,#214d39 52%,#2e6048 100%);
  background-attachment:fixed;
}
body.dark .dash-kpi,body.dark .dash-panel,
body.dark .card,body.dark .stat,body.dark .list,
body.dark .sale-main,body.dark .sale-summary{
  background:rgba(20,48,35,.87);
  border-color:rgba(194,232,179,.17);
  box-shadow:0 14px 36px rgba(4,25,15,.18),0 1px 4px rgba(4,25,15,.08);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

/* O menu é formado por dois blocos: a opção ativa revela o fundo do painel entre eles. */
@media (min-width:1024px){
  body:not(.dark){background:linear-gradient(135deg,#d2eacb,#e4f2da 55%,#c5e4b8)}
  body.dark{background:linear-gradient(110deg,#071c16,#18392c 60%,#244e3a)}
  #app{
    width:calc(100% - 48px);margin:24px;
    min-height:calc(100dvh - 48px);border-radius:22px;
    box-shadow:0 25px 55px rgba(25,66,44,.18);
    overflow:hidden;
  }
  .tabbar{
    --nav-gap-top:134px;--nav-gap-height:38px;
    position:fixed;top:24px;bottom:24px;left:24px;
    height:calc(100dvh - 48px);
    background:transparent;border:0;box-shadow:none;
    isolation:isolate;
  }
  .tabbar::before,.tabbar::after{
    content:"";position:absolute;left:0;right:0;z-index:-1;
    pointer-events:none;
    background:linear-gradient(100deg,#203e32 0%,#30584a 100%);
  }
  .tabbar::before{
    top:0;height:var(--nav-gap-top);
    border-radius:22px 0 19px 0;
  }
  .tabbar::after{
    top:calc(var(--nav-gap-top) + var(--nav-gap-height));bottom:0;
    border-radius:0 19px 0 22px;
  }
  body.dark .tabbar::before,body.dark .tabbar::after{
    background:linear-gradient(100deg,#071e16 0%,#153d2b 100%);
  }
  .tabbar .sidebar-spine{
    --spine-color:#203e32;
    display:block;position:absolute;left:0;z-index:-1;
    top:var(--nav-gap-top);height:var(--nav-gap-height);width:14px;
    background:var(--spine-color);pointer-events:none;
  }
  body.dark .tabbar .sidebar-spine{--spine-color:#071e16}
  .tabbar .sidebar-spine::before,.tabbar .sidebar-spine::after{
    content:"";position:absolute;left:100%;width:16px;height:16px;
    pointer-events:none;
  }
  .tabbar .sidebar-spine::before{
    top:0;
    background:radial-gradient(circle at 100% 100%,transparent 15.5px,var(--spine-color) 16px);
  }
  .tabbar .sidebar-spine::after{
    bottom:0;
    background:radial-gradient(circle at 100% 0,transparent 15.5px,var(--spine-color) 16px);
  }
  .tabbar .tab svg{
    width:22px;height:22px;padding:4px;border-radius:50%;
    background:transparent;color:#cdbb6d;box-shadow:none;
    transition:background .2s ease,box-shadow .2s ease;
  }
  .tabbar .sidebar-caption{
    font-weight:700;letter-spacing:.11em;color:#acc0ab;
  }
  .tabbar .tab{
    min-height:30px;padding:3px 9px;margin:2px 0;
    gap:8px;border-radius:9px;
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .tabbar .tab span{font-size:11px;font-weight:550}
  .tabbar .tab:not(.active){
    background:transparent;box-shadow:none;
  }
  .tabbar .tab:not(.active):hover{
    background:transparent;color:#bbd0bd;
    transform:translateY(-3px);box-shadow:none;
  }
  .tabbar .tab:not(.active):hover svg{
    background:rgba(255,255,255,.16);color:#cdbb6d;
    box-shadow:0 6px 13px rgba(5,26,15,.23);
  }
  .tabbar .tab.active{
    width:100%;margin-right:0;
    background:transparent;color:#2a5943;
    border-radius:12px;box-shadow:none;
  }
  .tabbar .tab.active svg{background:transparent;color:#54852c}
  .tabbar .tab.active:hover{
    background:transparent;color:#2a5943;
    transform:translateY(-3px);
    box-shadow:none;
  }
  .tabbar .tab.active:hover svg{background:rgba(255,255,255,.50);box-shadow:0 7px 13px rgba(20,75,30,.18)}
  body.dark .tabbar .tab.active{color:#eaf8e2}
  body.dark .tabbar .tab.active svg{background:transparent;color:#e4db92}
  body.dark .tabbar .tab.active:hover{background:transparent;color:#eaf8e2}
  body.dark .tabbar .tab.active:hover svg{background:rgba(255,255,255,.16)}
}
@media (max-width:1023px){
  body.dark .topbar{background:rgba(14,42,30,.83)}
  body.dark .tabbar{background:rgba(13,39,28,.93)}
  .tabbar .tab svg{width:29px;height:29px;padding:5px;border-radius:9px;background:rgba(76,113,70,.10)}
  .tabbar .tab.active svg{background:rgba(165,219,0,.22)}
  body.dark .tabbar .tab svg{background:rgba(204,232,161,.09);color:#d8cf80}
  body.dark .tabbar .tab.active svg{background:rgba(165,219,0,.24);color:#c3ec78}
}


/* A experiência enviada roda em um frame para preservar seus estilos e animações. */
body #login,body.dark #login{position:fixed;inset:0;display:block;padding:0;overflow:hidden;background:#a5d900!important}
#login #login-experience{position:absolute;inset:0;display:block;width:100%;max-width:none;height:100%;border:0;background:#a5d900}
#login .login-bridge{display:none}
/* Painel compacto aprovado */
#page-painel .pp-header{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:2px 0 16px}
#page-painel .pp-eyebrow{font-size:10px;font-weight:850;letter-spacing:.13em;text-transform:uppercase;color:#367e51}
#page-painel .pp-header h2{font-size:clamp(26px,3vw,36px);letter-spacing:-.045em;line-height:1.1;margin:5px 0}
#page-painel .pp-header p{font-size:12px;color:var(--text2)}
#page-painel .pp-controls{display:flex;align-items:center;gap:8px}
#page-painel .pp-live{border:1px solid var(--line);background:color-mix(in srgb,var(--card) 83%,#d6f5d3);border-radius:99px;padding:8px 10px;color:var(--text2);font-size:10px;font-weight:800;white-space:nowrap}
#page-painel .pp-select{width:auto;min-width:153px;padding:10px 32px 10px 11px;background-color:var(--card);border:1px solid var(--line);border-radius:11px;font-size:12px;font-weight:700;min-height:37px}
#page-painel .pp-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
#page-painel .pp-kpi,#page-painel .pp-card{background:color-mix(in srgb,var(--card) 91%,transparent);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);min-width:0}
#page-painel .pp-kpi{padding:16px 17px;min-height:111px}
#page-painel .pp-kpi-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--text2)}
#page-painel .pp-kpi-icon{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:color-mix(in srgb,var(--brand) 16%,var(--card));color:var(--blue)}
#page-painel .pp-kpi-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#page-painel .pp-kpi strong{display:block;margin:9px 0 4px;font-size:clamp(19px,2vw,26px);font-weight:800;letter-spacing:-.04em;line-height:1.1;overflow-wrap:anywhere}
#page-painel .pp-kpi small{display:block;font-size:10px;color:var(--text2);line-height:1.3}
#page-painel .pp-kpi small b{color:var(--green)}
#page-painel .pp-main,#page-painel .pp-second{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.93fr);gap:12px;margin-top:12px}
#page-painel .pp-second{grid-template-columns:repeat(2,minmax(0,1fr))}
#page-painel .pp-card{padding:17px 19px}
#page-painel .pp-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:11px;margin-bottom:12px}
#page-painel .pp-card h3{font-size:15px;letter-spacing:-.02em;margin:0 0 3px}
#page-painel .pp-card p{font-size:11px;color:var(--text2);margin:0;line-height:1.35}
#page-painel .pp-small-label{font-size:10px;color:var(--text2);font-weight:700;white-space:nowrap}
#page-painel .pp-chart{display:block;width:100%;height:158px}
#page-painel .pp-chart .pp-gridline{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
#page-painel .pp-chart .pp-axis{fill:var(--text2);font-size:10px;font-family:inherit}
#page-painel .pp-chart .pp-bar-f{fill:#3a8058}
#page-painel .pp-chart .pp-bar-l{fill:#a5db55}
#page-painel .pp-chart rect{transition:opacity .18s}
#page-painel .pp-chart rect:hover{opacity:.72}
#page-painel .pp-legend{display:flex;justify-content:center;gap:17px;font-size:10px;color:var(--text2);margin-top:1px}
#page-painel .pp-dot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;background:#3a8058}
#page-painel .pp-legend .pp-dot.profit{background:#a5db55}
#page-painel .pp-switch{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
#page-painel .pp-switch button{border:0;border-radius:7px;padding:5px 8px;font-size:10px;font-weight:800;color:var(--text2)}
#page-painel .pp-switch button.active{background:var(--card);color:var(--blue);box-shadow:0 2px 7px #102d211c}
#page-painel .pp-ranking{display:grid;gap:10px;margin-top:15px}
#page-painel .pp-rank-row{display:grid;grid-template-columns:19px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:11px}
#page-painel .pp-rank-no{font-weight:800;color:var(--text2)}
#page-painel .pp-rank-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#page-painel .pp-rank-value{font-size:11px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
#page-painel .pp-track{height:5px;margin-top:5px;background:var(--bg2);border-radius:99px;overflow:hidden}
#page-painel .pp-track b{height:100%;display:block;background:linear-gradient(90deg,#3d925e,#acd76c);border-radius:99px}
#page-painel .pp-footnote{font-size:10px;color:var(--text2);margin-top:10px}
#page-painel .pp-age{display:grid;gap:11px;margin-top:18px}
#page-painel .pp-age-row{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:9px;align-items:center;font-size:10px}
#page-painel .pp-age-row .label{color:var(--text2);font-weight:700}
#page-painel .pp-age-track{height:9px;border-radius:9px;background:var(--bg2);overflow:hidden}
#page-painel .pp-age-track b{height:100%;display:block;border-radius:9px;background:#75ba77}
#page-painel .pp-age-row.warn .pp-age-track b{background:#dfb659}
#page-painel .pp-age-row.danger .pp-age-track b{background:#d58b73}
#page-painel .pp-age-row .value{font-weight:800;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
#page-painel .pp-age-total{display:flex;justify-content:space-between;gap:8px;padding-top:11px;margin-top:14px;border-top:1px solid var(--line);font-size:10px;color:var(--text2)}
#page-painel .pp-age-total b{color:var(--text)}
#page-painel .pp-paybar{display:flex;height:20px;margin:22px 0 16px;border-radius:99px;overflow:hidden;background:var(--bg2)}
#page-painel .pp-paybar span{display:block;height:100%}
#page-painel .pp-paylist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}

(function(){

 function resize(){

   root.style.setProperty(&#x27;--scale&#x27;,Math.max(.2,scale).toFixed(5));
   stage.style.top=&#x27;calc(50% + &#x27;+(71*scale).toFixed(2)+&#x27;px)&#x27;;
 }

 let readyTimer;

   stage.classList.remove(&#x27;play&#x27;);void stage.offsetWidth;stage.classList.add(&#x27;play&#x27;);

 }

function defaultDB(){

    users:[{id:uid(),user:'admin',pass:'1234',nome:'Administrador',role:'Administrador'}],
    produtos:[], acessorios:[], servicos:[], fornecedores:[], clientes:[], vendas:[], compras:[], logins:[], contas:[], caixa:[], categorias:['Fornecedor','Aluguel','Retirada','Despesa','Salário','Outros'],

function vendasVisiveis(){
  // Admin vê todas as vendas; vendedor vê só as próprias.
  if(session && session.role==='Administrador') return db.vendas;
  return db.vendas.filter(v=>v.vendedor===(session?session.nome:''));
}
function podeEditar(){
  // Só o administrador cadastra/edita/exclui. Vendedor só vende.
  return session && session.role==='Administrador';
}
function podeVerPainel(){
  // Admin sempre vê Painel/Relatórios. Vendedor só se tiver a permissão marcada.
  if(!session) return false;
  if(session.role==='Administrador') return true;
  return !!session.vePainel;
}
function reconciliarVendidos(){
  // Corrige produtos que já foram vendidos mas ficaram como "Disponível"/"Reservado".
  // Monta a lista de ids de produtos que aparecem em alguma venda.
  if(!db || !db.vendas || !db.produtos) return;
  const idsVendidos=new Set();
  db.vendas.forEach(v=>{ (v.itens||[]).forEach(it=>{ if(it.prodId) idsVendidos.add(it.prodId); }); });
  let mudou=false;
  db.produtos.forEach(p=>{
    if(idsVendidos.has(p.id) && p.status!=='Vendido'){
      p.status='Vendido';
      if(!p.vendidoEm){
        // tenta usar a data da venda correspondente
        const venda=db.vendas.find(v=>(v.itens||[]).some(it=>it.prodId===p.id));
        p.vendidoEm=venda?venda.data:todayStr();
      }
      mudou=true;
    }
  });
  if(mudou){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){} }
}
function loadDB(){
  // 1) carrega o cache local na hora, pra abrir rápido mesmo sem internet
  let raw=null;
  try{ raw=localStorage.getItem(DB_KEY); }catch(error){ console.warn('Armazenamento local indisponível:',error); }
  if(raw){ try{ db = JSON.parse(raw); }catch(e){ db=null; } }
  if(!db) db = defaultDB();
  if(!Array.isArray(db.fornecedores)) db.fornecedores=[];
  if(!db.acessorios) db.acessorios=[]; if(!db.servicos) db.servicos=[]; if(!db.condPag) db.condPag={parcelasCartao:3,descontoDinheiro:5,mostrarPix:true,mostrarCartao:true,mostrarDinheiro:true}; if(!db.taxasCartao) db.taxasCartao={debito:1.5,imposto:0,credito:[3.5,4.5,5.5,6.5,7.5,8.5,9.5,10.5,11.5,12.5,13.5,14.5,15.5,16.5,17.5,18.5,19.5,20.5,21.5,22.5,23.5]}; if(db.taxasCartao && db.taxasCartao.imposto===undefined) db.taxasCartao.imposto=0; if(!db.logins) db.logins=[]; if(!db.contas) db.contas=[]; if(!db.caixa) db.caixa=[]; if(!db.categorias) db.categorias=["Fornecedor","Aluguel","Retirada","Despesa","Salário","Outros"];
  reconciliarVendidos();
  try{ theme=localStorage.getItem('itronic_theme') || 'light'; }catch(error){ theme='light'; }

  // 2) conecta na nuvem e escuta mudanças em tempo real
  if(fbReady && fbDoc){
    fbDoc.onSnapshot((snap)=>{
      if(savingToCloud){ return; } // ignora o eco da própria gravação
      if(snap.exists){
        const cloud = snap.data();
        if(cloud && cloud.json){
          try{
            const parsed = JSON.parse(cloud.json);
            // PROTEÇÃO: se a nuvem veio vazia mas eu tenho dados locais, não deixo apagar.
            const nuvemVazia = (!parsed.produtos||parsed.produtos.length===0) && (!parsed.clientes||parsed.clientes.length===0) && (!parsed.vendas||parsed.vendas.length===0) && (!parsed.fornecedores||parsed.fornecedores.length===0);
            const localTemDados = db && ((db.produtos&&db.produtos.length)||(db.clientes&&db.clientes.length)||(db.vendas&&db.vendas.length)||(db.fornecedores&&db.fornecedores.length));
            if(nuvemVazia && localTemDados && cloudVersion>0){
              // nuvem zerada por engano — reenvia o que tenho em vez de aceitar o vazio
              pushToCloud();
              return;
            }
            // PROTEÇÃO: só aceita se for uma versão mais nova (evita reverter)
            const v = Number(cloud.atualizado)||0;
            if(v < cloudVersion){ return; }
            cloudVersion = v;
            db = parsed;
            if(!Array.isArray(db.fornecedores)) db.fornecedores=[];
            if(!db.acessorios) db.acessorios=[]; if(!db.servicos) db.servicos=[]; if(!db.condPag) db.condPag={parcelasCartao:3,descontoDinheiro:5,mostrarPix:true,mostrarCartao:true,mostrarDinheiro:true}; if(!db.taxasCartao) db.taxasCartao={debito:1.5,imposto:0,credito:[3.5,4.5,5.5,6.5,7.5,8.5,9.5,10.5,11.5,12.5,13.5,14.5,15.5,16.5,17.5,18.5,19.5,20.5,21.5,22.5,23.5]}; if(db.taxasCartao && db.taxasCartao.imposto===undefined) db.taxasCartao.imposto=0; if(!db.logins) db.logins=[]; if(!db.contas) db.contas=[]; if(!db.caixa) db.caixa=[]; if(!db.categorias) db.categorias=["Fornecedor","Aluguel","Retirada","Despesa","Salário","Outros"];
            reconciliarVendidos();
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            dbLoaded=true;
            precarregarFotos();
            // Não redesenha se o usuário está digitando (campo focado) ou fechando uma venda,
            // pra não apagar o que ele está fazendo. Nesses casos, agenda pra depois.
            if(session && typeof currentTab!=='undefined'){
              const digitando = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
              const sheetAberta = el('sheet') && el('sheet').classList.contains('show');
              const noMeioDaVenda = currentTab==='venda' && vendaCart && vendaCart.produto;
              if(digitando || sheetAberta || noMeioDaVenda){
                // adia: guarda pra redesenhar quando o usuário sair do campo/tela
                renderPendente=true;
              }else{
                render(currentTab);
              }
            }
          }catch(e){}
        }
      }else{
        pushToCloud();
      }
    }, (err)=>{ /* sem internet: segue com o cache local */ });
  }
}
function saveDB(){
  localStorage.setItem(DB_KEY, JSON.stringify(db));
  pushToCloud();
}
function pushToCloud(){
  if(!fbReady || !fbDoc) return;
  savingToCloud=true;
  const agora=Date.now();
  cloudVersion=agora;
  const payload=JSON.stringify(db);
  const tamKB=Math.round(payload.length/1024);
  // Firebase limita ~1MB (1048487 bytes) por documento. Avisa antes de estourar.
  if(payload.length > 900000){
    toast('⚠️ Atenção: dados quase no limite ('+tamKB+'KB). Reduza fotos antigas ou faça backup.');
  }
  if(payload.length > 1048000){
    toast('❌ Dados grandes demais ('+tamKB+'KB)! A nuvem NÃO vai salvar. Remova algumas fotos.');
    savingToCloud=false;
    return; // não tenta gravar, evita perder o que já está na nuvem
  }
  fbDoc.set({ json: payload, atualizado: agora })
    .then(()=>{ setTimeout(()=>{ savingToCloud=false; }, 400); })
    .catch((err)=>{
      savingToCloud=false;
      toast('❌ Erro ao salvar na nuvem. Verifique a internet e o tamanho das fotos.');
    });
}

/* ============ LOGIN ============ */
window.itronicEnter=function(user,pass){
  const frame=el('login-experience');
  const showError=message=>{
    if(frame && frame.contentWindow) frame.contentWindow.postMessage({type:'itronic:error',message},'*');
  };
  try{
    // A tela animada chama esta função diretamente; a mensagem é um plano de reserva.
    el('lg-user').value=String(user||'');
    el('lg-pass').value=String(pass||'');
    if(!db) loadDB();
    if(!db || !Array.isArray(db.users)){
      showError('Não foi possível carregar os usuários. Atualize a página.');
      return false;
    }
    if(!doLogin()){
      showError('Usuário ou senha incorretos.');
      return false;
    }
    return true;
  }catch(error){
    console.error('Falha ao entrar na iTronic:',error);
    showError('Não foi possível entrar. Atualize a página e tente novamente.');
    return false;
  }
};
window.addEventListener('message',function(event){
  const frame=el('login-experience');
  if(!frame||event.source!==frame.contentWindow||!event.data||event.data.type!=='itronic:submit')return;
  window.itronicEnter(event.data.user,event.data.pass);
});
function doLogin(){
  const u = el('lg-user').value.trim().toLowerCase();
  const p = el('lg-pass').value;
  const found = db.users.find(x=>x.user.toLowerCase()===u && x.pass===p);
  if(!found){ toast('Usuário ou senha incorretos'); return false; }
  session = found;
  db.logins.unshift({id:uid(), user:found.user, nome:found.nome, data:todayStr(), hora:new Date().toLocaleTimeString('pt-BR')});
  db.logins = db.logins.slice(0,200);
  // Falhas de armazenamento local não devem bloquear a abertura do dashboard.
  let saveError=false;
  try{ saveDB(); }catch(error){ console.error('Falha ao salvar o acesso:',error); saveError=true; }
  el('lg-pass').value='';
  el('login').style.display='none';
  el('app').style.display='block';
  aplicarPermissoes();
  updateUserIdentity();
  go('dash');
  if(saveError) toast('Aviso: não foi possível salvar os dados neste navegador.');
  return true;
}
function updateUserIdentity(){
  const nome=session?.nome||'iTronic';
  const inicial=nome.trim().charAt(0).toLocaleUpperCase('pt-BR')||'i';
  el('top-user-name').textContent=nome;
  el('top-user-initial').textContent=inicial;
  el('side-user-name').textContent=nome;
  el('side-user-initial').textContent=inicial;
  el('side-user-role').textContent=(session?.role||'Equipe')+' · iTronic Rio Verde';
}
function aplicarPermissoes(){
  // Cotações de compra e indicadores financeiros são reservados ao administrador.
  const ver=podeVerPainel();
  document.querySelectorAll('.tab').forEach(t=>{
    if(t.dataset.tab==='painel'||t.dataset.tab==='relatorios'){
      t.style.display = ver ? '' : 'none';
    }
    if(t.dataset.tab==='orcamentos') t.style.display=podeEditar()?'':'none';
  });
}
function logout(){
  session=null;
  el('app').style.display='none';
  el('login').style.display='block';
  el('login-experience').contentWindow.postMessage({type:'itronic:replay'},'*');
  closeSheet();
}

let lastClickSound=-Infinity;
const clickFeedbackDocs=new WeakSet();
const clickTargetSelector='button,a[href],input,select,textarea,label,summary,[role="button"],[role="tab"],[onclick]';
function clickFeedbackTarget(event){
  const origin=event.target?.nodeType===1 ? event.target : event.target?.parentElement;
  if(!origin) return null;
  let target=origin.closest(clickTargetSelector);
  if(!target){
    for(let node=origin;node&&node!==origin.ownerDocument.body;node=node.parentElement){
      if(origin.ownerDocument.defaultView.getComputedStyle(node).cursor==='pointer'){target=node;break}
    }
  }
  if(!target||target.disabled||target.getAttribute('aria-disabled')==='true') return null;
  return target;
}
function drawClickWaves(event,target){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const doc=target.ownerDocument;
  const box=target.getBoundingClientRect();
  const x=event.clientX||box.left+box.width/2;
  const y=event.clientY||box.top+box.height/2;
  for(let i=0;i<2;i++){
    const wave=doc.createElement('i');
    wave.className='global-click-wave'+(i?' second':'');
    wave.setAttribute('aria-hidden','true');
    wave.style.left=x+'px';
    wave.style.top=y+'px';
    doc.body.appendChild(wave);
    setTimeout(()=>wave.remove(),480);
  }
}
function playClickSound(){
  const now=performance.now();
  if(now-lastClickSound<70) return;
  lastClickSound=now;
  try{
    clickSound.pause();
    if(clickSound.readyState>0) clickSound.currentTime=0;
    const playing=clickSound.play();
    if(playing&&typeof playing.catch==='function') playing.catch(()=>{});
  }catch(_){}
}
function installClickFeedback(doc){
  if(!doc||clickFeedbackDocs.has(doc)) return;
  clickFeedbackDocs.add(doc);
  if(doc!==document){
    const style=doc.createElement('style');
    style.textContent='.global-click-wave{position:fixed;width:28px;height:28px;border-radius:50%;border:1.5px solid #c7e997;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.15);animation:global-click-ripple .38s ease-out forwards;z-index:2147483647}.global-click-wave.second{animation-delay:.055s}@keyframes global-click-ripple{0%{opacity:.70;transform:translate(-50%,-50%) scale(.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}}@media(prefers-reduced-motion:reduce){.global-click-wave{display:none}}';
    doc.head.appendChild(style);
  }
  doc.addEventListener('pointerdown',event=>{
    const target=clickFeedbackTarget(event);
    if(target){ drawClickWaves(event,target); playClickSound(); }
  },true);
  doc.addEventListener('click',event=>{
    if(!event.isTrusted) return;
    const target=clickFeedbackTarget(event);
    if(!target) return;
    if(event.detail===0){ drawClickWaves(event,target); playClickSound(); }
  },true);
}
installClickFeedback(document);
const loginFeedbackFrame=document.getElementById('login-experience');
loginFeedbackFrame.addEventListener('load',()=>{try{installClickFeedback(loginFeedbackFrame.contentDocument)}catch(_){}});
try{if(loginFeedbackFrame.contentDocument?.readyState==='complete') installClickFeedback(loginFeedbackFrame.contentDocument)}catch(_){}
const TITLES={dash:'Início',painel:'Painel',estoque:'Estoque',assistencia:'Assistência',venda:'Vender',simular:'Simular',orcamentos:'Orçamentos',crm:'CRM',clientes:'Clientes',relatorios:'Relatórios'};
let currentTab='dash';
function syncSidebarCutout(){
  const bar=document.querySelector('.tabbar');
  const active=bar?.querySelector('.tab.active');
  if(!bar||!active||!active.offsetHeight) return;
  bar.style.setProperty('--nav-gap-top',Math.max(0,active.offsetTop-4)+'px');
  bar.style.setProperty('--nav-gap-height',(active.offsetHeight+8)+'px');
  if(window.innerWidth<=600) bar.scrollTo({left:active.offsetLeft-(bar.clientWidth-active.clientWidth)/2,behavior:'smooth'});
}
window.addEventListener('resize',syncSidebarCutout);
function go(tab){
  if((tab==='painel'||tab==='relatorios') && !podeVerPainel()){ tab='dash'; }
  if(tab==='orcamentos' && !podeEditar()){ tab='dash'; }
  if(currentTab==='simular' && tab!=='simular') simOferta=null;
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  syncSidebarCutout();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  el('page-'+tab).classList.add('active');
  el('page-title').textContent=TITLES[tab];
  // FAB só em telas que criam algo
  const fab=el('fab');
  if(tab==='clientes'){ fab.style.display='flex'; fab.innerHTML=plusIcon(); }
  else fab.style.display='none';
  render(tab);
  renderPendente=false;
  window.scrollTo(0,0);
}
function fabAction(){
  if(currentTab==='estoque') openProduto();
  else if(currentTab==='assistencia') openNovoServico();
  else if(currentTab==='clientes') openCliente();
}

function carrinhoTotal(){
  return carrinho.reduce((s,it)=>{
    if(it.tipo==='aparelho'){ const p=db.produtos.find(x=>x.id===it.id); return s+(p?Number(p.venda)||0:0); }
    if(it.tipo==='acessorio'){ const a=(db.acessorios||[]).find(x=>x.id===it.id); return s+(a?(Number(a.venda)||0)*it.qtd:0); }
    return s;
  },0);
}
function removerDoCarrinho(tipo,id){
  carrinho=carrinho.filter(it=>!(it.tipo===tipo&&it.id===id));
  carrinhoAcess=carrinho.filter(x=>x.tipo==='acessorio').map(x=>({id:x.id,qtd:x.qtd}));
  atualizarBadgeCarrinho();
  if(carrinhoQtd()>0) abrirCarrinhoUnificado(); else closeSheet();
  if(currentTab==='venda') renderVenda();
}
function mudarQtdCarrinhoAcess(id,delta){
  const a=(db.acessorios||[]).find(x=>x.id===id); if(!a) return;
  let item=carrinho.find(x=>x.tipo==='acessorio'&&x.id===id);
  if(item){
    item.qtd+=delta;
    if(item.qtd<=0) carrinho=carrinho.filter(x=>!(x.tipo==='acessorio'&&x.id===id));
    else if(item.qtd>a.qtd){ item.qtd=a.qtd; toast('Só tem '+a.qtd+' em estoque'); }
  }
  carrinhoAcess=carrinho.filter(x=>x.tipo==='acessorio').map(x=>({id:x.id,qtd:x.qtd}));
  atualizarBadgeCarrinho();
  abrirCarrinhoUnificado();
  if(currentTab==='venda') renderVenda();
}
function esvaziarCarrinho(){
  carrinho=[]; carrinhoAcess=[];
  atualizarBadgeCarrinho();
  if(currentTab==='venda') renderVenda();
}

/* ============ CÁLCULOS ============ */
function lucroVenda(v){
  // Lucro do dia = preço de venda − custo de compra do produto − valor dos aparelhos
  // que entraram na troca (esses viram estoque; seu lucro só aparece quando forem vendidos).
  // Ex: iPhone comprado 1500, vendido 1790, sem troca → lucro 290.
  // Ex: vendeu 2000, custo 1500, entrou 450 num aparelho → lucro 2000-1500-450 = 50.
  let custo=0;
  v.itens.forEach(it=>{ custo += Number(it.compra)||0; });
  let troca=0;
  if(Array.isArray(v.pagamentos)){
    troca=v.pagamentos.reduce((s,p)=> s + (p.forma==='Entrada aparelho'?(Number(p.valor)||0):0), 0);
  }
  return (Number(v.total)||0) - custo - troca;
}
function vendaLiquido(v){
  // "Vendido/Faturado" mostra sempre o valor BRUTO da venda (o preço cheio).
  // O que entrou em dinheiro de fato é controlado separadamente pelo caixa.
  return Number(v.total!=null?v.total:v.liquido)||0;
}
function vendaCaixa(v){
  // Dinheiro que de fato entrou no caixa nesta venda:
  // soma das formas de pagamento MENOS as entradas em aparelho (que viram estoque, não caixa)
  // e menos o que ficou como conta a receber.
  if(Array.isArray(v.pagamentos) && v.pagamentos.length){
    const emDinheiro=v.pagamentos.reduce((s,p)=> s + (p.forma==='Entrada aparelho'?0:(Number(p.valor)||0)), 0);
    return emDinheiro;
  }
  return Number(v.liquido!=null?v.liquido:v.total)||0;
}

function dashStats(){
  const disp = db.produtos.filter(p=>p.status!=='Vendido');
  const valorEstoque = disp.reduce((s,p)=>s+(Number(p.compra)||0),0);
  const vendaEstoque = disp.reduce((s,p)=>s+(Number(p.venda)||0),0);
  const lucroPotencial = vendaEstoque - valorEstoque;
  const qtd = disp.length;
  const t = todayStr();
  const mesAtual = t.slice(0,7);
  let vendaDia=0,vendaMes=0,lucroDia=0,lucroMes=0,aReceber=0;
  vendasVisiveis().forEach(v=>{
    const bruto=Number(v.total)||0, lu=lucroVenda(v);
    if(v.data===t){ vendaDia+=bruto; lucroDia+=lu; }
    if(v.data.slice(0,7)===mesAtual){ vendaMes+=bruto; lucroMes+=lu; }
    aReceber += Number(v.aReceber)||0;
  });
  // contas manuais pendentes
  let aPagar=0, aReceberManual=0;
  (db.contas||[]).forEach(c=>{
    if(c.status==='pago') return;
    if(c.tipo==='pagar') aPagar += Number(c.valor)||0;
    else aReceberManual += Number(c.valor)||0;
  });
  const totalReceber = aReceber + aReceberManual;
  return {valorEstoque,vendaEstoque,lucroPotencial,qtd,vendaDia,vendaMes,lucroDia,lucroMes,aReceber,aPagar,totalReceber};
}

/* ============ DASHBOARD ============ */
function dashTrendSvg(labels, valores){
  const xs=labels.map((_,i)=>32+i*112);
  const max=Math.max(1,...valores);
  const ys=valores.map(v=>170-(Math.max(0,v)/max)*135);
  const points=xs.map((x,i)=>({x,y:ys[i]}));
  let line=`M ${points[0].x} ${points[0].y}`;
  for(let i=0;i<points.length-1;i++){
    const a=points[i], b=points[i+1], mid=(a.x+b.x)/2;
    line+=` C ${mid} ${a.y}, ${mid} ${b.y}, ${b.x} ${b.y}`;
  }
  const area=line+` L ${points[points.length-1].x} 178 L ${points[0].x} 178 Z`;
  return `<div class="dash-chart-wrap">
    <svg viewBox="0 0 620 215" role="img" aria-label="Faturamento dos últimos seis meses" preserveAspectRatio="none">
      <defs><linearGradient id="dash-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5db00" stop-opacity=".28"/><stop offset="1" stop-color="#a5db00" stop-opacity="0"/></linearGradient></defs>
      <path d="M30 35H592 M30 80H592 M30 125H592 M30 170H592" stroke="var(--line)" stroke-width="1"/>
      ${valores.some(v=>v>0)?`<path d="${area}" fill="url(#dash-area)"/>`:''}
      <path d="${line}" fill="none" stroke="#427343" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="${points[points.length-1].x}" cy="${points[points.length-1].y}" r="6" fill="#a5db00" stroke="var(--card)" stroke-width="3"/>
      ${labels.map((l,i)=>`<text x="${xs[i]}" y="204" text-anchor="middle" fill="var(--text2)" font-size="11">${l}</text>`).join('')}
    </svg>
    ${valores.every(v=>v===0)?'<div class="dash-chart-empty">Ainda não há vendas neste período.</div>':''}
  </div>`;
}

function nomeMesCurto(m){const[a,mm]=m.split('-');const n=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];return n[parseInt(mm)-1];}

// gráfico de barras verticais simples (faturamento x lucro por mês)
function svgBarras(labels, series){
  // series = [{nome, cor, valores:[]}]
  const W=320, H=180, padL=8, padB=24, padT=10;
  const maxV=Math.max(1, ...series.flatMap(s=>s.valores));
  const grupos=labels.length;
  const gw=(W-padL*2)/grupos;
  const barsPerG=series.length;
  const bw=Math.min(18,(gw-8)/barsPerG);
  let bars='';
  labels.forEach((lb,i)=>{
    const gx=padL+i*gw+ (gw-bw*barsPerG)/2;
    series.forEach((s,j)=>{
      const v=s.valores[i]||0;
      const bh=(H-padB-padT)*(v/maxV);
      const x=gx+j*bw;
      const y=H-padB-bh;
      bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="2" fill="${s.cor}"><title>${lb}: ${money(v)}</title></rect>`;
    });
    bars+=`<text x="${(padL+i*gw+gw/2).toFixed(1)}" y="${H-8}" font-size="10" fill="#8a8a8e" text-anchor="middle">${lb}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${bars}</svg>`;
}

// gráfico de rosca (pizza) para proporções
function svgRosca(fatias){
  // fatias = [{nome, valor, cor}]
  const total=fatias.reduce((s,f)=>s+f.valor,0)||1;
  const cx=60,cy=60,r=50,ri=30;
  let ang=-Math.PI/2, paths='';
  fatias.forEach(f=>{
    const frac=f.valor/total;
    const a2=ang+frac*Math.PI*2;
    const x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang);
    const x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
    const xi2=cx+ri*Math.cos(a2), yi2=cy+ri*Math.sin(a2);
    const xi1=cx+ri*Math.cos(ang), yi1=cy+ri*Math.sin(ang);
    const large=frac>0.5?1:0;
    if(frac>0.0001) paths+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${xi2.toFixed(1)} ${yi2.toFixed(1)} A${ri} ${ri} 0 ${large} 0 ${xi1.toFixed(1)} ${yi1.toFixed(1)} Z" fill="${f.cor}"><title>${f.nome}: ${money(f.valor)}</title></path>`;
    ang=a2;
  });
  return `<svg viewBox="0 0 120 120" style="width:120px;height:120px;flex:0 0 auto">${paths}</svg>`;
}

let painelRankingModo='qtd';
function painelBarsSvg(labels,faturamento,lucros,mostrarLucro){
  if(!faturamento.some(Boolean) && (!mostrarLucro || !lucros.some(Boolean)))
    return '<div class="pp-empty">As vendas aparecerão aqui quando forem registradas.</div>';
  const max=Math.max(1,...faturamento,...(mostrarLucro?lucros:[]));
  const min=Math.min(0,...(mostrarLucro?lucros:[]));
  const top=13,bottom=126,scale=(bottom-top)/(max-min),zero=top+max*scale;
  const lines=[.25,.5,.75].map(f=>`<line x1="18" x2="505" y1="${(top+(zero-top)*f).toFixed(1)}" y2="${(top+(zero-top)*f).toFixed(1)}" class="pp-gridline"/>`).join('');
  const bars=labels.map((label,i)=>{
    const x=47+i*78, revenue=Math.max(0,faturamento[i]||0),gain=lucros[i]||0;
    const rf=revenue*scale,lh=Math.abs(gain)*scale;
    const moneyBar=`<rect class="pp-bar-f" x="${x-10}" y="${(zero-rf).toFixed(1)}" width="18" height="${Math.max(0,rf).toFixed(1)}" rx="4"><title>${label}: faturamento ${money(revenue)}</title></rect>`;
    const profitBar=mostrarLucro?`<rect class="pp-bar-l" x="${x+10}" y="${(gain>=0?zero-lh:zero).toFixed(1)}" width="13" height="${Math.max(0,lh).toFixed(1)}" rx="4"><title>${label}: lucro ${money(gain)}</title></rect>`:'';
    return moneyBar+profitBar+`<text class="pp-axis" x="${x+5}" y="151" text-anchor="middle">${label}</text>`;
  }).join('');
  return `<svg class="pp-chart" viewBox="0 0 520 158" role="img" aria-label="Faturamento${mostrarLucro?' e lucro':''} dos últimos seis meses" preserveAspectRatio="xMidYMid meet">${lines}${bars}</svg>`;
}

function renderPainel(){
  const isAdmin=session&&session.role==='Administrador';
  const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const nowMonth=todayStr().slice(0,7);
  const monthKey=(year,month,offset)=>{const d=new Date(year,month-1+offset,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
  const [year,month]=nowMonth.split('-').map(Number);
  const lastSix=Array.from({length:6},(_,i)=>monthKey(year,month,i-5));
  const base=vendasVisiveis();
  const months=new Set([...lastSix,...base.map(v=>String(v.data||'').slice(0,7)).filter(s=>/^\d{4}-\d{2}$/.test(s))]);
  const monthName=m=>{const [y,mm]=m.split('-');return ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][Number(mm)-1]+'/'+y};
  const recordedMonths=[...new Set(base.map(v=>String(v.data||'').slice(0,7)).filter(s=>/^\d{4}-\d{2}$/.test(s)))].sort();
  const currentSelection=/^\d{4}-\d{2}$/.test(painelMes)?painelMes:(painelMes==='todos'&&recordedMonths.length?recordedMonths[recordedMonths.length-1]:nowMonth);
  const chartMonths=Array.from({length:6},(_,i)=>{const [y,m]=currentSelection.split('-').map(Number);return monthKey(y,m,i-5)});
  const filtered=base.filter(v=>{
    const m=String(v.data||'').slice(0,7);
    return painelMes==='todos'||(painelMes==='6m'?lastSix.includes(m):m===painelMes);
  });
  const count=filtered.length;
  const noSalesText=painelMes==='todos'?'Não há vendas visíveis para este usuário. Confira os Relatórios e a sincronização.':'Não há vendas no período selecionado. Tente “Todo o histórico”.';
  const revenue=filtered.reduce((sum,v)=>sum+vendaLiquido(v),0);
  const profit=filtered.reduce((sum,v)=>sum+lucroVenda(v),0);
  const margin=revenue?profit/revenue*100:0;
  const ticket=count?revenue/count:0;
  const items=filtered.reduce((sum,v)=>sum+(v.itens||[]).reduce((n,it)=>n+(Number(it.qtd)>0?Number(it.qtd):1),0),0);
  const previous=monthKey(...currentSelection.split('-').map(Number),-1);
  const prevRevenue=base.filter(v=>String(v.data||'').slice(0,7)===previous).reduce((sum,v)=>sum+vendaLiquido(v),0);
  const variation=painelMes==='todos'||painelMes==='6m'?'Selecione um mês para comparar':prevRevenue>0
    ?(revenue>=prevRevenue?'▲ ':'▼ ')+Math.abs((revenue-prevRevenue)/prevRevenue*100).toFixed(1).replace('.',',')+'% ante '+monthName(previous)
    :'Sem base no mês anterior';
  const fatMonths=chartMonths.map(m=>base.filter(v=>String(v.data||'').slice(0,7)===m).reduce((sum,v)=>sum+vendaLiquido(v),0));
  const lucMonths=chartMonths.map(m=>base.filter(v=>String(v.data||'').slice(0,7)===m).reduce((sum,v)=>sum+lucroVenda(v),0));
  const chartLabels=chartMonths.map(m=>monthName(m).split('/')[0]);
  const rank=new Map();
  filtered.forEach(v=>{
    const lines=v.itens||[];
    const subtotal=lines.reduce((sum,it)=>sum+(Number(it.venda??it.preco)||0),0);
    const factor=subtotal>0?vendaLiquido(v)/subtotal:0;
    lines.forEach(it=>{
      const name=String(it.nome||'Produto').trim()||'Produto';
      if(!rank.has(name))rank.set(name,{name,qtd:0,total:0});
      const row=rank.get(name);
      row.qtd+=Number(it.qtd)>0?Number(it.qtd):1;
      row.total+=Math.max(0,(Number(it.venda??it.preco)||0)*factor);
    });
  });
  const ranking=[...rank.values()].sort((a,b)=>b[painelRankingModo]-a[painelRankingModo]).slice(0,5);
  const maxRank=Math.max(1,...ranking.map(r=>r[painelRankingModo]));
  const bins=[{name:'Até 30 dias',qtd:0,value:0},{name:'31–45 dias',qtd:0,value:0},{name:'46–90 dias',qtd:0,value:0},{name:'90+ dias',qtd:0,value:0}];
  let undated=0;
  (db.produtos||[]).filter(p=>p.status==='Disponível').forEach(p=>{
    if(!p.entrada){undated++;return}
    const entered=new Date(String(p.entrada).slice(0,10)+'T12:00:00');
    if(isNaN(entered.getTime())){undated++;return}
    const days=Math.max(0,Math.floor((new Date()-entered)/86400000));
    const index=days<=30?0:days<=45?1:days<=90?2:3;
    bins[index].qtd++;
    bins[index].value+=Number(p.compra)||0;
  });
  const maxBin=Math.max(1,...bins.map(b=>b.qtd));
  const slowCount=bins[2].qtd+bins[3].qtd,slowValue=bins[2].value+bins[3].value;
  const pays=[{name:'Pix',value:0,color:'#318457'},{name:'Cartão',value:0,color:'#78bb6b'},{name:'Dinheiro',value:0,color:'#b3d777'},{name:'Outros',value:0,color:'#d5e5ad'}];
  filtered.forEach(v=>(v.pagamentos||[]).forEach(p=>{
    const form=String(p.forma||'').toLowerCase();
    if(form==='entrada aparelho')return;
    const index=form.includes('pix')?0:form.includes('cartão')||form.includes('cartao')?1:form.includes('dinheiro')?2:3;
    pays[index].value+=Math.max(0,Number(p.valor)||0);
  }));
  const payTotal=pays.reduce((sum,p)=>sum+p.value,0);
  const noPaymentDetails=filtered.filter(v=>!(v.pagamentos||[]).some(p=>p.forma!=='Entrada aparelho'&&(Number(p.valor)||0)>0)).length;
  const icon=(path)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
  const kpi=(label,value,foot,path)=>`<article class="pp-kpi"><div class="pp-kpi-label"><span>${label}</span><span class="pp-kpi-icon">${icon(path)}</span></div><strong class="money-in">${value}</strong><small>${foot}</small></article>`;

  el('page-painel').innerHTML=`
    <header class="pp-header">
      <div><div class="pp-eyebrow">Visão de gestão</div><h2>Painel</h2><p>Um olhar claro para as vendas e o estoque.</p></div>
      <div class="pp-controls"><span class="pp-live">DADOS DA LOJA</span><select class="input pp-select" aria-label="Período do painel" onchange="painelMes=this.value;renderPainel()">
        <option value="${nowMonth}" ${painelMes===nowMonth?'selected':''}>${monthName(nowMonth)}</option>
        ${[...months].sort().reverse().filter(m=>m!==nowMonth).map(m=>`<option value="${m}" ${painelMes===m?'selected':''}>${monthName(m)}</option>`).join('')}
        <option value="6m" ${painelMes==='6m'?'selected':''}>Últimos 6 meses</option>
        <option value="todos" ${painelMes==='todos'?'selected':''}>Todo o histórico</option>
      </select></div>
    </header>
    <section class="pp-kpis" aria-label="Indicadores principais">
      ${kpi('Faturamento',money(revenue),esc(variation),'<path d="M3 17l6-6 4 3 8-9M16 5h5v5"/>')}
      ${isAdmin?kpi('Lucro',money(profit),'Cálculo atual do aplicativo','<path d="M12 2v20M17 5H9a3.5 3.5 0 0 0 0 7h6a3.5 3.5 0 0 1 0 7H6"/>'):kpi('Ticket médio',money(ticket),'Por venda realizada','<path d="M4 5h16v14H4zM8 10h8M8 14h5"/>')}
      ${isAdmin?kpi('Margem',margin.toFixed(1).replace('.',',')+'%','Lucro ÷ faturamento','<circle cx="12" cy="12" r="9"/><path d="m8 16 8-8M8 8h.01M16 16h.01"/>'):kpi('Itens vendidos',items,'Unidades no período','<path d="M3 6h18v15H3zM3 10h18"/>')}
      ${kpi('Vendas',count,'Ticket médio '+money(ticket),'<path d="M3 5h18M5 5l2 14h10l2-14M9 10h6M9 14h6"/>')}
    </section>
    <div class="pp-main">
      <section class="pp-card"><div class="pp-card-head"><div><h3>Evolução das vendas</h3><p>${isAdmin?'Faturamento e lucro':'Faturamento'} mês a mês</p></div><span class="pp-small-label">até ${monthName(currentSelection)}</span></div>
        ${painelBarsSvg(chartLabels,fatMonths,lucMonths,isAdmin)}
        <div class="pp-legend"><span><i class="pp-dot"></i>Faturamento</span>${isAdmin?'<span><i class="pp-dot profit"></i>Lucro</span>':''}</div>
      </section>
      <section class="pp-card"><div class="pp-card-head"><div><h3>Produtos em destaque</h3><p>Top 5 do período selecionado</p></div>
        <div class="pp-switch" role="group" aria-label="Ordenar ranking">
          <button class="${painelRankingModo==='qtd'?'active':''}" aria-pressed="${painelRankingModo==='qtd'}" onclick="painelRankingModo='qtd';renderPainel()">Unidades</button>
          <button class="${painelRankingModo==='total'?'active':''}" aria-pressed="${painelRankingModo==='total'}" onclick="painelRankingModo='total';renderPainel()">Valor</button>
        </div></div>
        ${ranking.length?`<div class="pp-ranking">${ranking.map((r,i)=>`<div class="pp-rank-row"><span class="pp-rank-no">${String(i+1).padStart(2,'0')}</span><div><div class="pp-rank-name" title="${esc(r.name)}">${esc(r.name)}</div><div class="pp-track"><b style="width:${Math.round(r[painelRankingModo]/maxRank*100)}%"></b></div></div><span class="pp-rank-value money-in">${painelRankingModo==='qtd'?r.qtd+' un.':money(r.total)}</span></div>`).join('')}</div>`:`<div class="pp-empty">${count?'As vendas deste período não têm produtos detalhados.':noSalesText}</div>`}
        <div class="pp-footnote">${painelRankingModo==='total'?'Valor distribuído proporcionalmente ao total das vendas.':'Alterne para Valor para comparar o faturamento.'}</div>
      </section>
    </div>
    <div class="pp-second">
      <section class="pp-card"><div class="pp-card-head"><div><h3>Idade do estoque</h3><p>Aparelhos disponíveis por tempo de permanência</p></div><span class="pp-small-label">posição atual</span></div>
        ${bins.some(b=>b.qtd)?`<div class="pp-age">${bins.map((b,i)=>`<div class="pp-age-row ${i===2?'warn':i===3?'danger':''}"><span class="label">${b.name}</span><div class="pp-age-track"><b style="width:${Math.round(b.qtd/maxBin*100)}%"></b></div><span class="value money-in">${b.qtd} · ${money(b.value)}</span></div>`).join('')}</div><div class="pp-age-total"><span>Parados há mais de 45 dias</span><b class="money-in">${slowCount} aparelhos · ${money(slowValue)}</b></div>`:'<div class="pp-empty">Nenhum aparelho disponível com data de entrada.</div>'}
        ${undated?`<div class="pp-footnote">${undated} aparelho(s) sem data de entrada ficaram fora das faixas.</div>`:''}

    <div style="font-size:13px;color:var(--text2);margin-bottom:10px">Marque os aparelhos que quer enviar pro cliente:</div>

function toggleCatItem(id){
  const i=catalogoSel.indexOf(id);
  if(i>=0) catalogoSel.splice(i,1); else catalogoSel.push(id);
  abrirCatalogo(); // redesenha a folha com a marcação atualizada
}
function textoCatalogo(){
  const L=[];
  L.push('🛍️ *CATÁLOGO — iTronic Rio Verde*');
  L.push('');
  catalogoSel.forEach(id=>{
    const p=db.produtos.find(x=>x.id===id);
    if(!p) return;
    const icone=CAT_ICON[p.cat]||'📱';
    L.push(icone+' *'+[p.marca,p.modelo].filter(Boolean).join(' ')+'*');
    const specs=[p.cor,p.armazenamento,p.condicao].filter(Boolean).join(' · ');
    if(specs) L.push(specs);
    if(p.condicao==='Seminovo' && p.bateria) L.push('🔋 Bateria: '+p.bateria+'%');
    L.push('💰 '+money(p.venda));
    L.push('');
  });
  L.push('📲 iTronic Rio Verde');
  return L.join('\n');
}
function enviarCatalogo(modo){
  if(!catalogoSel.length){ toast('Marque ao menos um aparelho'); return; }
  const texto=textoCatalogo();
  if(modo==='copiar'){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(()=>toast('Catálogo copiado')).catch(()=>copiarFallback(texto,()=>toast('Catálogo copiado')));
    }else copiarFallback(texto,()=>toast('Catálogo copiado'));
    return;
  }
  let fone='';
  const url='https://wa.me/'+fone+'?text='+encodeURIComponent(texto);
  const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

function ordenarModelo(a,b){
  // extrai o número do modelo (11, 12, 13...) e a variante
  const parse=(p)=>{
    const txt=((p.marca||'')+' '+(p.modelo||'')).toLowerCase();
    const num=parseFloat((txt.match(/\d+/)||[9999])[0]); // primeiro número
    // peso da variante: normal < plus/mini < pro < pro max
    let variante=0;
    if(/pro\s*max/.test(txt)) variante=3;
    else if(/pro/.test(txt)) variante=2;
    else if(/plus|max/.test(txt)) variante=1;
    else if(/mini|se|e\b/.test(txt)) variante=0.5;
    return {num, variante, txt};
  };
  const A=parse(a), B=parse(b);
  if(A.num!==B.num) return A.num-B.num;        // 11 antes de 12
  if(A.variante!==B.variante) return A.variante-B.variante; // normal, plus, pro, pro max
  return A.txt.localeCompare(B.txt);            // resto alfabético
}

function renderAssistencia(){
  const isAdmin=session&&session.role==='Administrador';

  if(searchServ){
    const q=searchServ.toLowerCase();
    servs=servs.filter(s=>(s.nome||'').toLowerCase().includes(q)||(s.modelo||'').toLowerCase().includes(q)||(s.categoria||'').toLowerCase().includes(q));
  }
  // agrupa por categoria (tipo de serviço)
  const grupos={};
  servs.forEach(s=>{ const c=s.categoria||'Outros'; if(!grupos[c]) grupos[c]=[]; grupos[c].push(s); });
  const ordem=SERVICOS_PADRAO.slice();
  const cats=[];
  ordem.forEach(c=>{ if(grupos[c]) cats.push(c); });
  Object.keys(grupos).forEach(c=>{ if(!cats.includes(c)) cats.push(c); });

  const lista = servs.length ? cats.map(cat=>{
    const aberta=!!catsServAbertas[cat];
    const itens=grupos[cat];
    const primeiraFoto=itens.find(s=>s.fotos&&s.fotos[0]);
    return `
    <div class="list" style="margin-bottom:10px">

      </div>

    </div>`;

      <div class="stat"><div class="lbl">${uiIcon('<path d="m14 4 6 6-9 9H5v-6l9-9zM12 6l6 6"/>')} Serviços</div><div class="val">${totalServ}</div></div>
    </div>
    <div class="grid2" style="margin:12px 0 4px">
      <div class="stat"><div class="lbl">${uiIcon('<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>')} Disponíveis</div><div class="val sm">${dispServ}</div></div>
