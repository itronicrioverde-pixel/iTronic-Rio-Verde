<style>
:root{
  --bg:#ffffff;
  --bg2:#f5f5f7;
  --card:#ffffff;
  --text:#1d1d1f;
  --text2:#6e6e73;
  --line:#e5e5ea;
  --blue:#0071e3;
  --blueh:#0077ed;
  --green:#34c759;
  --red:#ff3b30;
  --orange:#ff9500;
  --purple:#af52de;
  --shadow:0 2px 8px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03);
  --shadow-lg:0 8px 28px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.05);
  --radius:20px;
  --radius-sm:14px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
.dark{
  --bg:#000000;
  --bg2:#1c1c1e;
  --card:#1c1c1e;
  --text:#f5f5f7;
  --text2:#98989d;
  --line:#38383a;
  --blue:#0a84ff;
  --blueh:#409cff;
  --green:#30d158;
  --red:#ff453a;
  --orange:#ff9f0a;
  --purple:#bf5af2;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  background:var(--bg2);
  color:var(--text);
  font-size:16px;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
input,select,textarea,button{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{display:none}

/* ---------- LOGIN ---------- */
#login{
  position:fixed;inset:0;background:var(--bg);z-index:200;
  display:flex;flex-direction:column;justify-content:center;
  padding:32px 26px calc(32px + var(--safe-b));
}
.logo-box{text-align:center;margin-bottom:40px}
.brand-logo{width:220px;max-width:70%;height:auto;display:block;margin:0 auto}
.dash-logo{width:180px}
.logo-mark{
  width:76px;height:76px;border-radius:20px;margin:0 auto 18px;
  background:linear-gradient(160deg,#1d1d1f,#3a3a3c);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
}
.dark .logo-mark{background:linear-gradient(160deg,#2c2c2e,#48484a)}
.logo-mark svg{width:40px;height:40px}
.logo-title{font-size:26px;font-weight:700;letter-spacing:-.5px}
.logo-sub{color:var(--text2);font-size:15px;margin-top:3px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--text2);margin:0 0 6px 4px;font-weight:500}
.input{
  width:100%;background:var(--bg2);border:1px solid transparent;
  border-radius:var(--radius-sm);padding:15px 16px;outline:none;color:var(--text);
  transition:border-color .15s;
}
.input:focus{border-color:var(--blue)}
.dark .input{background:#1c1c1e}
select.input{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236e6e73' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 16px center;padding-right:44px}
.btn{
  width:100%;background:var(--blue);color:#fff;border-radius:15px;
  padding:16px;font-size:17px;font-weight:600;transition:opacity .15s,transform .1s,box-shadow .15s;
  border:none;cursor:pointer;display:block;text-align:center;-webkit-appearance:none;appearance:none;
  box-shadow:0 4px 14px rgba(0,113,227,.25);
}
.btn *{pointer-events:none}
.btn:active{opacity:.9;transform:scale(.98)}
.btn.secondary{background:var(--bg2);color:var(--text);box-shadow:none}
.dark .btn.secondary{background:#2c2c2e}
.btn.ghost{background:none;color:var(--blue);font-weight:500}
.btn.danger{background:var(--red);color:#fff}
.login-hint{text-align:center;color:var(--text2);font-size:13px;margin-top:22px;line-height:1.6}
.login-version{text-align:center;margin-top:40px;font-size:12px;font-weight:700;letter-spacing:3px;color:var(--text2);opacity:.55}
.login-version span{font-weight:400;letter-spacing:1px;opacity:.8}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100dvh;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 10px)}
.topbar{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg2) 82%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 20px 10px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:.5px solid var(--line);
}
.topbar h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.topbar .actions{display:flex;gap:6px;align-items:center}
.icon-btn{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--card);box-shadow:var(--shadow);color:var(--text);
}
.icon-btn svg{width:19px;height:19px}
.icon-btn:active{opacity:.6}
.cart-btn{position:relative}
.cart-badge{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg2)}
.page{display:none;padding:16px 16px calc(80px + var(--safe-b));animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- BOTTOM NAV ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);
  display:flex;align-items:flex-start;justify-content:space-around;
  padding-bottom:max(6px, calc(var(--safe-b) - 8px));
  padding-top:10px;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:2px 0;color:var(--text2);min-width:0}
.tab svg{width:23px;height:23px}
.tab-emoji{font-size:32px;line-height:1}
.tab.active .tab-emoji{transform:scale(1.05)}
.tab span{font-size:13px;font-weight:600;white-space:nowrap}
.tab.active{color:var(--blue)}

/* ---------- CARDS / GRID ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px 16px;transition:transform .12s}
.stat:active{transform:scale(.98)}
.stat .lbl{font-size:12.5px;color:var(--text2);font-weight:500;display:flex;align-items:center;gap:5px}
.stat .lbl svg{width:14px;height:14px}
.stat .val{font-size:24px;font-weight:800;letter-spacing:-.6px;margin-top:7px}
.stat .val.sm{font-size:20px}
.sec-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin:24px 4px 11px}
.sec-title:first-child{margin-top:6px}

/* ---------- LIST ROWS ---------- */
.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:.5px solid var(--line);position:relative}
.row:last-child{border-bottom:none}
.row:active{background:var(--bg2)}
.row .thumb{width:48px;height:48px;border-radius:13px;background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px}
.row .thumb img{width:100%;height:100%;object-fit:cover}
.row .info{flex:1;min-width:0}
.row .info .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .info .s{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .right{text-align:right;flex-shrink:0}
.row .right .p{font-weight:600;font-size:15px}
.chevron{color:var(--text2);opacity:.5}
.chevron svg{width:16px;height:16px;display:block}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-top:3px}
.badge.disp{background:rgba(52,199,89,.15);color:var(--green)}
.badge.res{background:rgba(255,149,0,.15);color:var(--orange)}
.badge.vend{background:rgba(142,142,147,.18);color:var(--text2)}
.empty{text-align:center;color:var(--text2);padding:50px 20px;font-size:15px}
.empty svg{width:44px;height:44px;opacity:.35;margin-bottom:12px}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.search svg{width:18px;height:18px;color:var(--text2);flex-shrink:0}
.search input{border:none;background:none;outline:none;flex:1;color:var(--text)}
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.chip{white-space:nowrap;padding:7px 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:500;color:var(--text2)}
.chip.active{background:var(--blue);color:#fff}

/* FAB */
.fab{
  position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:70;
  width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,113,227,.4);
}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.92)}

/* ---------- MODAL / SHEET ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--bg);
  border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:calc(100vh - env(safe-area-inset-top,0px) - 12px);display:flex;flex-direction:column;
  pointer-events:none;
}
.sheet.show{transform:translateY(0);pointer-events:auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 10px;border-bottom:.5px solid var(--line);flex-shrink:0}
.sheet-head .grip{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:36px;height:5px;border-radius:3px;background:var(--line)}
.sheet-head h2{font-size:18px;font-weight:700}
.sheet-body{overflow-y:auto;padding:16px 18px calc(24px + var(--safe-b));flex:1}
.sheet-head .x{color:var(--blue);font-weight:500;font-size:16px}
.sheet-head .save{color:var(--blue);font-weight:600;font-size:16px}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:.5px solid var(--line);font-size:15px}
.detail-line:last-child{border-bottom:none}
.detail-line .k{color:var(--text2)}
.detail-line .v{font-weight:600;text-align:right}
.big-num{font-size:34px;font-weight:700;letter-spacing:-1px;text-align:center;margin:6px 0}
.pill-select{display:flex;flex-wrap:wrap;gap:8px}
.pill-select .p{padding:9px 15px;border-radius:20px;background:var(--bg2);font-size:14px;font-weight:500}
.pill-select .p.active{background:var(--blue);color:#fff}
.dark .pill-select .p{background:#2c2c2e}
.dark .pill-select .p.active{background:var(--blue)}

.photo-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photo-grid .ph{width:70px;height:70px;border-radius:12px;object-fit:cover;position:relative}
.photo-add{width:70px;height:70px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--text2)}
.dark .photo-add{background:#2c2c2e}
.photo-wrap{position:relative}
.photo-wrap .del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0) + 16px);transform:translateX(-50%) translateY(-80px);z-index:300;background:rgba(30,30,32,.95);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:transform .3s;max-width:88%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:32px;opacity:0;pointer-events:none;transition:opacity .2s}
.confirm-bg.show{opacity:1;pointer-events:auto}
.confirm-box{background:var(--bg);border-radius:20px;max-width:320px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);transform:scale(.92);transition:transform .2s}
.confirm-bg.show .confirm-box{transform:scale(1)}
.confirm-msg{font-size:16px;text-align:center;margin-bottom:20px;line-height:1.45}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{flex:1;padding:13px;border-radius:12px;font-size:16px;font-weight:600}
.confirm-cancel{background:var(--bg2);color:var(--text)}
.dark .confirm-cancel{background:#2c2c2e}
.confirm-ok{background:var(--red);color:#fff}

.money-in{font-variant-numeric:tabular-nums}
.pos{color:var(--green)}
.neg{color:var(--red)}
.divider{height:.5px;background:var(--line);margin:14px 0}
.mini-lbl{font-size:13px;color:var(--text2);margin:0 4px 6px;font-weight:500}
.pay-opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;margin-bottom:10px;border:1.5px solid transparent}
.pay-opt .pay-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.6);flex-shrink:0}
.pay-opt .pay-mid{flex:1;min-width:0}
.pay-opt .pay-nome{font-weight:700;font-size:16px;color:#1d1d1f}
.pay-opt .pay-sub{font-size:12px;color:#6e6e73;margin-top:1px}
.pay-opt .pay-val{font-weight:800;font-size:18px;text-align:right;color:#1d1d1f}
.pay-opt .pay-parc{font-size:12px;font-weight:600;color:#6e6e73;margin-top:2px}
.pay-pix{background:linear-gradient(135deg,#e3f9ee,#d0f5e2);border-color:#34c759}
.pay-pix .pay-val{color:#1a8f4a}
.pay-deb{background:linear-gradient(135deg,#e7f0ff,#dbe8ff);border-color:#3b82f6}
.pay-deb .pay-val{color:#1d5fd4}
.pay-cred{background:linear-gradient(135deg,#f3ecff,#e9dcff);border-color:#8b5cf6}
.pay-cred .pay-val{color:#6d28d9}
.sim-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.sim-difer-box{background:linear-gradient(135deg,#1d1d1f,#3a3a3c);border-radius:18px;padding:18px 20px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.sim-difer-box .k{color:rgba(255,255,255,.7);font-size:14px}
.sim-difer-box .v{color:#fff;font-size:26px;font-weight:800}
.inline-2{display:flex;gap:10px;align-items:center}
.link-row{padding:14px 16px;font-size:16px;color:var(--text);display:flex;justify-content:space-between;align-items:center;border-bottom:.5px solid var(--line)}
.link-row:last-child{border-bottom:none}
.link-row .rv{color:var(--text2)}
.seg{display:flex;background:var(--bg2);border-radius:10px;padding:3px;margin-bottom:14px}
.dark .seg{background:#1c1c1e}
.seg button{flex:1;padding:8px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text2)}
.seg button.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* ============ RESPONSIVO ============ */
/* No celular fica como está. A partir de tablet, o conteúdo é centralizado
   e as gavetas de baixo viram um cartão centralizado na tela. */
@media (min-width:768px){
  body{background:var(--bg2)}
  /* login vira um cartão centralizado */
  #login{align-items:center;background:var(--bg2)}
  #login > *{width:100%;max-width:380px}
  .logo-box{max-width:380px}
  /* barra do topo e conteúdo centralizados numa coluna confortável */
  .topbar{padding-left:max(20px,calc((100% - 720px)/2));padding-right:max(20px,calc((100% - 720px)/2))}
  .page{max-width:720px;margin:0 auto;padding:20px 20px 0}
  #app{padding-bottom:calc(var(--nav-h) + 24px)}

  /* menu de navegação centralizado, sem grudar nas bordas */
  .tabbar{padding-left:calc((100% - 560px)/2);padding-right:calc((100% - 560px)/2)}

  /* FAB acompanha a coluna central */
  .fab{right:calc((100% - 720px)/2 + 8px)}

  /* as gavetas viram modal centralizado */
  .sheet{
    left:50%;right:auto;bottom:auto;top:50%;
    width:600px;max-width:92vw;max-height:88vh;
    border-radius:20px;
    transform:translate(-50%,-50%) scale(.96);
    opacity:0;transition:opacity .25s,transform .25s;
  }
  .sheet.show{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet-head{padding-top:16px}
  .sheet-head .grip{display:none}
  .sheet-body{padding-bottom:24px}
}

/* Notebook / desktop: aproveita mais espaço nas estatísticas */
@media (min-width:1024px){
  .topbar{padding-left:max(20px,calc((100% - 860px)/2));padding-right:max(20px,calc((100% - 860px)/2))}
  .page{max-width:860px}
  .fab{right:calc((100% - 860px)/2 + 8px)}
  /* dashboard e estoque: os pares de cartões viram quatro colunas quando fizer sentido */
  .grid2{grid-template-columns:repeat(2,1fr)}
}

/* Desktop largo */
@media (min-width:1280px){
  .topbar{padding-left:max(20px,calc((100% - 960px)/2));padding-right:max(20px,calc((100% - 960px)/2))}
  .page{max-width:960px}
  .fab{right:calc((100% - 960px)/2 + 8px)}
}

/* Em telas grandes, mouse tem hover — dá um retorno visual nas linhas */
@media (hover:hover) and (min-width:768px){
  .row:hover{background:var(--bg2);cursor:pointer}
  .chip:hover,.link-row:hover{cursor:pointer}
  .fab:hover{filter:brightness(1.05)}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="logo-box">
    <img id="login-logo" class="brand-logo" alt="iTronic - Centro Especializado Apple">
    <div class="logo-sub">Sistema de Gestão de Loja</div>
  </div>
  <div class="field">
    <label>Usuário</label>
    <input class="input" id="lg-user" placeholder="seu usuário" autocomplete="username">
  </div>
  <div class="field">
    <label>Senha</label>
    <input class="input" id="lg-pass" type="password" placeholder="••••••" autocomplete="current-password">
  </div>
  <button class="btn" onclick="doLogin()" style="margin-top:8px">Entrar</button>
  <div class="login-hint" id="login-hint">
    Primeiro acesso: <b>admin</b> / senha <b>1234</b>
  </div>
  <div class="login-version">SISTEMA DE GESTÃO <span>· v40 · 2026</span></div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <h1 id="page-title">Início</h1>
    <div class="actions">
      <button class="icon-btn cart-btn" onclick="abrirCarrinhoUnificado()" title="Carrinho" id="cart-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/><path d="M2 3h3l2.4 12.4a1 1 0 0 0 1 .8h8.7a1 1 0 0 0 1-.8L21 7H6"/></svg>
        <span class="cart-badge" id="cart-badge" style="display:none">0</span>
      </button>
      <button class="icon-btn" onclick="toggleTheme()" title="Tema" id="theme-btn"></button>
      <button class="icon-btn" onclick="openMenu()" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
      </button>
    </div>
  </div>

  <div id="page-dash" class="page active"></div>
  <div id="page-painel" class="page"></div>
  <div id="page-estoque" class="page"></div>
  <div id="page-venda" class="page"></div>
  <div id="page-clientes" class="page"></div>
  <div id="page-relatorios" class="page"></div>

  <div class="tabbar">
    <button class="tab active" data-tab="dash" onclick="go('dash')">
      <span class="tab-emoji">🏠</span>
      <span>Início</span>
    </button>
    <button class="tab" data-tab="painel" onclick="go('painel')">
      <span class="tab-emoji">📊</span>
      <span>Painel</span>
    </button>
    <button class="tab" data-tab="estoque" onclick="go('estoque')">
      <span class="tab-emoji">📦</span>
      <span>Estoque</span>
    </button>
    <button class="tab" data-tab="venda" onclick="go('venda')">
      <span class="tab-emoji">🛒</span>
      <span>Vender</span>
    </button>
    <button class="tab" data-tab="clientes" onclick="go('clientes')">
      <span class="tab-emoji">👥</span>
      <span>Clientes</span>
    </button>
    <button class="tab" data-tab="relatorios" onclick="go('relatorios')">
      <span class="tab-emoji">📈</span>
      <span>Relatórios</span>
    </button>
  </div>

  <button class="fab" id="fab" onclick="fabAction()"></button>
</div>

<!-- SHEET -->
<div class="sheet-bg" id="sheet-bg" onclick="closeSheet(event)"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <span class="grip"></span>
    <button class="x" onclick="closeSheet()">Fechar</button>
    <h2 id="sheet-title"></h2>
    <button class="save" id="sheet-save" onclick="sheetSave()"> </button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<div class="toast" id="toast"></div>

<!-- CONFIRMAÇÃO -->
<div class="confirm-bg" id="confirm-bg">
  <div class="confirm-box">
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="confirmNo()">Cancelar</button>
      <button class="confirm-ok" id="confirm-yes" onclick="confirmYes()">Remover</button>
    </div>
  </div>
</div>

function reconciliarVendidos(){
  // Corrige produtos que já foram vendidos mas ficaram como "Disponível"/"Reservado".
  // Monta a lista de ids de produtos que aparecem em alguma venda.
  if(!db || !db.vendas || !db.produtos) return;
  const idsVendidos=new Set();
  db.vendas.forEach(v=>{ (v.itens||[]).forEach(it=>{ if(it.prodId) idsVendidos.add(it.prodId); }); });
  let mudou=false;
  db.produtos.forEach(p=>{
    if(idsVendidos.has(p.id) && p.status!=='Vendido'){
      p.status='Vendido';
      if(!p.vendidoEm){
        // tenta usar a data da venda correspondente
        const venda=db.vendas.find(v=>(v.itens||[]).some(it=>it.prodId===p.id));
        p.vendidoEm=venda?venda.data:todayStr();
      }
      mudou=true;
    }
  });
  if(mudou){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){} }
}
function loadDB(){
  // 1) carrega o cache local na hora, pra abrir rápido mesmo sem internet
  const raw = localStorage.getItem(DB_KEY);
  if(raw){ try{ db = JSON.parse(raw); }catch(e){ db=null; } }
  if(!db) db = defaultDB();
  if(!db.acessorios) db.acessorios=[]; if(!db.servicos) db.servicos=[]; if(!db.condPag) db.condPag={parcelasCartao:3,descontoDinheiro:5,mostrarPix:true,mostrarCartao:true,mostrarDinheiro:true}; if(!db.taxasCartao) db.taxasCartao={debito:1.5,imposto:0,credito:[3.5,4.5,5.5,6.5,7.5,8.5,9.5,10.5,11.5,12.5,13.5,14.5,15.5,16.5,17.5,18.5,19.5,20.5,21.5,22.5,23.5]}; if(db.taxasCartao && db.taxasCartao.imposto===undefined) db.taxasCartao.imposto=0; if(!db.logins) db.logins=[]; if(!db.contas) db.contas=[]; if(!db.caixa) db.caixa=[]; if(!db.categorias) db.categorias=["Fornecedor","Aluguel","Retirada","Despesa","Salário","Outros"];
  reconciliarVendidos();
  theme = localStorage.getItem('itronic_theme') || 'light';

  // 2) conecta na nuvem e escuta mudanças em tempo real
  if(fbReady && fbDoc){
    fbDoc.onSnapshot((snap)=>{
      if(savingToCloud){ return; } // ignora o eco da própria gravação
      if(snap.exists){
        const cloud = snap.data();
        if(cloud && cloud.json){
          try{
            const parsed = JSON.parse(cloud.json);
            // PROTEÇÃO: se a nuvem veio vazia mas eu tenho dados locais, não deixo apagar.
            const nuvemVazia = (!parsed.produtos||parsed.produtos.length===0) && (!parsed.clientes||parsed.clientes.length===0) && (!parsed.vendas||parsed.vendas.length===0);
            const localTemDados = db && ((db.produtos&&db.produtos.length)||(db.clientes&&db.clientes.length)||(db.vendas&&db.vendas.length));
            if(nuvemVazia && localTemDados && cloudVersion>0){
              // nuvem zerada por engano — reenvia o que tenho em vez de aceitar o vazio
              pushToCloud();
              return;
            }
            // PROTEÇÃO: só aceita se for uma versão mais nova (evita reverter)
            const v = Number(cloud.atualizado)||0;
            if(v < cloudVersion){ return; }
            cloudVersion = v;
            db = parsed;
            if(!db.acessorios) db.acessorios=[]; if(!db.servicos) db.servicos=[]; if(!db.condPag) db.condPag={parcelasCartao:3,descontoDinheiro:5,mostrarPix:true,mostrarCartao:true,mostrarDinheiro:true}; if(!db.taxasCartao) db.taxasCartao={debito:1.5,imposto:0,credito:[3.5,4.5,5.5,6.5,7.5,8.5,9.5,10.5,11.5,12.5,13.5,14.5,15.5,16.5,17.5,18.5,19.5,20.5,21.5,22.5,23.5]}; if(db.taxasCartao && db.taxasCartao.imposto===undefined) db.taxasCartao.imposto=0; if(!db.logins) db.logins=[]; if(!db.contas) db.contas=[]; if(!db.caixa) db.caixa=[]; if(!db.categorias) db.categorias=["Fornecedor","Aluguel","Retirada","Despesa","Salário","Outros"];
            reconciliarVendidos();
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            dbLoaded=true;
            precarregarFotos();
            // Não redesenha se o usuário está digitando (campo focado) ou fechando uma venda,
            // pra não apagar o que ele está fazendo. Nesses casos, agenda pra depois.
            if(session && typeof currentTab!=='undefined'){
              const digitando = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
              const sheetAberta = el('sheet') && el('sheet').classList.contains('show');
              const noMeioDaVenda = currentTab==='venda' && vendaCart && vendaCart.produto;
              if(digitando || sheetAberta || noMeioDaVenda){
                // adia: guarda pra redesenhar quando o usuário sair do campo/tela
                renderPendente=true;
              }else{
                render(currentTab);
              }
            }
          }catch(e){}
        }
      }else{
        pushToCloud();
      }
    }, (err)=>{ /* sem internet: segue com o cache local */ });
  }
}
function saveDB(){
  localStorage.setItem(DB_KEY, JSON.stringify(db));
  pushToCloud();
}
function pushToCloud(){
  if(!fbReady || !fbDoc) return;
  savingToCloud=true;
  const agora=Date.now();
  cloudVersion=agora;
  const payload=JSON.stringify(db);
  const tamKB=Math.round(payload.length/1024);
  // Firebase limita ~1MB (1048487 bytes) por documento. Avisa antes de estourar.
  if(payload.length > 900000){
    toast('⚠️ Atenção: dados quase no limite ('+tamKB+'KB). Reduza fotos antigas ou faça backup.');
  }
  if(payload.length > 1048000){
    toast('❌ Dados grandes demais ('+tamKB+'KB)! A nuvem NÃO vai salvar. Remova algumas fotos.');
    savingToCloud=false;
    return; // não tenta gravar, evita perder o que já está na nuvem
  }
  fbDoc.set({ json: payload, atualizado: agora })
    .then(()=>{ setTimeout(()=>{ savingToCloud=false; }, 400); })
    .catch((err)=>{
      savingToCloud=false;
      toast('❌ Erro ao salvar na nuvem. Verifique a internet e o tamanho das fotos.');
    });
}

/* ============ CÁLCULOS ============ */
function lucroVenda(v){
  // Lucro do dia = preço de venda − custo de compra do produto − valor dos aparelhos
  // que entraram na troca (esses viram estoque; seu lucro só aparece quando forem vendidos).
  // Ex: iPhone comprado 1500, vendido 1790, sem troca → lucro 290.
  // Ex: vendeu 2000, custo 1500, entrou 450 num aparelho → lucro 2000-1500-450 = 50.
  let custo=0;
  v.itens.forEach(it=>{ custo += Number(it.compra)||0; });
  let troca=0;
  if(Array.isArray(v.pagamentos)){
    troca=v.pagamentos.reduce((s,p)=> s + (p.forma==='Entrada aparelho'?(Number(p.valor)||0):0), 0);
  }
  return (Number(v.total)||0) - custo - troca;
}
function vendaLiquido(v){
  // "Vendido/Faturado" mostra sempre o valor BRUTO da venda (o preço cheio).
  // O que entrou em dinheiro de fato é controlado separadamente pelo caixa.
  return Number(v.total!=null?v.total:v.liquido)||0;
}
function vendaCaixa(v){
  // Dinheiro que de fato entrou no caixa nesta venda:
  // soma das formas de pagamento MENOS as entradas em aparelho (que viram estoque, não caixa)
  // e menos o que ficou como conta a receber.
  if(Array.isArray(v.pagamentos) && v.pagamentos.length){
    const emDinheiro=v.pagamentos.reduce((s,p)=> s + (p.forma==='Entrada aparelho'?0:(Number(p.valor)||0)), 0);
    return emDinheiro;
  }
  return Number(v.liquido!=null?v.liquido:v.total)||0;
}

function dashStats(){
  const disp = db.produtos.filter(p=>p.status!=='Vendido');
  const valorEstoque = disp.reduce((s,p)=>s+(Number(p.compra)||0),0);
  const vendaEstoque = disp.reduce((s,p)=>s+(Number(p.venda)||0),0);
  const lucroPotencial = vendaEstoque - valorEstoque;
  const qtd = disp.length;
  const t = todayStr();
  const mesAtual = t.slice(0,7);
  let vendaDia=0,vendaMes=0,lucroDia=0,lucroMes=0,aReceber=0;
  vendasVisiveis().forEach(v=>{
    const bruto=Number(v.total)||0, lu=lucroVenda(v);
    if(v.data===t){ vendaDia+=bruto; lucroDia+=lu; }
    if(v.data.slice(0,7)===mesAtual){ vendaMes+=bruto; lucroMes+=lu; }
    aReceber += Number(v.aReceber)||0;
  });
  // contas manuais pendentes
  let aPagar=0, aReceberManual=0;
  (db.contas||[]).forEach(c=>{
    if(c.status==='pago') return;
    if(c.tipo==='pagar') aPagar += Number(c.valor)||0;
    else aReceberManual += Number(c.valor)||0;
  });
  const totalReceber = aReceber + aReceberManual;
  return {valorEstoque,vendaEstoque,lucroPotencial,qtd,vendaDia,vendaMes,lucroDia,lucroMes,aReceber,aPagar,totalReceber};
}

function nomeMesCurto(m){const[a,mm]=m.split('-');const n=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];return n[parseInt(mm)-1];}

// gráfico de barras verticais simples (faturamento x lucro por mês)
function svgBarras(labels, series){
  // series = [{nome, cor, valores:[]}]
  const W=320, H=180, padL=8, padB=24, padT=10;
  const maxV=Math.max(1, ...series.flatMap(s=>s.valores));
  const grupos=labels.length;
  const gw=(W-padL*2)/grupos;
  const barsPerG=series.length;
  const bw=Math.min(18,(gw-8)/barsPerG);
  let bars='';
  labels.forEach((lb,i)=>{
    const gx=padL+i*gw+ (gw-bw*barsPerG)/2;
    series.forEach((s,j)=>{
      const v=s.valores[i]||0;
      const bh=(H-padB-padT)*(v/maxV);
      const x=gx+j*bw;
      const y=H-padB-bh;
      bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="2" fill="${s.cor}"><title>${lb}: ${money(v)}</title></rect>`;
    });
    bars+=`<text x="${(padL+i*gw+gw/2).toFixed(1)}" y="${H-8}" font-size="10" fill="#8a8a8e" text-anchor="middle">${lb}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${bars}</svg>`;
}

// gráfico de rosca (pizza) para proporções
function svgRosca(fatias){
  // fatias = [{nome, valor, cor}]
  const total=fatias.reduce((s,f)=>s+f.valor,0)||1;
  const cx=60,cy=60,r=50,ri=30;
  let ang=-Math.PI/2, paths='';
  fatias.forEach(f=>{
    const frac=f.valor/total;
    const a2=ang+frac*Math.PI*2;
    const x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang);
    const x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
    const xi2=cx+ri*Math.cos(a2), yi2=cy+ri*Math.sin(a2);
    const xi1=cx+ri*Math.cos(ang), yi1=cy+ri*Math.sin(ang);
    const large=frac>0.5?1:0;
    if(frac>0.0001) paths+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${xi2.toFixed(1)} ${yi2.toFixed(1)} A${ri} ${ri} 0 ${large} 0 ${xi1.toFixed(1)} ${yi1.toFixed(1)} Z" fill="${f.cor}"><title>${f.nome}: ${money(f.valor)}</title></path>`;
    ang=a2;
  });
  return `<svg viewBox="0 0 120 120" style="width:120px;height:120px;flex:0 0 auto">${paths}</svg>`;
}

  document.body.appendChild(a); a.click(); a.remove();
}

function ordenarModelo(a,b){
  // extrai o número do modelo (11, 12, 13...) e a variante
  const parse=(p)=>{
    const txt=((p.marca||'')+' '+(p.modelo||'')).toLowerCase();
    const num=parseFloat((txt.match(/\d+/)||[9999])[0]); // primeiro número
    // peso da variante: normal < plus/mini < pro < pro max
    let variante=0;
    if(/pro\s*max/.test(txt)) variante=3;
    else if(/pro/.test(txt)) variante=2;
    else if(/plus|max/.test(txt)) variante=1;
    else if(/mini|se|e\b/.test(txt)) variante=0.5;
    return {num, variante, txt};
  };
  const A=parse(a), B=parse(b);
  if(A.num!==B.num) return A.num-B.num;        // 11 antes de 12
  if(A.variante!==B.variante) return A.variante-B.variante; // normal, plus, pro, pro max
  return A.txt.localeCompare(B.txt);            // resto alfabético
}

      const resp=await fetch(foto); const blob=await resp.blob();

      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],text:texto}); return; }

function renderEstoqueAgrupado(lista){
  // agrupa por categoria, na ordem preferida
  const ordem=['iPad','iPhone','Apple Watch','MacBook','AirPods','Acessório'];
  const grupos={};
  lista.forEach(p=>{ const c=p.cat||'Outros'; if(!grupos[c]) grupos[c]=[]; grupos[c].push(p); });
  // ordena dentro de cada grupo por modelo
  Object.keys(grupos).forEach(c=>{ grupos[c].sort(ordenarModelo); });
  // monta a ordem: primeiro os da lista de ordem, depois qualquer outro que sobrar
  const cats=[];
  ordem.forEach(c=>{ if(grupos[c]) cats.push(c); });
  Object.keys(grupos).forEach(c=>{ if(!cats.includes(c)) cats.push(c); });
  return cats.map(c=>`
    <div class="sec-title" style="margin-top:14px">${CAT_ICON[c]||'📦'} ${c} <span style="color:var(--text2);font-weight:400">(${grupos[c].length})</span></div>
    <div class="list">${grupos[c].map(prodRow).join('')}</div>
  `).join('');
}
function prodRow(p){
  const b = p.status==='Disponível'?'disp':p.status==='Reservado'?'res':'vend';

/* ============ VENDA ============ */
function renderVenda(){
  const c=vendaCart;
  const disp = db.produtos.filter(p=>p.status==='Disponível');
  const isAdmin=session&&session.role==='Administrador';

  // seletor de modo (Aparelho / Acessórios)
  const toggle=`
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn ${vendaModo==='aparelho'?'':'secondary'}" style="flex:1" onclick="vendaModo='aparelho';renderVenda()">📱 Aparelho</button>
      <button class="btn ${vendaModo==='acessorio'?'':'secondary'}" style="flex:1" onclick="vendaModo='acessorio';renderVenda()">🎧 Acessórios</button>
      <button class="btn ${vendaModo==='simulador'?'':'secondary'}" style="flex:1" onclick="vendaModo='simulador';renderVenda()">🧮 Simular</button>
    </div>`;

  const blocoCliente=`
    <div class="sec-title">Cliente</div>
    <div class="list">
      <div class="row" onclick="pickCliente()">
        <div class="thumb">👤</div>
        <div class="info"><div class="t">${c.cliente?c.cliente.nome:'Selecionar cliente'}</div>
        <div class="s">${c.cliente?(c.cliente.telefone||'sem telefone'):'Toque para escolher'}</div></div>
        ${chev()}
      </div>
    </div>`;

  if(vendaModo==='acessorio'){
    el('page-venda').innerHTML = toggle + blocoCliente + renderCarrinhoAcess(isAdmin);
    return;
  }

  if(vendaModo==='simulador'){
    el('page-venda').innerHTML = toggle + renderSimuladorInline();
    setTimeout(calcSimTroca,50);
    return;
  }

  el('page-venda').innerHTML=toggle+blocoCliente+`
    <div class="sec-title">Aparelho</div>
    <div class="list">
      <div class="row" onclick="pickProduto()">
        <div class="thumb">${c.produto?(temFoto(c.produto.fotos&&c.produto.fotos[0])?`<img src="${imgFoto(c.produto.fotos[0])}">`:(CAT_ICON[c.produto.cat]||'📦')):'📱'}</div>
        <div class="info"><div class="t">${c.produto?(c.produto.marca+' '+c.produto.modelo):'Selecionar aparelho'}</div>
        <div class="s">${c.produto?[c.produto.cor,c.produto.armazenamento].filter(Boolean).join(' · '):(disp.length+' disponíveis')}</div></div>
        <div class="right">${c.produto?`<div class="p money-in">${money(c.produto.venda)}</div>`:''}${chev()}</div>
      </div>
    </div>

    ${c.produto?`
    ${isAdmin?`
    <div class="sec-title">Desconto</div>
    <div class="card">
      <div class="inline-2">
        <input class="input" type="text" inputmode="decimal" placeholder="0,00" value="${c.desconto||''}" oninput="vendaCart.desconto=parseFloat(String(this.value).replace(',','.'))||0;updateVendaTotal()" style="flex:1">
        <div style="text-align:right;min-width:120px">
          <div style="font-size:12px;color:var(--text2)">Total</div>
          <div id="venda-total" style="font-size:20px;font-weight:700" class="money-in">${money((c.produto.venda||0)-(c.desconto||0))}</div>
        </div>
      </div>
    </div>`:`
    <div class="card">
      <div class="detail-line"><span class="k">Total</span><span class="v money-in" style="font-size:20px;font-weight:700">${money(c.produto.venda||0)}</span></div>
    </div>`}
    <div class="sec-title">Observação (opcional)</div>
    <div class="card">
      <textarea class="input" placeholder="Ex: cliente vai buscar amanhã, combinou algo..." oninput="vendaCart.obs=this.value" style="width:100%;min-height:70px;resize:vertical">${c.obs||''}</textarea>
    </div>
    <button class="btn" onclick="openPagamento()" style="margin-top:6px">Ir para pagamento</button>
    <button class="btn ghost" onclick="resetVenda();renderVenda()" style="margin-top:4px">Limpar venda</button>
    `:`<div class="empty" style="padding:30px 20px"><div>Escolha o cliente e o aparelho para continuar.</div></div>`}

  `;
}

function renderItemAcess(a,isAdmin){
  const noCarrinho=carrinhoAcess.find(x=>x.id===a.id);
  const situacao=a.situacao||'Disponível';
  const vendavel = situacao==='Disponível' && a.qtd>0;
  const badgeCor = situacao==='Disponível'?'#34c759':(situacao==='Aguardando pedido'?'#ff9500':'#ff3b30');
  const badgeTxt = situacao==='Sem estoque'?'Sem estoque':(situacao==='Aguardando pedido'?'Aguardando pedido':(a.qtd<=0?'Esgotado':a.qtd+' em estoque'));
  return `<div class="row">
    <div class="thumb" style="${temFoto(a.fotos&&a.fotos[0])?'padding:5px;background:#fff;border:1px solid var(--line)':''}">${temFoto(a.fotos&&a.fotos[0])?`<img src="${imgFoto(a.fotos[0])}" style="width:100%;height:100%;object-fit:contain">`:'🎧'}</div>
    <div class="info" onclick="acaoAcessorio('${a.id}')"><div class="t">${a.nome}</div><div class="s"><span style="color:${badgeCor};font-weight:600">${badgeTxt}</span>${a.sub?' · '+a.sub:''}${isAdmin&&a.custo?' · custo '+money(a.custo):''}</div></div>
    <div class="right" style="display:flex;align-items:center;gap:8px">
      <div class="p money-in">${money(a.venda)}</div>
      ${!vendavel?``:
        noCarrinho?`<div style="display:flex;align-items:center;gap:6px">
          <button onclick="mudarQtdAcess('${a.id}',-1)" style="width:28px;height:28px;border-radius:8px;background:var(--bg2);font-size:18px">−</button>
          <span style="min-width:20px;text-align:center;font-weight:600">${noCarrinho.qtd}</span>
          <button onclick="mudarQtdAcess('${a.id}',1)" style="width:28px;height:28px;border-radius:8px;background:var(--bg2);font-size:18px">+</button>
        </div>`:
        `<button onclick="mudarQtdAcess('${a.id}',1)" style="width:32px;height:32px;border-radius:8px;background:var(--blue);color:#fff;font-size:20px">+</button>`}
    </div>
  </div>`;
}
function renderCarrinhoAcess(isAdmin){
  const acess=db.acessorios||[];
  const totalCarrinho=carrinhoAcess.reduce((s,it)=>{const a=acess.find(x=>x.id===it.id);return s+(a?(Number(a.venda)||0)*it.qtd:0);},0);
  const qtdCarrinho=carrinhoAcess.reduce((s,it)=>s+it.qtd,0);
  // agrupa por categoria
  const grupos={};
  acess.forEach(a=>{ const cat=a.categoria||'Outros'; if(!grupos[cat]) grupos[cat]=[]; grupos[cat].push(a); });
  const nomesCats=Object.keys(grupos).sort((x,y)=> x==='Outros'?1 : y==='Outros'?-1 : x.localeCompare(y));
  const listaAgrupada = acess.length ? nomesCats.map(cat=>{
    const aberta=!!catsAbertas[cat];
    const qtdCat=grupos[cat].length;
    const noCarrinhoCat=grupos[cat].reduce((s,a)=>{const it=carrinhoAcess.find(x=>x.id===a.id);return s+(it?it.qtd:0);},0);
    const primeiraFoto=grupos[cat].find(a=>a.fotos&&a.fotos[0]);
    return `
    <div class="list" style="margin-bottom:10px">
      <div class="row" onclick="toggleCatAcess('${cat.replace(/'/g,"\\'")}')" style="cursor:pointer;border-bottom:${aberta?'.5px solid var(--line)':'none'}">
        <div class="thumb" style="${primeiraFoto?'padding:5px;background:#fff;border:1px solid var(--line)':''}">${primeiraFoto?`<img src="${imgFoto(primeiraFoto.fotos[0])}" style="width:100%;height:100%;object-fit:contain">`:'🎧'}</div>
        <div class="info"><div class="t">${cat}</div><div class="s">${qtdCat} ${qtdCat===1?'item':'itens'}${noCarrinhoCat>0?` · <span style="color:var(--blue);font-weight:600">${noCarrinhoCat} no carrinho</span>`:''}</div></div>
        <div class="right" style="font-size:20px;color:var(--text2);transform:rotate(${aberta?'90':'0'}deg);transition:transform .2s">›</div>
      </div>
      ${aberta?grupos[cat].map(a=>renderItemAcess(a,isAdmin)).join(''):''}
    </div>
  `;}).join('') : `<div class="empty">Nenhum acessório cadastrado.${podeEditar()?' Toque em "+ Cadastrar".':''}</div>`;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px">
      <div class="sec-title" style="margin:0">Acessórios disponíveis</div>
      ${podeEditar()?`<button class="btn secondary" style="width:auto;padding:6px 12px;font-size:13px" onclick="openNovoAcessorio()">+ Cadastrar</button>`:''}
    </div>
    ${listaAgrupada}

    ${qtdCarrinho>0?`
      <div class="card" style="margin-top:14px">
        <div class="detail-line"><span class="k">${qtdCarrinho} acessório(s) no carrinho 🛒</span><span class="v money-in" style="font-size:18px">${money(totalCarrinho)}</span></div>
      </div>
      <div style="font-size:12px;color:var(--text2);text-align:center;margin-top:6px">Toque no 🛒 lá em cima para ver o carrinho completo</div>
      <button class="btn secondary" onclick="enviarPedidoAcess('whats')" style="margin-top:10px;background:#25D366;color:#fff">📤 Enviar pedido no WhatsApp</button>
      <button class="btn secondary" onclick="enviarPedidoAcess('copiar')" style="margin-top:8px">Copiar pedido/orçamento</button>
    `:''}
    <div style="height:20px"></div>
  `;
}

function toggleCatAcess(cat){
  catsAbertas[cat]=!catsAbertas[cat];
  renderVenda();
}
function mudarQtdAcess(id,delta){
  const a=(db.acessorios||[]).find(x=>x.id===id);
  if(!a) return;
  if(delta>0 && (a.situacao&&a.situacao!=='Disponível')){ toast('Acessório '+a.situacao.toLowerCase()); return; }
  // opera direto no carrinho unificado
  let item=carrinho.find(x=>x.tipo==='acessorio'&&x.id===id);
  if(!item){ if(delta>0){ carrinho.push({tipo:'acessorio', id, qtd:1}); } }
  else{
    item.qtd+=delta;
    if(item.qtd<=0) carrinho=carrinho.filter(x=>!(x.tipo==='acessorio'&&x.id===id));
    else if(item.qtd>a.qtd){ item.qtd=a.qtd; toast('Só tem '+a.qtd+' em estoque'); }
  }
  // mantém carrinhoAcess como espelho (algumas telas ainda leem dele)
  carrinhoAcess=carrinho.filter(x=>x.tipo==='acessorio').map(x=>({id:x.id,qtd:x.qtd}));
  renderVenda();
  atualizarBadgeCarrinho();
}
let tempFotosAcess=[];
function blocoCondicoes(valor){
  const c=db.condPag||{parcelasCartao:3,descontoDinheiro:5,mostrarPix:true,mostrarCartao:true,mostrarDinheiro:true};
  const L=[];
  L.push('');
  L.push('*Formas de pagamento:*');
  if(c.mostrarPix!==false) L.push('💠 À vista Pix: '+money(valor));
  if(c.mostrarCartao!==false && c.parcelasCartao>1){
    const parc=valor/c.parcelasCartao;
    L.push('💳 Cartão '+c.parcelasCartao+'x sem juros: '+c.parcelasCartao+'x de '+money(parc));
  }
  if(c.mostrarDinheiro!==false && c.descontoDinheiro>0){
    const comDesc=valor*(1-c.descontoDinheiro/100);
    L.push('💵 Dinheiro ('+c.descontoDinheiro+'% desc): '+money(comDesc));
  }
  return L.join('\n');
}
function acaoAcessorio(id){
  const a=(db.acessorios||[]).find(x=>x.id===id);
  if(!a) return;
  const html=`
    <div class="list">
      ${podeEditar()?`<div class="row" onclick="closeSheet();setTimeout(()=>editarAcessorio('${id}'),300)"><div class="thumb">✏️</div><div class="info"><div class="t">Editar acessório</div></div></div>`:''}
      <div class="row" onclick="enviarOrcamentoAcess('${id}','whats')"><div class="thumb">📤</div><div class="info"><div class="t">Enviar orçamento (WhatsApp)</div></div></div>
      <div class="row" onclick="compartilharAcessFoto('${id}')"><div class="thumb">📷</div><div class="info"><div class="t">Compartilhar com foto</div></div></div>
      <div class="row" onclick="enviarOrcamentoAcess('${id}','copiar')"><div class="thumb">📋</div><div class="info"><div class="t">Copiar orçamento</div></div></div>
    </div>`;
  openSheet(a.nome, html);
}
function textoAcessorio(a){
  const L=[];
  L.push('🎧 *'+a.nome+'*');
  if(a.sub) L.push('Tipo: '+a.sub);
  L.push('💰 '+money(a.venda));
  L.push(blocoCondicoes(a.venda));
  L.push('');
  L.push('📲 iTronic Rio Verde');
  return L.join('\n');
}
function enviarOrcamentoAcess(id,modo){
  const a=(db.acessorios||[]).find(x=>x.id===id);
  if(!a) return;
  const texto=textoAcessorio(a);
  if(modo==='copiar'){
    const ok=()=>toast('Orçamento copiado');
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok).catch(()=>copiarFallback(texto,ok));
    else copiarFallback(texto,ok);
    return;
  }
  const url='https://wa.me/?text='+encodeURIComponent(texto);
  const el2=document.createElement('a'); el2.href=url; el2.target='_blank'; el2.rel='noopener';
  document.body.appendChild(el2); el2.click(); el2.remove();
}
async function compartilharAcessFoto(id){
  const a=(db.acessorios||[]).find(x=>x.id===id);
  if(!a) return;
  const texto=textoAcessorio(a);
  const foto=await new Promise(r=>resolverFoto(a.fotos&&a.fotos[0], r));
  try{
    if(foto && navigator.canShare){
      const resp=await fetch(foto); const blob=await resp.blob();
      const file=new File([blob],'acessorio.jpg',{type:blob.type||'image/jpeg'});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],text:texto}); return; }
    }
    if(navigator.share){ await navigator.share({text:texto}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  enviarOrcamentoAcess(id,'whats');
}
function textoPedidoCarrinho(){
  const acess=db.acessorios||[];
  const L=[];
  L.push('🛒 *PEDIDO — iTronic Rio Verde*');
  if(vendaCart.cliente) L.push('Cliente: '+vendaCart.cliente.nome);
  L.push('');
  let total=0;
  carrinhoAcess.forEach(it=>{
    const a=acess.find(x=>x.id===it.id); if(!a) return;
    const sub=(Number(a.venda)||0)*it.qtd; total+=sub;
    L.push(`• ${it.qtd}x ${a.nome}${a.sub?' ('+a.sub+')':''} — ${money(sub)}`);
  });
  L.push('');
  L.push('*Total: '+money(total)+'*');
  L.push(blocoCondicoes(total));
  L.push('');
  L.push('📲 iTronic Rio Verde');
  return L.join('\n');
}
function enviarPedidoAcess(modo){
  if(!carrinhoAcess.length){ toast('Carrinho vazio'); return; }
  const texto=textoPedidoCarrinho();
  if(modo==='copiar'){
    const ok=()=>toast('Pedido copiado');
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok).catch(()=>copiarFallback(texto,ok));
    else copiarFallback(texto,ok);
    return;
  }
  let fone='';
  if(vendaCart.cliente && vendaCart.cliente.telefone){ fone=String(vendaCart.cliente.telefone).replace(/\D/g,''); if(fone.length<=11) fone='55'+fone; }
  const url='https://wa.me/'+fone+'?text='+encodeURIComponent(texto);
  const el2=document.createElement('a'); el2.href=url; el2.target='_blank'; el2.rel='noopener';
  document.body.appendChild(el2); el2.click(); el2.remove();
}
function openNovoAcessorio(){ formAcessorio(null); }
function editarAcessorio(id){ const a=(db.acessorios||[]).find(x=>x.id===id); formAcessorio(a); }
function formAcessorio(a){
  if(!podeEditar()){ toast('Só o administrador pode cadastrar/editar'); return; }
  tempFotosAcess = a ? (a.fotos||[]).slice() : [];
  // categorias já usadas nos acessórios
  const catsUsadas=[...new Set((db.acessorios||[]).map(x=>x.categoria).filter(Boolean))];
  const catAtual=a?a.categoria:'';
  const optCats=['<option value="">— sem categoria —</option>']
    .concat(catsUsadas.map(cc=>`<option value="${cc}" ${cc===catAtual?'selected':''}>${cc}</option>`))
    .concat(['<option value="__nova__">+ Nova categoria...</option>']).join('');
  const html=`
    ${fld('Nome do acessório','ac-nome',{ph:'ex: Capinha iPhone 13',val:a?a.nome:''})}
    <div class="field"><label>Categoria</label>
      <select class="input" id="ac-cat" onchange="if(this.value==='__nova__'){el('ac-cat-nova').style.display='block';el('ac-cat-nova').focus();}else{el('ac-cat-nova').style.display='none';}">${optCats}</select>
      <input class="input" id="ac-cat-nova" placeholder="Digite a nova categoria (ex: Fontes, Cabos)" style="display:none;margin-top:8px" value="${catAtual&&!catsUsadas.includes(catAtual)?catAtual:''}">
    </div>
    ${selFld('Tipo','ac-sub',['Original','Premium'],a?a.sub:'Original')}
    ${selFld('Situação','ac-sit',['Disponível','Aguardando pedido','Sem estoque'],a?(a.situacao||'Disponível'):'Disponível')}
    ${fld('Fornecedor (de onde veio)','ac-forn',{ph:'ex: Distribuidora X',val:a?a.fornecedor:''})}
    ${fld('Número de série (opcional)','ac-serie',{ph:'deixe vazio se for item de quantidade',val:a?a.serie:''})}
    ${fld('Preço de venda','ac-venda',{ph:'0,00',val:a?a.venda:''})}
    ${fld('Custo (só você vê)','ac-custo',{ph:'0,00',val:a?a.custo:''})}
    ${fld('Quantidade em estoque','ac-qtd',{ph:'0',val:a?a.qtd:''})}
    <div class="field"><label>Fotos</label>
      <button class="btn secondary" onclick="el('ac-foto-input').click()" style="width:auto;padding:8px 14px">📷 Adicionar fotos</button>
      <input type="file" id="ac-foto-input" accept="image/*,.jpg,.jpeg,.png,.webp,.heic,.heif" multiple style="display:none" onchange="addFotoAcess(event)">
      <div id="ac-fotos-grid" class="photo-grid" style="margin-top:10px"></div>
    </div>
  `;
  openSheet(a?'Editar acessório':'Novo acessório', html, 'Salvar', ()=>{
    const nome=getV('ac-nome').trim();
    if(!nome){ toast('Informe o nome'); return; }
    let categoria=getV('ac-cat');
    if(categoria==='__nova__') categoria=getV('ac-cat-nova').trim();
    else if(el('ac-cat-nova')&&el('ac-cat-nova').value.trim()&&categoria==='') categoria=getV('ac-cat-nova').trim();
    const dados={
      nome, sub:getV('ac-sub'),
      categoria,
      situacao:getV('ac-sit'),
      fornecedor:getV('ac-forn').trim(),
      serie:getV('ac-serie').trim(),
      venda:parseFloat(String(getV('ac-venda')).replace(',','.'))||0,
      custo:parseFloat(String(getV('ac-custo')).replace(',','.'))||0,
      qtd:parseInt(getV('ac-qtd'))||0,
      fotos:tempFotosAcess.slice()
    };
    converterFotosParaRefs(dados.fotos, (refs)=>{
      dados.fotos=refs;
      if(a){ Object.assign(a,dados); toast('Acessório atualizado'); }
      else { dados.id=uid(); dados.entrada=todayStr(); db.acessorios.push(dados); toast('Acessório cadastrado'); }
      saveDB(); closeSheet(); renderVenda();
    });
  });
  setTimeout(renderFotosAcess,60);
  if(a){
    setTimeout(()=>{
      const body=el('sheet-body');
      if(body){ const b=document.createElement('button'); b.className='btn ghost'; b.style.marginTop='10px'; b.style.color='var(--red)'; b.textContent='Excluir acessório';
        b.onclick=()=>askConfirm('Excluir este acessório?',()=>{ db.acessorios=db.acessorios.filter(x=>x.id!==a.id); carrinhoAcess=carrinhoAcess.filter(x=>x.id!==a.id); saveDB(); closeSheet(); renderVenda(); toast('Excluído'); });
        body.appendChild(b);
      }
    },80);
  }
}
function addFotoAcess(e){
  const files=Array.from(e.target.files||[]); if(!files.length)return;
  let pend=files.length, ok=0;
  files.forEach(file=>{
    comprimirFoto(file,(dataUrl)=>{
      if(dataUrl){ tempFotosAcess.push(dataUrl); ok++; }
      pend--; if(pend===0){ renderFotosAcess(); if(ok>0) toast(ok>1?ok+' fotos adicionadas':'Foto adicionada'); }
    });
  });
  e.target.value='';
}
function renderFotosAcess(){

function graficoAnual(isAdmin){
  // agrupa faturamento e lucro por mês (últimos 12 meses com movimento)
  const porMes={};
  vendasVisiveis().forEach(v=>{
    const m=v.data.slice(0,7);
    if(!porMes[m]) porMes[m]={fat:0,luc:0};
    porMes[m].fat+=vendaLiquido(v);
    porMes[m].luc+=lucroVenda(v);
  });
  const meses=Object.keys(porMes).sort();
  if(!meses.length) return '<div class="empty" style="margin-top:14px">Sem vendas ainda para montar o gráfico.</div>';
  const ult=meses.slice(-12);
  const nomeMesCurto=(m)=>{const[a,mm]=m.split('-');const nomes=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];return nomes[parseInt(mm)-1];};
  const maxVal=Math.max(...ult.map(m=>porMes[m].fat),1);
  const W=Math.max(320, ult.length*54), H=180, base=150, topo=10;
  let barras='';
  ult.forEach((m,i)=>{
    const d=porMes[m];
    const bw=20, gap=54, x=i*gap+8;
    const hF=Math.max(2,(d.fat/maxVal)*(base-topo));
    const hL=isAdmin?Math.max(0,(Math.max(0,d.luc)/maxVal)*(base-topo)):0;
    barras+=`<rect x="${x}" y="${base-hF}" width="${bw}" height="${hF}" rx="3" fill="#0071e3"><title>${nomeMesCurto(m)}: ${money(d.fat)}</title></rect>`;
    if(isAdmin) barras+=`<rect x="${x+bw+3}" y="${base-hL}" width="${bw}" height="${hL}" rx="3" fill="#34c759"><title>Lucro ${nomeMesCurto(m)}: ${money(d.luc)}</title></rect>`;
    barras+=`<text x="${x+bw}" y="${base+16}" font-size="11" fill="#6e6e73" text-anchor="middle">${nomeMesCurto(m)}</text>`;
  });
  return `
    <div class="card" style="margin-top:14px;overflow-x:auto">
      <div style="display:flex;gap:16px;margin-bottom:10px;font-size:12px">
        <span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;border-radius:3px;background:#0071e3;display:inline-block"></span>Faturado</span>
        ${isAdmin?`<span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;border-radius:3px;background:#34c759;display:inline-block"></span>Lucro</span>`:''}
      </div>
      <svg viewBox="0 0 ${W} ${H}" style="width:${W}px;max-width:none;height:${H}px">${barras}</svg>
    </div>`;
}

// ===== FOTOS SEPARADAS (referências) =====
// Uma foto pode estar salva de 2 jeitos:
//  - "data:image/..." = imagem embutida (jeito antigo)
//  - "ref:xxxxx"       = id de um documento na coleção 'fotos' (jeito novo, leve)
function imgFoto(f){
  // retorna o src pronto para <img>; se for referência, pega do cache (ou vazio até carregar)
  if(!f) return '';
  if(ehRefFoto(f)) return window.fotoCache[idDaRef(f)]||'';
  return f;
}
function temFoto(f){ return !!f && (!ehRefFoto(f) || !!window.fotoCache[idDaRef(f)]); }
function ehRefFoto(f){ return typeof f==='string' && f.indexOf('ref:')===0; }
function idDaRef(f){ return f.slice(4); }

function converterFotosParaRefs(fotos, cb){
  // recebe lista com dataURLs e/ou refs; salva as dataURLs novas na coleção e devolve lista de refs
  const lista=(fotos||[]).slice();
  if(!lista.length){ cb([]); return; }
  const resultado=new Array(lista.length);
  let pendentes=lista.length;
  lista.forEach((f,i)=>{
    if(ehRefFoto(f)){ resultado[i]=f; if(--pendentes===0) cb(resultado); return; }
    // é dataURL nova: salva separada
    salvarFotoSeparada(f, (ref)=>{ resultado[i]=ref; if(--pendentes===0) cb(resultado); });
  });
}
function salvarFotoSeparada(dataUrl, cb){
  // sobe a imagem para a coleção 'fotos' e retorna "ref:id"
  if(!fbReady || !fbFotos){ cb(dataUrl); return; } // sem nuvem: mantém embutida
  const id = 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  window.fotoCache[id]=dataUrl; // já deixa no cache local
  fbFotos.doc(id).set({ img:dataUrl, criado:Date.now() })
    .then(()=>cb('ref:'+id))
    .catch(()=>cb(dataUrl)); // se falhar, guarda embutida como antes
}

function resolverFoto(f, cb){
  // devolve o dataURL de uma foto, seja embutida ou referência
  if(!f){ cb(null); return; }
  if(!ehRefFoto(f)){ cb(f); return; } // já é imagem embutida
  const id=idDaRef(f);
  if(window.fotoCache[id]){ cb(window.fotoCache[id]); return; } // no cache
  if(!fbReady || !fbFotos){ cb(null); return; }
  fbFotos.doc(id).get()
    .then(snap=>{ const d=snap.data(); const img=d&&d.img; if(img) window.fotoCache[id]=img; cb(img||null); })
    .catch(()=>cb(null));
}

// pré-carrega no cache todas as fotos que estão como referência (chamado após carregar dados)
function precarregarFotos(){
  if(!fbReady || !fbFotos) return;
  const ids=new Set();
  const coletar=(arr)=>{ (arr||[]).forEach(o=>{ (o.fotos||[]).forEach(f=>{ if(ehRefFoto(f)) ids.add(idDaRef(f)); }); }); };
  coletar(db.produtos); coletar(db.acessorios); coletar(db.servicos);
  const pendentes=[...ids].filter(id=>!window.fotoCache[id]);
  if(!pendentes.length) return;
  let restantes=pendentes.length;
  pendentes.forEach(id=>{
    fbFotos.doc(id).get()
      .then(snap=>{ const d=snap.data(); if(d&&d.img) window.fotoCache[id]=d.img; })
      .catch(()=>{})
      .finally(()=>{ if(--restantes===0){ try{ render(currentTab); }catch(e){} } });
  });
}

function recomprimirDataURL(dataUrl, cb){
  // recomprime uma foto que já está salva (dataURL) para ficar menor
  if(!dataUrl || typeof dataUrl!=='string' || dataUrl.indexOf('data:image')!==0){ cb(dataUrl); return; }
  const img=new Image();
  img.onload=()=>{
    try{
      const max=800, sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(img.width*sc));
      cv.height=Math.max(1,Math.round(img.height*sc));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const out=cv.toDataURL('image/jpeg',0.55);
      // só usa a nova se ficou menor
      cb(out&&out.length>100&&out.length<dataUrl.length ? out : dataUrl);
    }catch(err){ cb(dataUrl); }
  };
  img.onerror=()=>cb(dataUrl);
  img.src=dataUrl;
}
function otimizarFotos(){
  if(!podeEditar()){ toast('Só o administrador'); return; }
  if(!fbReady || !fbFotos){ toast('Sem conexão com a nuvem'); return; }
  // conta o que tem hoje
  let embutidas=0, refs=0;
  const contar=(arr)=>{ (arr||[]).forEach(o=>{ (o.fotos||[]).forEach(f=>{ if(ehRefFoto(f)) refs++; else embutidas++; }); }); };
  contar(db.produtos); contar(db.acessorios);
  const tarefas=[];
  (db.produtos||[]).forEach(p=>{ if(Array.isArray(p.fotos)) p.fotos.forEach((f,i)=>{ if(!ehRefFoto(f)) tarefas.push({obj:p,idx:i}); }); });
  (db.acessorios||[]).forEach(a=>{ if(Array.isArray(a.fotos)) a.fotos.forEach((f,i)=>{ if(!ehRefFoto(f)) tarefas.push({obj:a,idx:i}); }); });
  (db.servicos||[]).forEach(a=>{ if(Array.isArray(a.fotos)) a.fotos.forEach((f,i)=>{ if(!ehRefFoto(f)) tarefas.push({obj:a,idx:i}); }); });
  if(!tarefas.length){
    // nada embutido — mas por que está grande? mostra o diagnóstico
    const tam=Math.round(JSON.stringify(db).length/1024);
    askConfirm('Diagnóstico: '+refs+' fotos já separadas, '+embutidas+' embutidas. Base='+tam+'KB. Se ainda está grande, toque OK para forçar reprocessar TODAS as fotos.', ()=>{ reprocessarTodasFotos(); });
    return;
  }
  const tamAntes=JSON.stringify(db).length;
  toast('Otimizando '+tarefas.length+' fotos ('+embutidas+' embutidas)... aguarde');
  let i=0, erros=0;
  const proximo=()=>{
    if(i>=tarefas.length){
      const tamDepois=JSON.stringify(db).length;
      saveDB();
      setTimeout(()=>{
        askConfirm('Resultado: base de '+Math.round(tamAntes/1024)+'KB → '+Math.round(tamDepois/1024)+'KB. Erros ao salvar na nuvem: '+erros+'. '+(erros>0?'Alguns não salvaram (veja regras do Firebase).':'Tudo certo!'), ()=>{ render(currentTab); });
      },300);
      return;
    }
    const t=tarefas[i++];
    const original=t.obj.fotos[t.idx];
    recomprimirDataURL(original, (comprimida)=>{
      const id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      fbFotos.doc(id).set({ img:comprimida, criado:Date.now() })
        .then(()=>{ window.fotoCache[id]=comprimida; t.obj.fotos[t.idx]='ref:'+id; })
        .catch((e)=>{ erros++; /* mantém embutida */ })
        .finally(()=>{ setTimeout(proximo, 40); });
    });
  };
  proximo();
}
function reprocessarTodasFotos(){
  // força: pega TODAS as fotos (inclusive as que já são ref, resolvendo do cache) e regrava comprimidas
  if(!fbReady || !fbFotos){ toast('Sem nuvem'); return; }
  const tarefas=[];
  const juntar=(arr)=>{ (arr||[]).forEach(o=>{ if(Array.isArray(o.fotos)) o.fotos.forEach((f,i)=>tarefas.push({obj:o,idx:i,val:f})); }); };
  juntar(db.produtos); juntar(db.acessorios);
  if(!tarefas.length){ toast('Nenhuma foto'); return; }
  toast('Reprocessando '+tarefas.length+' fotos...');
  let i=0, erros=0;
  const proximo=()=>{
    if(i>=tarefas.length){
      saveDB();
      setTimeout(()=>toast('✓ Base agora: '+Math.round(JSON.stringify(db).length/1024)+'KB (erros: '+erros+')'),300);
      return;
    }
    const t=tarefas[i++];
    resolverFoto(t.val, (dataUrl)=>{
      if(!dataUrl){ setTimeout(proximo,20); return; }
      recomprimirDataURL(dataUrl, (comp)=>{
        const id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
        fbFotos.doc(id).set({ img:comp, criado:Date.now() })
          .then(()=>{ window.fotoCache[id]=comp; t.obj.fotos[t.idx]='ref:'+id; })
          .catch(()=>{ erros++; })
          .finally(()=>{ setTimeout(proximo,40); });
      });
    });
  };
  proximo();
}
function comprimirFoto(file, cb){
  // aceita qualquer arquivo que seja imagem (por tipo ou por extensão)
  const nome=(file.name||'').toLowerCase();
  const ehImagem = (file.type&&file.type.indexOf('image')===0) || /\.(jpg|jpeg|png|webp|heic|heif|gif|bmp)$/.test(nome);
  if(!ehImagem){ toast('Arquivo não é imagem: '+(file.name||'')); cb(null); return; }
  const r=new FileReader();
  r.onload=()=>{
    const dataOriginal=r.result;
    const img=new Image();
    img.onload=()=>{
      try{
        const max=800, sc=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(img.width*sc));
        cv.height=Math.max(1,Math.round(img.height*sc));
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        const out=cv.toDataURL('image/jpeg',0.6);
        // se por algum motivo o canvas devolveu vazio, usa a original
        cb(out&&out.length>100 ? out : dataOriginal);
      }catch(err){ cb(dataOriginal); } // fallback: guarda a original
    };
    img.onerror=()=>{
      // formato que o navegador não desenha (ex: HEIC em alguns PCs): guarda original mesmo assim
      cb(dataOriginal);
    };
    img.src=dataOriginal;
  };
  r.onerror=()=>{ toast('Não consegui ler a foto'); cb(null); };
  r.readAsDataURL(file);
}
function addFoto(e){
  const files=Array.from(e.target.files||[]); if(!files.length)return;
  let pend=files.length, ok=0;
  files.forEach(file=>{
    comprimirFoto(file,(dataUrl)=>{
      if(dataUrl){ tempFotos.push(dataUrl); ok++; }
      pend--; if(pend===0){ renderFotos(); if(ok>0) toast(ok>1?ok+' fotos adicionadas':'Foto adicionada'); }
    });
  });
  e.target.value='';
}

  const dupSerie = serie && db.produtos.some(p=>p.id!==id && p.serie===serie);

  if(dupSerie){ toast('Número de série já cadastrado'); return; }

    const p=db.produtos.find(x=>x.id===id); Object.assign(p,data); prodFinal=p;

   }else{
    data.id=uid(); db.produtos.push(data); prodFinal=data; toast('Aparelho cadastrado');
   }
   saveDB();
   // Se este cadastro veio de uma troca dentro da venda, volta para o pagamento
   // e usa o valor de compra como valor da entrada do aparelho.
   if(usadoPagIndex!==null && pagState[usadoPagIndex]){
    const i=usadoPagIndex;
    usadoPagIndex=null;
    pagState[i].usadoProdutoId=prodFinal.id;
    pagState[i].usadoProduto={marca:prodFinal.marca,modelo:prodFinal.modelo,condicao:prodFinal.condicao,fotos:prodFinal.fotos||[]};
    if(!pagState[i].valor || pagState[i].valor===0){
      pagState[i].valor=Number(prodFinal.compra)||0;
    }
    closeSheet();
    drawPagamento();
    return;
   }
   usadoPagIndex=null;
   closeSheet(); render(currentTab);
  });
}

function textoOrcamento(p){
  const L=[];
  L.push('📱 *'+[p.marca,p.modelo].filter(Boolean).join(' ')+'*');
  const specs=[p.cor,p.armazenamento,p.condicao].filter(Boolean).join(' · ');
  if(specs) L.push(specs);
  if(p.condicao==='Seminovo'){
    if(p.bateria) L.push('🔋 Bateria: '+p.bateria+'%');
    if(p.telaTipo) L.push('📺 Tela: '+p.telaTipo);
    if(p.avaria && p.avaria!=='Não') L.push('⚠️ Avaria: '+p.avaria);
    if(p.detalhes) L.push('📝 '+p.detalhes);
  }
  L.push('');
  L.push('💰 *'+money(p.venda)+'*');
  L.push(blocoCondicoes(p.venda));
  L.push('');
  L.push('iTronic Rio Verde');
  return L.join('\n');
}
async function compartilharComFoto(id){
  const p=db.produtos.find(x=>x.id===id);
  if(!p){ toast('Aparelho não encontrado'); return; }
  const texto=textoOrcamento(p);
  const foto=await new Promise(r=>resolverFoto(p.fotos&&p.fotos[0], r));
  // tenta compartilhar com a foto (API nativa do celular)
  try{
    if(foto && navigator.canShare){
      const resp=await fetch(foto);
      const blob=await resp.blob();
      const file=new File([blob],'aparelho.jpg',{type:blob.type||'image/jpeg'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], text:texto});
        return;
      }
    }
    // sem foto ou navegador não suporta arquivo: compartilha só o texto
    if(navigator.share){ await navigator.share({text:texto}); return; }
  }catch(e){ /* usuário cancelou ou não deu — cai no fallback abaixo */ 
    if(e && e.name==='AbortError') return;
  }
  // fallback final: abre o WhatsApp com o texto
  enviarWhats(id);
}

function copiarMsg(i){

  const ok=()=>toast('Mensagem copiada');
  if(navigator.clipboard&&navigator.clipboard.writeText){

  }else copiarFallback(mo.m,ok);
}
function enviarWhats(id){
  const p=db.produtos.find(x=>x.id===id);

    if(fone.length<=11) fone='55'+fone;
  }
  const url='https://wa.me/'+fone+'?text='+texto;
  const a=document.createElement('a');
  a.href=url; a.target='_blank'; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();

function copiarOrcamento(id){
  const p=db.produtos.find(x=>x.id===id);
  if(!p){ toast('Aparelho não encontrado'); return; }
  const texto=textoOrcamento(p);
  const ok=()=>toast('Orçamento copiado');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(ok).catch(()=>copiarFallback(texto,ok));
  }else{
    copiarFallback(texto,ok);
  }
}
function copiarFallback(texto,ok){
  const ta=document.createElement('textarea');
  ta.value=texto;
  ta.contentEditable='true';
  ta.readOnly=false;
  ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0';
  ta.style.width='1px'; ta.style.height='1px'; ta.style.opacity='0';
  document.body.appendChild(ta);
  // iOS precisa de seleção via Range, não só .select()
  const range=document.createRange();
  range.selectNodeContents(ta);
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  ta.setSelectionRange(0,999999);
  let sucesso=false;
  try{ sucesso=document.execCommand('copy'); }catch(e){}
  ta.remove();
  if(sucesso){ ok(); }
  else{
    // último recurso: mostra o texto pra copiar na mão
    mostrarTextoParaCopiar(texto);
  }
}

function buscarCep(){

  toast('Buscando endereço...');

    .then(r=>r.json())
    .then(d=>{
      if(d.erro){ toast('CEP não encontrado'); return; }
      if(el('cl-rua')) el('cl-rua').value=d.logradouro||'';
      if(el('cl-bairro')) el('cl-bairro').value=d.bairro||'';

      if(el('cl-uf')) el('cl-uf').value=d.uf||'';

    })
    .catch(()=>toast('Sem internet para buscar o CEP'));

const FORMAS=['Pix','Dinheiro','Cartão de crédito','Cartão de débito','Entrada aparelho','Boleto'];
let pagState=[];
let usadoPagIndex=null; // índice da linha de pagamento que está cadastrando um aparelho de troca
function produtoAtualVenda(){
  // sempre busca o produto vigente pelo id, pra não usar referência velha

  if(vendaCart.produtoId){

function drawPagamento(){

  const html=`
    <div class="card" style="padding:2px 16px">

      <div class="detail-line"><span class="k">Lucro da venda</span><span class="v money-in ${lucroVendaAtual>=0?'pos':'neg'}" id="pag-lucro" style="font-weight:700">${money(lucroVendaAtual)}</span></div>
    </div>

    <div class="sec-title">Formas de pagamento</div>

      ${FORMAS.map(f=>`<div class="p" onclick="addForma('${f}')">+ ${f}</div>`).join('')}
    </div>

    <div class="card" style="margin-top:16px" id="pag-totais">
      <div class="detail-line"><span class="k">Total pago</span><span class="v money-in">${money(pago)}</span></div>
      <div class="detail-line"><span class="k">${falta>0?'Falta':falta<0?'Troco/excedente':'Fechado'}</span><span class="v money-in ${falta>0?'neg':'pos'}">${money(Math.abs(falta))}</span></div>
      <div class="detail-line"><span class="k">Você recebe (líquido)</span><span class="v money-in">${money(liquidoTotal)}</span></div>
    </div>
    ${falta>0?`<label style="display:flex;align-items:center;gap:8px;margin:12px 4px;font-size:14px;color:var(--text2)"><input type="checkbox" id="pag-receber" style="width:18px;height:18px"> Deixar ${money(falta)} como conta a receber</label>`:''}
    <button class="btn" onclick="finalizarVenda(${total},${falta})" style="margin-top:8px">Finalizar venda</button>
  `;

function pagCard(p,i){
  const isCartao=p.forma==='Cartão de crédito';
  const isUsado=p.forma==='Entrada aparelho';
  return `<div class="card" style="padding:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <b>${p.forma}</b>
      <button onclick="pagState.splice(${i},1);drawPagamento()" style="color:var(--red);font-size:14px;font-weight:500">Remover</button>
    </div>
    <div class="mini-lbl">Valor</div>
    <input class="input" type="number" inputmode="decimal" value="${p.valor||''}" placeholder="0,00" oninput="pagState[${i}].valor=parseFloat(this.value)||0;drawTotals()">
    ${isCartao?`
      <div class="form-row" style="margin-top:10px">
        <div><div class="mini-lbl">Taxa do cartão (%)</div><input class="input" type="number" inputmode="decimal" value="${p.taxa||''}" placeholder="ex: 16" oninput="pagState[${i}].taxa=parseFloat(this.value)||0;drawTotals()"></div>
        <div><div class="mini-lbl">Parcelas</div><input class="input" type="number" inputmode="numeric" value="${p.parcelas||''}" placeholder="1" oninput="pagState[${i}].parcelas=parseInt(this.value)||1;drawTotals()"></div>
      </div>
      <div id="cartao-out-${i}" style="margin-top:12px">${cartaoResumo(p)}</div>
    `:''}
    ${isUsado?`
      ${p.usadoProduto?`
        <div class="card" style="padding:2px 16px;background:var(--bg2);box-shadow:none;margin-top:6px">
          <div class="detail-line"><span class="k">Aparelho</span><span class="v">${(p.usadoProduto.marca||'')+' '+(p.usadoProduto.modelo||'')}</span></div>
          <div class="detail-line"><span class="k">Condição</span><span class="v">${p.usadoProduto.condicao||'—'}</span></div>
          <div class="detail-line"><span class="k">Fotos</span><span class="v">${(p.usadoProduto.fotos||[]).length} foto(s)</span></div>
        </div>
        <button class="btn ghost" style="margin-top:8px" onclick="cadastrarUsado(${i})">Editar cadastro do aparelho</button>
      `:`
        <div style="font-size:13px;color:var(--text2);margin-top:8px">Cadastre o aparelho que está entrando na troca. Ele vai direto para o estoque.</div>
        <button class="btn" style="margin-top:8px" onclick="cadastrarUsado(${i})">Cadastrar aparelho completo</button>
      `}
    `:''}
  </div>`;
}
function cartaoResumo(p){
  const valor=Number(p.valor)||0;
  const taxa=Number(p.taxa)||0;
  const parc=Math.max(1,Number(p.parcelas)||1);
  const juros=valor*taxa/100;
  const totalCliente=valor+juros;
  const porParc=totalCliente/parc;
  return `<div class="card" style="padding:2px 16px;background:var(--bg2);box-shadow:none">
    <div class="detail-line"><span class="k">Valor do iPhone</span><span class="v money-in">${money(valor)}</span></div>
    <div class="detail-line"><span class="k">Juros (${taxa||0}%)</span><span class="v money-in neg">+ ${money(juros)}</span></div>
    <div class="detail-line"><span class="k">Cliente paga</span><span class="v money-in" style="font-size:17px">${money(totalCliente)}</span></div>
    <div class="detail-line"><span class="k">Parcelas</span><span class="v money-in">${parc}x de ${money(porParc)}</span></div>
  </div>`;
}
function liquidoDe(p){
  // Juros por cima: os juros são pagos pelo cliente, você recebe o valor do produto.
  // Entrada de aparelho NÃO é dinheiro que entrou no caixa — é um produto que foi pro
  // estoque. Por isso não conta como saldo líquido recebido nem como lucro na venda.
  // Ele só vira lucro/prejuízo quando o aparelho da troca for vendido depois.
  if(p.forma==='Entrada aparelho') return 0;
  return Number(p.valor)||0;
}
function addForma(f){
  const prod=produtoAtualVenda();
  const total=(prod.venda||0)-(vendaCart.desconto||0);
  const pago=pagState.reduce((s,p)=>s+(Number(p.valor)||0),0);
  // Entrada aparelho começa em branco: você digita o valor que o aparelho vale.
  // As outras formas já vêm preenchidas com o valor que falta pra fechar.
  const valorInicial = f==='Entrada aparelho' ? 0 : Math.max(0,total-pago);
  pagState.push({forma:f, valor:valorInicial, parcelas:1, usadoEstoque:true});
  drawPagamento();
}
function cadastrarUsado(i){
  // abre o cadastro completo de produto para o aparelho que está entrando na troca.
  // quando salvar, o produto entra no estoque e o valor da linha de pagamento
  // passa a ser o valor de compra informado (o quanto você aceitou pelo aparelho).
  const existente = pagState[i].usadoProdutoId
    ? db.produtos.find(p=>p.id===pagState[i].usadoProdutoId)
    : null;
  usadoPagIndex = i;
  openProduto(existente || null);
}
function drawTotals(){
  // atualiza os resumos de cartão ao vivo sem redesenhar os inputs (não perde o foco)
  pagState.forEach((p,i)=>{
    if(p.forma==='Cartão de crédito'){
      const box=el('cartao-out-'+i);
      if(box) box.innerHTML=cartaoResumo(p);
    }
  });
  // atualiza o rodapé (Total pago / Falta / Líquido) ao vivo quando o valor muda
  const prod=produtoAtualVenda();
  if(prod){
    const total=(prod.venda||0)-(vendaCart.desconto||0);
    const pago=pagState.reduce((s,p)=>s+(Number(p.valor)||0),0);
    const falta=total-pago;
    const liquidoTotal=pagState.reduce((s,p)=>s+liquidoDe(p),0);
    const box=el('pag-totais');
    if(box){
      box.innerHTML=`
      <div class="detail-line"><span class="k">Total pago</span><span class="v money-in">${money(pago)}</span></div>
      <div class="detail-line"><span class="k">${falta>0?'Falta':falta<0?'Troco/excedente':'Fechado'}</span><span class="v money-in ${falta>0?'neg':'pos'}">${money(Math.abs(falta))}</span></div>
      <div class="detail-line"><span class="k">Você recebe (líquido)</span><span class="v money-in">${money(liquidoTotal)}</span></div>`;
    }
    // atualiza o lucro da venda ao vivo (venda − custo − entrada de aparelho)
    const lucroBox=el('pag-lucro');
    if(lucroBox){
      const custoProd=Number(prod.compra)||0;
      const trocaVal=pagState.reduce((s,p)=>s+(p.forma==='Entrada aparelho'?(Number(p.valor)||0):0),0);
      const lu=total-custoProd-trocaVal;
      lucroBox.textContent=money(lu);
      lucroBox.classList.remove('pos','neg');
      lucroBox.classList.add(lu>=0?'pos':'neg');
    }
  }
}
function finalizarVendaCarrinho(){
  const q=carrinhoQtd();
  if(!q){ toast('Carrinho vazio'); return; }
  // precisa de cliente: usa o já selecionado na venda, ou pede pra escolher
  if(!vendaCart.cliente){
    closeSheet();
    toast('Escolha o cliente primeiro');
    go('venda');
    setTimeout(pickCliente,300);
    return;
  }
  const total=carrinhoTotal();
  // monta um "produto virtual" representando o carrinho inteiro
  const custoTotal=carrinho.reduce((s,it)=>{
    if(it.tipo==='aparelho'){ const p=db.produtos.find(x=>x.id===it.id); return s+(p?Number(p.compra)||0:0); }
    if(it.tipo==='acessorio'){ const a=(db.acessorios||[]).find(x=>x.id===it.id); return s+(a?(Number(a.custo)||0)*it.qtd:0); }
    return s;
  },0);
  vendaCart.produto={ _carrinho:true, venda:total, marca:'Carrinho', modelo:'('+q+' itens)', compra:custoTotal };
  vendaCart.produtoId=null;
  vendaCart.desconto=0;
  closeSheet();
  pagState=[];
  drawPagamento();
}
function finalizarVenda(total,falta){
  const pago=pagState.reduce((s,p)=>s+(Number(p.valor)||0),0);
  if(pagState.length===0){ toast('Adicione uma forma de pagamento'); return; }
  const usadoSemCadastro=pagState.some(x=>x.forma==='Entrada aparelho' && !x.usadoProdutoId);
  if(usadoSemCadastro){ toast('Cadastre o aparelho da troca'); return; }
  let aReceber=0;
  if(falta>0){
    const chk=el('pag-receber');
    if(chk&&chk.checked) aReceber=falta;
    else { toast('Falta '+money(falta)+' para fechar'); return; }
  }
  const liquido=pagState.reduce((s,p)=>s+liquidoDe(p),0) - (falta>0?0:0);
  const p=produtoAtualVenda();
  if(!p){ toast('Aparelho não encontrado, selecione novamente'); return; }
  const ehCarrinho = p && p._carrinho;
  const ehAcessorio = p && p._acessorios;
  let itensVenda;
  if(ehCarrinho){
    itensVenda=[];
    carrinho.forEach(it=>{
      if(it.tipo==='aparelho'){ const pr=db.produtos.find(x=>x.id===it.id); if(pr) itensVenda.push({prodId:pr.id, nome:pr.marca+' '+pr.modelo, cat:pr.cat, serie:pr.serie||pr.imei||'', venda:Number(pr.venda)||0, compra:Number(pr.compra)||0}); }
      if(it.tipo==='acessorio'){ const a=(db.acessorios||[]).find(x=>x.id===it.id); if(a) itensVenda.push({acessId:a.id, nome:a.nome, cat:'Acessório', sub:a.sub, qtd:it.qtd, venda:(Number(a.venda)||0)*it.qtd, compra:(Number(a.custo)||0)*it.qtd}); }
    });
  }else if(ehAcessorio){
    const acess=db.acessorios||[];
    itensVenda=carrinhoAcess.map(it=>{ const a=acess.find(x=>x.id===it.id)||{}; return {acessId:it.id, nome:a.nome, cat:'Acessório', sub:a.sub, qtd:it.qtd, venda:(Number(a.venda)||0)*it.qtd, compra:(Number(a.custo)||0)*it.qtd}; });
  }else{

  };

      if(it.tipo==='acessorio'){ const a=(db.acessorios||[]).find(x=>x.id===it.id); if(a){ a.qtd=Math.max(0,(Number(a.qtd)||0)-it.qtd); if(a.qtd<=0 && (!a.situacao||a.situacao==='Disponível')) a.situacao='Sem estoque'; } }
    });

  }else{
    p.status='Vendido';
    p.vendidoEm=todayStr();
  }
  saveDB();
  closeSheet();
  resetVenda();

function calcSimTroca(){
  const vNovo=parseFloat(String(getV('sim-val-novo')).replace(',','.'))||0;
  const vUsado=simState.semTroca?0:(parseFloat(String(getV('sim-val-usado')).replace(',','.'))||0);

  const eldif=el('sim-difer'); if(eldif) eldif.textContent=money(difer);
  const tx=db.taxasCartao||{debito:1.5,imposto:0,credito:[]};
  const imposto=Number(tx.imposto)||0;
  const parc=simState.parcCred||1;
  // taxa + imposto repassados pro cliente: valor / (1 - (taxa+imposto)%)
  const comTaxa=(base,taxa)=>{ const t=taxa+imposto; return t>0 ? base/(1-t/100) : base; };
  const taxaCred=(tx.credito&&tx.credito[parc-1])||0;
  const vDebito=comTaxa(difer,tx.debito);
  const vCredito=comTaxa(difer,taxaCred);
  const out=el('sim-out');
  if(out){
    out.innerHTML=`
      <div class="pay-opt pay-pix">
        <div class="pay-ico">💠</div>
        <div class="pay-mid"><div class="pay-nome">À vista no Pix</div><div class="pay-sub">Sem taxa</div></div>
