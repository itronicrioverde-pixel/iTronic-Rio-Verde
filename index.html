function servRow(s,isAdmin){
  const situacao=s.situacao||'Disponível';
  const badgeCor = situacao==='Disponível'?'#34c759':(situacao==='Aguardando pedido'?'#ff9500':'#ff3b30');
  const badgeTxt = situacao==='Sem estoque'?'Sem peça':(situacao==='Aguardando pedido'?'Aguardando':'Disponível');
  const qual=s.qualidade||'Original';
  const qCor = qual==='Original'?'#467a3d':(qual==='Premium'?'#8b5cf6':'#ff9500');
  const qBg = qual==='Original'?'#e3f2ff':(qual==='Premium'?'#f3ecff':'#fff0e6');
  return `<div class="row" onclick="acaoServico('${s.id}')">
    <div class="thumb" style="${s.fotos&&s.fotos[0]?'padding:5px;background:#fff;border:1px solid var(--line)':''}">${s.fotos&&s.fotos[0]?`<img src="${imgFoto(s.fotos[0])}" style="width:100%;height:100%;object-fit:contain">`:vectorIcon('wrench')}</div>
    <div class="info"><div class="t"><span style="display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:${qBg};color:${qCor};margin-right:6px">${qual}</span>${s.modelo||''}</div><div class="s"><span style="color:${badgeCor};font-weight:600">${badgeTxt}</span>${isAdmin&&s.custo?' · custo '+money(s.custo):''}</div></div>
    <div class="right"><div class="p money-in">${money(s.venda)}</div>${chev()}</div>
  </div>`;
}

function toggleCatServ(cat){ catsServAbertas[cat]=!catsServAbertas[cat]; renderAssistenciaPage(); }

function editarServico(id){ const s=(db.servicos||[]).find(x=>x.id===id); formServico(s); }
function formServico(s){
  if(!podeEditar()){ toast('Só o administrador pode cadastrar/editar'); return; }
  tempFotosServ = s ? (s.fotos||[]).slice() : [];
  const catsUsadas=[...new Set([...SERVICOS_PADRAO, ...(db.servicos||[]).map(x=>x.categoria).filter(Boolean)])];
  const catAtual=s?s.categoria:'';
  const optCats=['<option value="">— escolha o tipo —</option>']
    .concat(catsUsadas.map(cc=>`<option value="${cc}" ${cc===catAtual?'selected':''}>${cc}</option>`))
    .concat(['<option value="__nova__">+ Novo tipo...</option>']).join('');
  const html=`
    ${fld('Nome do serviço','sv-nome',{ph:'ex: Troca de Tela iPhone 13',val:s?s.nome:''})}
    <div class="field"><label>Tipo de serviço</label>
      <select class="input" id="sv-cat" onchange="if(this.value==='__nova__'){el('sv-cat-nova').style.display='block';el('sv-cat-nova').focus();}else{el('sv-cat-nova').style.display='none';}">${optCats}</select>
      <input class="input" id="sv-cat-nova" placeholder="Digite o novo tipo" style="display:none;margin-top:8px" value="${catAtual&&!catsUsadas.includes(catAtual)?catAtual:''}">
    </div>
    ${fld('Modelo / compatibilidade','sv-modelo',{ph:'ex: iPhone 13, 13 Pro',val:s?s.modelo:''})}
    ${selFld('Qualidade da peça','sv-qual',['Original','Premium','Paralela'],s?(s.qualidade||'Original'):'Original')}
    ${selFld('Situação','sv-sit',['Disponível','Aguardando pedido','Sem estoque'],s?(s.situacao||'Disponível'):'Disponível')}
    ${fld('Preço do serviço (cliente)','sv-venda',{ph:'0,00',val:s?s.venda:''})}
    ${fld('Custo da peça (só você vê)','sv-custo',{ph:'0,00',val:s?s.custo:''})}
    ${fld('Fornecedor da peça','sv-forn',{ph:'de onde compra',val:s?s.fornecedor:''})}
    <div class="field"><label>Fotos</label>
      <button class="btn secondary" onclick="el('sv-foto-input').click()" style="width:auto;padding:8px 14px">${vectorIcon('camera')} Adicionar fotos</button>
      <input type="file" id="sv-foto-input" accept="image/*,.jpg,.jpeg,.png,.webp,.heic,.heif" multiple style="display:none" onchange="addFotoServ(event)">
      <div id="sv-fotos-grid" class="photo-grid" style="margin-top:10px"></div>
    </div>
  `;
  openSheet(s?'Editar serviço':'Novo serviço', html, 'Salvar', ()=>{
    const nome=getV('sv-nome').trim();
    if(!nome){ toast('Informe o nome'); return; }
    let categoria=getV('sv-cat');
    if(categoria==='__nova__') categoria=getV('sv-cat-nova').trim();
    else if(el('sv-cat-nova')&&el('sv-cat-nova').value.trim()&&categoria==='') categoria=getV('sv-cat-nova').trim();
    const dados={
      nome, categoria,
      modelo:getV('sv-modelo').trim(),
      qualidade:getV('sv-qual'),
      situacao:getV('sv-sit'),
      venda:parseFloat(String(getV('sv-venda')).replace(',','.'))||0,
      custo:parseFloat(String(getV('sv-custo')).replace(',','.'))||0,
      fornecedor:getV('sv-forn').trim()
    };
    converterFotosParaRefs(tempFotosServ.slice(), (refs)=>{
      dados.fotos=refs;
      if(s){ Object.assign(s,dados); toast('Serviço atualizado'); }
      else { dados.id=uid(); dados.entrada=todayStr(); db.servicos.push(dados); toast('Serviço cadastrado'); }
      saveDB(); closeSheet(); renderAssistenciaPage();
    });
  });
  setTimeout(renderFotosServ,60);
  if(s){
    setTimeout(()=>{
      const body=el('sheet-body');
      if(body){ const b=document.createElement('button'); b.className='btn ghost'; b.style.marginTop='10px'; b.style.color='var(--red)'; b.textContent='Excluir serviço';
        b.onclick=()=>askConfirm('Excluir este serviço?',()=>{ db.servicos=db.servicos.filter(x=>x.id!==s.id); carrinhoServ=carrinhoServ.filter(x=>x!==s.id); saveDB(); closeSheet(); renderAssistenciaPage(); toast('Excluído'); });
        body.appendChild(b);
      }
    },80);
  }
}
function addFotoServ(e){
  const files=Array.from(e.target.files||[]); if(!files.length)return;
  let pend=files.length, ok=0;
  files.forEach(file=>{
    comprimirFoto(file,(dataUrl)=>{
      if(dataUrl){ tempFotosServ.push(dataUrl); ok++; }
      pend--; if(pend===0){ renderFotosServ(); if(ok>0) toast(ok>1?ok+' fotos adicionadas':'Foto adicionada'); }
    });
  });
  e.target.value='';
}
function renderFotosServ(){
  const g=el('sv-fotos-grid'); if(!g) return;
  g.innerHTML=tempFotosServ.map((f,i)=>`<div style="position:relative;display:inline-block"><img class="ph" style="width:80px;height:80px" src="${f}"><button onclick="tempFotosServ.splice(${i},1);renderFotosServ()" style="position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;width:22px;height:22px;border-radius:50%;font-size:14px">×</button></div>`).join('');
}

function acaoServico(id){
  const s=(db.servicos||[]).find(x=>x.id===id);
  if(!s) return;
  const html=`
    <div class="list">
      ${podeEditar()?`<div class="row" onclick="closeSheet();setTimeout(()=>editarServico('${id}'),300)"><div class="thumb">${vectorIcon('edit')}</div><div class="info"><div class="t">Editar serviço</div></div></div>`:''}
      <div class="row" onclick="enviarOrcamentoServ('${id}','whats')"><div class="thumb">${vectorIcon('send')}</div><div class="info"><div class="t">Enviar orçamento (WhatsApp)</div></div></div>
      <div class="row" onclick="compartilharServFoto('${id}')"><div class="thumb">${vectorIcon('camera')}</div><div class="info"><div class="t">Compartilhar com foto</div></div></div>
      <div class="row" onclick="enviarOrcamentoServ('${id}','copiar')"><div class="thumb">${vectorIcon('copy')}</div><div class="info"><div class="t">Copiar orçamento</div></div></div>
    </div>`;
  openSheet(s.nome, html);
}
function textoServico(s){
  const L=[];
  L.push('🔧 *'+s.nome+'*');
  if(s.qualidade) L.push('Peça: '+s.qualidade);
  if(s.modelo) L.push('Compatível: '+s.modelo);
  L.push('💰 '+money(s.venda));
  L.push(blocoCondicoes(s.venda));
  L.push('');
  L.push('📲 iTronic Rio Verde');
  return L.join('\n');
}
function enviarOrcamentoServ(id,modo){
  const s=(db.servicos||[]).find(x=>x.id===id);
  if(!s) return;
  const texto=textoServico(s);
  if(modo==='copiar'){
    const ok=()=>toast('Orçamento copiado');
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok).catch(()=>copiarFallback(texto,ok));
    else copiarFallback(texto,ok);
    return;
  }
  const url='https://wa.me/?text='+encodeURIComponent(texto);
  const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
}
async function compartilharServFoto(id){
  const s=(db.servicos||[]).find(x=>x.id===id);
  if(!s) return;
  const texto=textoServico(s);
  const foto=await new Promise(r=>resolverFoto(s.fotos&&s.fotos[0], r));
  try{
    if(foto && navigator.canShare){
      const resp=await fetch(foto); const blob=await resp.blob();
      const file=new File([blob],'servico.jpg',{type:blob.type||'image/jpeg'});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],text:texto}); return; }
    }
    if(navigator.share){ await navigator.share({text:texto}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  enviarOrcamentoServ(id,'whats');
}

function mudarQtdAcess(id,delta){
  const a=(db.acessorios||[]).find(x=>x.id===id);
  if(!a) return;
  if(delta>0 && (a.situacao&&a.situacao!=='Disponível')){ toast('Acessório '+a.situacao.toLowerCase()); return; }
  // opera direto no carrinho unificado
  let item=carrinho.find(x=>x.tipo==='acessorio'&&x.id===id);
  if(!item){ if(delta>0){ carrinho.push({tipo:'acessorio', id, qtd:1}); } }
  else{
    item.qtd+=delta;
    if(item.qtd<=0) carrinho=carrinho.filter(x=>!(x.tipo==='acessorio'&&x.id===id));
    else if(item.qtd>a.qtd){ item.qtd=a.qtd; toast('Só tem '+a.qtd+' em estoque'); }
  }
  // mantém carrinhoAcess como espelho (algumas telas ainda leem dele)
  carrinhoAcess=carrinho.filter(x=>x.tipo==='acessorio').map(x=>({id:x.id,qtd:x.qtd}));
  renderVenda();
  atualizarBadgeCarrinho();
}

async function compartilharAcessFoto(id){
  const a=(db.acessorios||[]).find(x=>x.id===id);
  if(!a) return;
  const texto=textoAcessorio(a);
  const foto=await new Promise(r=>resolverFoto(a.fotos&&a.fotos[0], r));
  try{
    if(foto && navigator.canShare){
      const resp=await fetch(foto); const blob=await resp.blob();
      const file=new File([blob],'acessorio.jpg',{type:blob.type||'image/jpeg'});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],text:texto}); return; }
    }
    if(navigator.share){ await navigator.share({text:texto}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  enviarOrcamentoAcess(id,'whats');
}

function renderRelatorios(){
  const isAdmin=session&&session.role==='Administrador';
  const todos = relMesSelecionado==='todos';
  const mes=todos?'todos':(relMesSelecionado||todayStr().slice(0,7));
  const vendasMes= todos ? vendasVisiveis() : vendasVisiveis().filter(v=>v.data.slice(0,7)===mes);
  const totalMes=vendasMes.reduce((s,v)=>s+vendaLiquido(v),0);
  const lucroMes=vendasMes.reduce((s,v)=>s+lucroVenda(v),0);
  const invest=db.produtos.filter(p=>p.status!=='Vendido').reduce((s,p)=>s+(Number(p.compra)||0),0);

  // monta a lista de meses que têm venda + os últimos 12 meses, pra escolher
  const mesesComVenda=new Set(vendasVisiveis().map(v=>v.data.slice(0,7)));
  const hoje=new Date();
  for(let i=0;i<12;i++){

    mesesComVenda.add(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }

  const meses=[...mesesComVenda].sort().reverse();
  const nomeMes=(m)=>{const[a,mm]=m.split('-');const nomes=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];return nomes[parseInt(mm)-1]+'/'+a;};
  const tituloPeriodo = todos ? 'Todos os meses' : nomeMes(mes);

  el('page-relatorios').innerHTML=`
    <div class="sec-title">${todos?'Resumo geral':'Resumo do mês'}</div>

    </div>`:''}

    ${todos?graficoAnual(isAdmin):''}

    <div class="sec-title">Relatórios</div>
    <div class="list">
      <div class="row" onclick="relVendas()"><div class="thumb">${vectorIcon('receipt')}</div><div class="info"><div class="t">Relatório de vendas</div><div class="s">Vendas de ${tituloPeriodo}</div></div>${chev()}</div>

      ${isAdmin?`<div class="row" onclick="relLucro()"><div class="thumb">${vectorIcon('chart')}</div><div class="info"><div class="t">Relatório de lucro</div><div class="s">Lucro de ${tituloPeriodo}</div></div>${chev()}</div>`:''}
    </div>
    <div style="height:20px"></div>
  `;

function graficoAnual(isAdmin){
  // agrupa faturamento e lucro por mês (últimos 12 meses com movimento)
  const porMes={};
  vendasVisiveis().forEach(v=>{
    const m=v.data.slice(0,7);
    if(!porMes[m]) porMes[m]={fat:0,luc:0};
    porMes[m].fat+=vendaLiquido(v);
    porMes[m].luc+=lucroVenda(v);
  });
  const meses=Object.keys(porMes).sort();
  if(!meses.length) return '<div class="empty" style="margin-top:14px">Sem vendas ainda para montar o gráfico.</div>';
  const ult=meses.slice(-12);
  const nomeMesCurto=(m)=>{const[a,mm]=m.split('-');const nomes=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];return nomes[parseInt(mm)-1];};
  const maxVal=Math.max(...ult.map(m=>porMes[m].fat),1);
  const W=Math.max(320, ult.length*54), H=180, base=150, topo=10;
  let barras='';
  ult.forEach((m,i)=>{
    const d=porMes[m];
    const bw=20, gap=54, x=i*gap+8;
    const hF=Math.max(2,(d.fat/maxVal)*(base-topo));
    const hL=isAdmin?Math.max(0,(Math.max(0,d.luc)/maxVal)*(base-topo)):0;
    barras+=`<rect x="${x}" y="${base-hF}" width="${bw}" height="${hF}" rx="3" fill="#467a3d"><title>${nomeMesCurto(m)}: ${money(d.fat)}</title></rect>`;
    if(isAdmin) barras+=`<rect x="${x+bw+3}" y="${base-hL}" width="${bw}" height="${hL}" rx="3" fill="#34c759"><title>Lucro ${nomeMesCurto(m)}: ${money(d.luc)}</title></rect>`;
    barras+=`<text x="${x+bw}" y="${base+16}" font-size="11" fill="#6e6e73" text-anchor="middle">${nomeMesCurto(m)}</text>`;
  });
  return `
    <div class="card" style="margin-top:14px;overflow-x:auto">
      <div style="display:flex;gap:16px;margin-bottom:10px;font-size:12px">
        <span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;border-radius:3px;background:#467a3d;display:inline-block"></span>Faturado</span>
        ${isAdmin?`<span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;border-radius:3px;background:#34c759;display:inline-block"></span>Lucro</span>`:''}
      </div>
      <svg viewBox="0 0 ${W} ${H}" style="width:${W}px;max-width:none;height:${H}px">${barras}</svg>
    </div>`;
}

// ===== FOTOS SEPARADAS (referências) =====
// Uma foto pode estar salva de 2 jeitos:
//  - "data:image/..." = imagem embutida (jeito antigo)
//  - "ref:xxxxx"       = id de um documento na coleção 'fotos' (jeito novo, leve)
function imgFoto(f){
  // retorna o src pronto para <img>; se for referência, pega do cache (ou vazio até carregar)
  if(!f) return '';
  if(ehRefFoto(f)) return window.fotoCache[idDaRef(f)]||'';
  return f;
}
function temFoto(f){ return !!f && (!ehRefFoto(f) || !!window.fotoCache[idDaRef(f)]); }
function ehRefFoto(f){ return typeof f==='string' && f.indexOf('ref:')===0; }
function idDaRef(f){ return f.slice(4); }

function converterFotosParaRefs(fotos, cb){
  // recebe lista com dataURLs e/ou refs; salva as dataURLs novas na coleção e devolve lista de refs
  const lista=(fotos||[]).slice();
  if(!lista.length){ cb([]); return; }
  const resultado=new Array(lista.length);
  let pendentes=lista.length;
  lista.forEach((f,i)=>{
    if(ehRefFoto(f)){ resultado[i]=f; if(--pendentes===0) cb(resultado); return; }
    // é dataURL nova: salva separada
    salvarFotoSeparada(f, (ref)=>{ resultado[i]=ref; if(--pendentes===0) cb(resultado); });
  });
}
function salvarFotoSeparada(dataUrl, cb){
  // sobe a imagem para a coleção 'fotos' e retorna "ref:id"
  if(!fbReady || !fbFotos){ cb(dataUrl); return; } // sem nuvem: mantém embutida
  const id = 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  window.fotoCache[id]=dataUrl; // já deixa no cache local
  fbFotos.doc(id).set({ img:dataUrl, criado:Date.now() })
    .then(()=>cb('ref:'+id))
    .catch(()=>cb(dataUrl)); // se falhar, guarda embutida como antes
}

function resolverFoto(f, cb){
  // devolve o dataURL de uma foto, seja embutida ou referência
  if(!f){ cb(null); return; }
  if(!ehRefFoto(f)){ cb(f); return; } // já é imagem embutida
  const id=idDaRef(f);
  if(window.fotoCache[id]){ cb(window.fotoCache[id]); return; } // no cache
  if(!fbReady || !fbFotos){ cb(null); return; }
  fbFotos.doc(id).get()
    .then(snap=>{ const d=snap.data(); const img=d&&d.img; if(img) window.fotoCache[id]=img; cb(img||null); })
    .catch(()=>cb(null));
}

// pré-carrega no cache todas as fotos que estão como referência (chamado após carregar dados)
function precarregarFotos(){
  if(!fbReady || !fbFotos) return;
  const ids=new Set();
  const coletar=(arr)=>{ (arr||[]).forEach(o=>{ (o.fotos||[]).forEach(f=>{ if(ehRefFoto(f)) ids.add(idDaRef(f)); }); }); };
  coletar(db.produtos); coletar(db.acessorios); coletar(db.servicos);
  const pendentes=[...ids].filter(id=>!window.fotoCache[id]);
  if(!pendentes.length) return;
  let restantes=pendentes.length;
  pendentes.forEach(id=>{
    fbFotos.doc(id).get()
      .then(snap=>{ const d=snap.data(); if(d&&d.img) window.fotoCache[id]=d.img; })
      .catch(()=>{})
      .finally(()=>{ if(--restantes===0){ try{ render(currentTab); }catch(e){} } });
  });
}

function recomprimirDataURL(dataUrl, cb){
  // recomprime uma foto que já está salva (dataURL) para ficar menor
  if(!dataUrl || typeof dataUrl!=='string' || dataUrl.indexOf('data:image')!==0){ cb(dataUrl); return; }
  const img=new Image();
  img.onload=()=>{
    try{
      const max=800, sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(img.width*sc));
      cv.height=Math.max(1,Math.round(img.height*sc));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const out=cv.toDataURL('image/jpeg',0.55);
      // só usa a nova se ficou menor
      cb(out&&out.length>100&&out.length<dataUrl.length ? out : dataUrl);
    }catch(err){ cb(dataUrl); }
  };
  img.onerror=()=>cb(dataUrl);
  img.src=dataUrl;
}
function otimizarFotos(){
  if(!podeEditar()){ toast('Só o administrador'); return; }
  if(!fbReady || !fbFotos){ toast('Sem conexão com a nuvem'); return; }
  // conta o que tem hoje
  let embutidas=0, refs=0;
  const contar=(arr)=>{ (arr||[]).forEach(o=>{ (o.fotos||[]).forEach(f=>{ if(ehRefFoto(f)) refs++; else embutidas++; }); }); };
  contar(db.produtos); contar(db.acessorios);
  const tarefas=[];
  (db.produtos||[]).forEach(p=>{ if(Array.isArray(p.fotos)) p.fotos.forEach((f,i)=>{ if(!ehRefFoto(f)) tarefas.push({obj:p,idx:i}); }); });
  (db.acessorios||[]).forEach(a=>{ if(Array.isArray(a.fotos)) a.fotos.forEach((f,i)=>{ if(!ehRefFoto(f)) tarefas.push({obj:a,idx:i}); }); });
  (db.servicos||[]).forEach(a=>{ if(Array.isArray(a.fotos)) a.fotos.forEach((f,i)=>{ if(!ehRefFoto(f)) tarefas.push({obj:a,idx:i}); }); });
  if(!tarefas.length){
    // nada embutido — mas por que está grande? mostra o diagnóstico
    const tam=Math.round(JSON.stringify(db).length/1024);
    askConfirm('Diagnóstico: '+refs+' fotos já separadas, '+embutidas+' embutidas. Base='+tam+'KB. Se ainda está grande, toque OK para forçar reprocessar TODAS as fotos.', ()=>{ reprocessarTodasFotos(); });
    return;
  }
  const tamAntes=JSON.stringify(db).length;
  toast('Otimizando '+tarefas.length+' fotos ('+embutidas+' embutidas)... aguarde');
  let i=0, erros=0;
  const proximo=()=>{
    if(i>=tarefas.length){
      const tamDepois=JSON.stringify(db).length;
      saveDB();
      setTimeout(()=>{
        askConfirm('Resultado: base de '+Math.round(tamAntes/1024)+'KB → '+Math.round(tamDepois/1024)+'KB. Erros ao salvar na nuvem: '+erros+'. '+(erros>0?'Alguns não salvaram (veja regras do Firebase).':'Tudo certo!'), ()=>{ render(currentTab); });
      },300);
      return;
    }
    const t=tarefas[i++];
    const original=t.obj.fotos[t.idx];
    recomprimirDataURL(original, (comprimida)=>{
      const id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      fbFotos.doc(id).set({ img:comprimida, criado:Date.now() })
        .then(()=>{ window.fotoCache[id]=comprimida; t.obj.fotos[t.idx]='ref:'+id; })
        .catch((e)=>{ erros++; /* mantém embutida */ })
        .finally(()=>{ setTimeout(proximo, 40); });
    });
  };
  proximo();
}
function reprocessarTodasFotos(){
  // força: pega TODAS as fotos (inclusive as que já são ref, resolvendo do cache) e regrava comprimidas
  if(!fbReady || !fbFotos){ toast('Sem nuvem'); return; }
  const tarefas=[];
  const juntar=(arr)=>{ (arr||[]).forEach(o=>{ if(Array.isArray(o.fotos)) o.fotos.forEach((f,i)=>tarefas.push({obj:o,idx:i,val:f})); }); };
  juntar(db.produtos); juntar(db.acessorios);
  if(!tarefas.length){ toast('Nenhuma foto'); return; }
  toast('Reprocessando '+tarefas.length+' fotos...');
  let i=0, erros=0;
  const proximo=()=>{
    if(i>=tarefas.length){
      saveDB();
      setTimeout(()=>toast('✓ Base agora: '+Math.round(JSON.stringify(db).length/1024)+'KB (erros: '+erros+')'),300);
      return;
    }
    const t=tarefas[i++];
    resolverFoto(t.val, (dataUrl)=>{
      if(!dataUrl){ setTimeout(proximo,20); return; }
      recomprimirDataURL(dataUrl, (comp)=>{
        const id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
        fbFotos.doc(id).set({ img:comp, criado:Date.now() })
          .then(()=>{ window.fotoCache[id]=comp; t.obj.fotos[t.idx]='ref:'+id; })
          .catch(()=>{ erros++; })
          .finally(()=>{ setTimeout(proximo,40); });
      });
    });
  };
  proximo();
}
function comprimirFoto(file, cb){
  // aceita qualquer arquivo que seja imagem (por tipo ou por extensão)
  const nome=(file.name||'').toLowerCase();
  const ehImagem = (file.type&&file.type.indexOf('image')===0) || /\.(jpg|jpeg|png|webp|heic|heif|gif|bmp)$/.test(nome);
  if(!ehImagem){ toast('Arquivo não é imagem: '+(file.name||'')); cb(null); return; }
  const r=new FileReader();
  r.onload=()=>{
    const dataOriginal=r.result;
    const img=new Image();
    img.onload=()=>{
      try{
        const max=800, sc=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(img.width*sc));
        cv.height=Math.max(1,Math.round(img.height*sc));
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        const out=cv.toDataURL('image/jpeg',0.6);
        // se por algum motivo o canvas devolveu vazio, usa a original
        cb(out&&out.length>100 ? out : dataOriginal);
      }catch(err){ cb(dataOriginal); } // fallback: guarda a original
    };
    img.onerror=()=>{
      // formato que o navegador não desenha (ex: HEIC em alguns PCs): guarda original mesmo assim
      cb(dataOriginal);
    };
    img.src=dataOriginal;
  };
  r.onerror=()=>{ toast('Não consegui ler a foto'); cb(null); };
  r.readAsDataURL(file);
}
function addFoto(e){
  const files=Array.from(e.target.files||[]); if(!files.length)return;
  let pend=files.length, ok=0;
  files.forEach(file=>{
    comprimirFoto(file,(dataUrl)=>{
      if(dataUrl){ tempFotos.push(dataUrl); ok++; }
      pend--; if(pend===0){ renderFotos(); if(ok>0) toast(ok>1?ok+' fotos adicionadas':'Foto adicionada'); }
    });
  });
  e.target.value='';
}

   }
   saveDB();

   // e usa o valor de compra como valor da entrada do aparelho.
   if(usadoPagIndex!==null && pagState[usadoPagIndex]){

function textoOrcamento(p){
  const L=[];

  const specs=[p.cor,p.armazenamento,p.condicao].filter(Boolean).join(' · ');
  if(specs) L.push(specs);
  if(p.condicao==='Seminovo'){
    if(p.bateria) L.push('🔋 Bateria: '+p.bateria+'%');

    if(p.avaria && p.avaria!=='Não') L.push('⚠️ Avaria: '+p.avaria);
    if(p.detalhes) L.push('📝 '+p.detalhes);
  }
  L.push('');
  L.push('💰 *'+money(p.venda)+'*');
  L.push(blocoCondicoes(p.venda));
  L.push('');
  L.push('iTronic Rio Verde');
  return L.join('\n');
}
async function compartilharComFoto(id){
  const p=db.produtos.find(x=>x.id===id);
  if(!p){ toast('Aparelho não encontrado'); return; }
  const texto=textoOrcamento(p);
  const foto=await new Promise(r=>resolverFoto(p.fotos&&p.fotos[0], r));
  // tenta compartilhar com a foto (API nativa do celular)
  try{
    if(foto && navigator.canShare){
      const resp=await fetch(foto);
      const blob=await resp.blob();
      const file=new File([blob],'aparelho.jpg',{type:blob.type||'image/jpeg'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], text:texto});
        return;
      }
    }
    // sem foto ou navegador não suporta arquivo: compartilha só o texto
    if(navigator.share){ await navigator.share({text:texto}); return; }
  }catch(e){ /* usuário cancelou ou não deu — cai no fallback abaixo */ 
    if(e && e.name==='AbortError') return;
  }
  // fallback final: abre o WhatsApp com o texto
  enviarWhats(id);
}

function copiarFallback(texto,ok){
  const ta=document.createElement('textarea');
  ta.value=texto;
  ta.contentEditable='true';
  ta.readOnly=false;
  ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0';
  ta.style.width='1px'; ta.style.height='1px'; ta.style.opacity='0';
  document.body.appendChild(ta);
  // iOS precisa de seleção via Range, não só .select()
  const range=document.createRange();
  range.selectNodeContents(ta);
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  ta.setSelectionRange(0,999999);
  let sucesso=false;
  try{ sucesso=document.execCommand('copy'); }catch(e){}
  ta.remove();
  if(sucesso){ ok(); }
  else{
    // último recurso: mostra o texto pra copiar na mão
    mostrarTextoParaCopiar(texto);
  }
}
function mostrarTextoParaCopiar(texto){
  openSheet('Copiar orçamento',
    `<div style="font-size:13px;color:var(--text2);margin-bottom:8px">Segure sobre o texto e toque em "Copiar":</div>
     <textarea readonly style="width:100%;height:220px;padding:12px;border-radius:12px;border:1px solid var(--border);font-size:14px;background:var(--bg2)">${texto.replace(/</g,'&lt;')}</textarea>`,
    null,null);
}

  if(!p){ toast('Aparelho não encontrado'); return; }
  openSheet('Duplicar produto', `

      <div style="color:var(--text2);font-size:13px;line-height:1.5">Cada cópia será uma unidade disponível no estoque. O IMEI e o número de série ficam vazios para você informar os dados de cada aparelho.</div>

    <div style="color:var(--text2);font-size:12px;line-height:1.5;margin-top:6px">De 1 a 20 unidades por vez. Confira fotos, bateria, estado e preços de cada cópia antes de vender ou compartilhar.</div>
  `, 'Adicionar ao estoque', ()=>confirmarDuplicacao(id));
  el('duplicar-modelo').textContent=[p.marca,p.modelo,p.cor,p.armazenamento].filter(Boolean).join(' · ');
  const input=el('duplicar-qtd'); input.min='1'; input.max='20'; input.step='1';
}
function confirmarDuplicacao(id){
  if(!podeEditar()){ toast('Só o administrador pode duplicar aparelhos'); return; }
  const p=db.produtos.find(x=>x.id===id);
  if(!p){ toast('Aparelho não encontrado'); return; }
  const qtd=Number(getV('duplicar-qtd'));
  if(!Number.isInteger(qtd)||qtd<1||qtd>20){ toast('Informe uma quantidade entre 1 e 20'); return; }
  // Copia apenas os dados de cadastro. Identificadores e histórico de venda/reserva são da unidade original.
  const campos=['cat','marca','modelo','cor','armazenamento','condicao','bateria','pecas','fornecedor',
    'compra','venda','obs','troca','trocaTipo','avaria','detalhes','bateriaTipo','tampa','telaTipo','ciclos','fonte'];
  const modelo={};
  campos.forEach(c=>{ if(Object.prototype.hasOwnProperty.call(p,c)) modelo[c]=p[c]; });
  const novos=Array.from({length:qtd},()=>({
    ...modelo,id:uid(),imei:'',serie:'',entrada:todayStr(),status:'Disponível',fotos:(p.fotos||[]).slice()
  }));
  if(JSON.stringify({...db,produtos:db.produtos.concat(novos)}).length>1048000){
    toast('Estoque perto do limite de armazenamento. Otimize as fotos antes de duplicar.');
    return;
  }
  db.produtos.push(...novos);
  try{ saveDB(); }
  catch(e){ db.produtos.splice(-qtd,qtd); toast('Não foi possível salvar as cópias neste dispositivo'); return; }
  closeSheet(); render(currentTab);
  toast(qtd===1?'1 aparelho adicionado ao estoque':qtd+' aparelhos adicionados ao estoque');
}
function reservarProduto(id){
  const p=db.produtos.find(x=>x.id===id);
  if(!p) return;
  p.status='Reservado'; saveDB(); closeSheet(); render(currentTab); toast('Aparelho reservado');
}
function liberarProduto(id){
  const p=db.produtos.find(x=>x.id===id);

  p.status='Disponível'; saveDB(); closeSheet(); render(currentTab); toast('Aparelho disponível');

function delProduto(id){

}

function buscarCep(){
  const cep=(getV('cl-cep')||'').replace(/\D/g,'');
  if(cep.length!==8){ toast('Digite um CEP com 8 números'); return; }
  toast('Buscando endereço...');
  fetch('https://viacep.com.br/ws/'+cep+'/json/')
    .then(r=>r.json())
    .then(d=>{
      if(d.erro){ toast('CEP não encontrado'); return; }
      if(el('cl-rua')) el('cl-rua').value=d.logradouro||'';
      if(el('cl-bairro')) el('cl-bairro').value=d.bairro||'';
      if(el('cl-cidade')) el('cl-cidade').value=d.localidade||'';
      if(el('cl-uf')) el('cl-uf').value=d.uf||'';
      toast('Endereço preenchido');
      if(el('cl-num')) el('cl-num').focus();
    })
    .catch(()=>toast('Sem internet para buscar o CEP'));
}

    comp:getV('cl-comp'), cidade:getV('cl-cidade'), uf:getV('cl-uf'),

/* ============ PAGAMENTO ============ */
const FORMAS=['Pix','Dinheiro','Cartão de crédito','Cartão de débito','Entrada aparelho','Boleto'];
let pagState=[];
let usadoPagIndex=null; // índice da linha de pagamento que está cadastrando um aparelho de troca
function produtoAtualVenda(){
  // sempre busca o produto vigente pelo id, pra não usar referência velha
  // (o db pode ter sido substituído por uma atualização da nuvem)
  if(vendaCart.produtoId){
    const p=db.produtos.find(x=>x.id===vendaCart.produtoId);
    if(p){ vendaCart.produto=p; return p; }
  }
  return vendaCart.produto;
}
function openPagamento(){
  if(!vendaCart.cliente){ toast('Escolha o cliente'); return; }
  const p=produtoAtualVenda();
  if(!p){ toast('Escolha o aparelho'); return; }
  pagState=[];
  drawPagamento();
}
function drawPagamento(){
  const prod=produtoAtualVenda();
  const total=(prod.venda||0)-(vendaCart.desconto||0);
  const pago=pagState.reduce((s,p)=>s+(Number(p.valor)||0),0);
  const falta=total-pago;
  const liquidoTotal=pagState.reduce((s,p)=>s+liquidoDe(p),0);
  const custoProd=Number(prod.compra)||0;
  const trocaVal=pagState.reduce((s,p)=>s+(p.forma==='Entrada aparelho'?(Number(p.valor)||0):0),0);
  const lucroVendaAtual=total-custoProd-trocaVal;
  const html=`
    <div class="card" style="padding:2px 16px">
      <div class="detail-line"><span class="k">Produto</span><span class="v money-in">${money(prod.venda)}</span></div>
      <div class="detail-line"><span class="k">Custo (paguei)</span><span class="v money-in neg" style="font-size:13px">(${money(custoProd)})</span></div>
      <div class="detail-line"><span class="k">Desconto</span><span class="v money-in">- ${money(vendaCart.desconto)}</span></div>
      <div class="detail-line"><span class="k">Valor final</span><span class="v money-in" style="font-size:17px">${money(total)}</span></div>
      <div class="detail-line"><span class="k">Lucro da venda</span><span class="v money-in ${lucroVendaAtual>=0?'pos':'neg'}" id="pag-lucro" style="font-weight:700">${money(lucroVendaAtual)}</span></div>
    </div>

    <div class="sec-title">Formas de pagamento</div>
    <div id="pag-list">${pagState.map((p,i)=>pagCard(p,i)).join('')}</div>
    <div class="pill-select" style="margin-top:4px">
      ${FORMAS.map(f=>`<div class="p" onclick="addForma('${f}')">+ ${f}</div>`).join('')}
    </div>

    <div class="card" style="margin-top:16px" id="pag-totais">
      <div class="detail-line"><span class="k">Total pago</span><span class="v money-in">${money(pago)}</span></div>
      <div class="detail-line"><span class="k">${falta>0?'Falta':falta<0?'Troco/excedente':'Fechado'}</span><span class="v money-in ${falta>0?'neg':'pos'}">${money(Math.abs(falta))}</span></div>
      <div class="detail-line"><span class="k">Você recebe (líquido)</span><span class="v money-in">${money(liquidoTotal)}</span></div>
    </div>
    ${falta>0?`<label style="display:flex;align-items:center;gap:8px;margin:12px 4px;font-size:14px;color:var(--text2)"><input type="checkbox" id="pag-receber" style="width:18px;height:18px"> Deixar ${money(falta)} como conta a receber</label>`:''}
    <button class="btn" onclick="finalizarVenda(${total},${falta})" style="margin-top:8px">Finalizar venda</button>
  `;
  openSheet('Pagamento', html);
}
function pagCard(p,i){
  const isCartao=p.forma==='Cartão de crédito';
  const isUsado=p.forma==='Entrada aparelho';
  return `<div class="card" style="padding:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <b>${p.forma}</b>
      <button onclick="pagState.splice(${i},1);drawPagamento()" style="color:var(--red);font-size:14px;font-weight:500">Remover</button>
    </div>
    <div class="mini-lbl">Valor</div>
    <input class="input" type="number" inputmode="decimal" value="${p.valor||''}" placeholder="0,00" oninput="pagState[${i}].valor=parseFloat(this.value)||0;drawTotals()">
    ${isCartao?`
      <div class="form-row" style="margin-top:10px">
        <div><div class="mini-lbl">Taxa do cartão (%)</div><input class="input" type="number" inputmode="decimal" value="${p.taxa||''}" placeholder="ex: 16" oninput="pagState[${i}].taxa=parseFloat(this.value)||0;drawTotals()"></div>
        <div><div class="mini-lbl">Parcelas</div><input class="input" type="number" inputmode="numeric" value="${p.parcelas||''}" placeholder="1" oninput="pagState[${i}].parcelas=parseInt(this.value)||1;drawTotals()"></div>
      </div>
      <div id="cartao-out-${i}" style="margin-top:12px">${cartaoResumo(p)}</div>
    `:''}
    ${isUsado?`
      ${p.usadoProduto?`
        <div class="card" style="padding:2px 16px;background:var(--bg2);box-shadow:none;margin-top:6px">
          <div class="detail-line"><span class="k">Aparelho</span><span class="v">${(p.usadoProduto.marca||'')+' '+(p.usadoProduto.modelo||'')}</span></div>
          <div class="detail-line"><span class="k">Condição</span><span class="v">${p.usadoProduto.condicao||'—'}</span></div>
          <div class="detail-line"><span class="k">Fotos</span><span class="v">${(p.usadoProduto.fotos||[]).length} foto(s)</span></div>
        </div>
        <button class="btn ghost" style="margin-top:8px" onclick="cadastrarUsado(${i})">Editar cadastro do aparelho</button>
      `:`
        <div style="font-size:13px;color:var(--text2);margin-top:8px">Cadastre o aparelho que está entrando na troca. Ele vai direto para o estoque.</div>
        <button class="btn" style="margin-top:8px" onclick="cadastrarUsado(${i})">Cadastrar aparelho completo</button>
      `}
    `:''}
  </div>`;
}
function cartaoResumo(p){
  const valor=Number(p.valor)||0;
  const taxa=Number(p.taxa)||0;
  const parc=Math.max(1,Number(p.parcelas)||1);
  const juros=valor*taxa/100;
  const totalCliente=valor+juros;
  const porParc=totalCliente/parc;
  return `<div class="card" style="padding:2px 16px;background:var(--bg2);box-shadow:none">
    <div class="detail-line"><span class="k">Valor do iPhone</span><span class="v money-in">${money(valor)}</span></div>
    <div class="detail-line"><span class="k">Juros (${taxa||0}%)</span><span class="v money-in neg">+ ${money(juros)}</span></div>
    <div class="detail-line"><span class="k">Cliente paga</span><span class="v money-in" style="font-size:17px">${money(totalCliente)}</span></div>
    <div class="detail-line"><span class="k">Parcelas</span><span class="v money-in">${parc}x de ${money(porParc)}</span></div>
  </div>`;
}
function liquidoDe(p){
  // Juros por cima: os juros são pagos pelo cliente, você recebe o valor do produto.
  // Entrada de aparelho NÃO é dinheiro que entrou no caixa — é um produto que foi pro
  // estoque. Por isso não conta como saldo líquido recebido nem como lucro na venda.
  // Ele só vira lucro/prejuízo quando o aparelho da troca for vendido depois.
  if(p.forma==='Entrada aparelho') return 0;
  return Number(p.valor)||0;
}
function addForma(f){
  const prod=produtoAtualVenda();
  const total=(prod.venda||0)-(vendaCart.desconto||0);
  const pago=pagState.reduce((s,p)=>s+(Number(p.valor)||0),0);
  // Entrada aparelho começa em branco: você digita o valor que o aparelho vale.
  // As outras formas já vêm preenchidas com o valor que falta pra fechar.
  const valorInicial = f==='Entrada aparelho' ? 0 : Math.max(0,total-pago);
  pagState.push({forma:f, valor:valorInicial, parcelas:1, usadoEstoque:true});
  drawPagamento();
}
function cadastrarUsado(i){
  // abre o cadastro completo de produto para o aparelho que está entrando na troca.
  // quando salvar, o produto entra no estoque e o valor da linha de pagamento
  // passa a ser o valor de compra informado (o quanto você aceitou pelo aparelho).
  const existente = pagState[i].usadoProdutoId
    ? db.produtos.find(p=>p.id===pagState[i].usadoProdutoId)
    : null;
  usadoPagIndex = i;
  openProduto(existente || null);
}
function drawTotals(){
  // atualiza os resumos de cartão ao vivo sem redesenhar os inputs (não perde o foco)
  pagState.forEach((p,i)=>{
    if(p.forma==='Cartão de crédito'){
      const box=el('cartao-out-'+i);
      if(box) box.innerHTML=cartaoResumo(p);
    }
  });
  // atualiza o rodapé (Total pago / Falta / Líquido) ao vivo quando o valor muda
  const prod=produtoAtualVenda();
  if(prod){
    const total=(prod.venda||0)-(vendaCart.desconto||0);
    const pago=pagState.reduce((s,p)=>s+(Number(p.valor)||0),0);
    const falta=total-pago;
    const liquidoTotal=pagState.reduce((s,p)=>s+liquidoDe(p),0);
    const box=el('pag-totais');
    if(box){
      box.innerHTML=`
      <div class="detail-line"><span class="k">Total pago</span><span class="v money-in">${money(pago)}</span></div>
      <div class="detail-line"><span class="k">${falta>0?'Falta':falta<0?'Troco/excedente':'Fechado'}</span><span class="v money-in ${falta>0?'neg':'pos'}">${money(Math.abs(falta))}</span></div>
      <div class="detail-line"><span class="k">Você recebe (líquido)</span><span class="v money-in">${money(liquidoTotal)}</span></div>`;
    }
    // atualiza o lucro da venda ao vivo (venda − custo − entrada de aparelho)
    const lucroBox=el('pag-lucro');
    if(lucroBox){
      const custoProd=Number(prod.compra)||0;
      const trocaVal=pagState.reduce((s,p)=>s+(p.forma==='Entrada aparelho'?(Number(p.valor)||0):0),0);
      const lu=total-custoProd-trocaVal;
      lucroBox.textContent=money(lu);
      lucroBox.classList.remove('pos','neg');
      lucroBox.classList.add(lu>=0?'pos':'neg');
    }
  }
}
function finalizarVendaCarrinho(){
  const q=carrinhoQtd();
  if(!q){ toast('Carrinho vazio'); return; }
  // precisa de cliente: usa o já selecionado na venda, ou pede pra escolher
  if(!vendaCart.cliente){
    closeSheet();
    toast('Escolha o cliente primeiro');
    go('venda');
    setTimeout(pickCliente,300);
    return;
  }
  const total=carrinhoTotal();
  // monta um "produto virtual" representando o carrinho inteiro
  const custoTotal=carrinho.reduce((s,it)=>{
    if(it.tipo==='aparelho'){ const p=db.produtos.find(x=>x.id===it.id); return s+(p?Number(p.compra)||0:0); }
    if(it.tipo==='acessorio'){ const a=(db.acessorios||[]).find(x=>x.id===it.id); return s+(a?(Number(a.custo)||0)*it.qtd:0); }
    return s;
  },0);
  vendaCart.produto={ _carrinho:true, venda:total, marca:'Carrinho', modelo:'('+q+' itens)', compra:custoTotal };
  vendaCart.produtoId=null;
  vendaCart.desconto=0;
  closeSheet();
  pagState=[];
  drawPagamento();
}
function finalizarVenda(total,falta){
  const pago=pagState.reduce((s,p)=>s+(Number(p.valor)||0),0);
  if(pagState.length===0){ toast('Adicione uma forma de pagamento'); return; }
  const usadoSemCadastro=pagState.some(x=>x.forma==='Entrada aparelho' && !x.usadoProdutoId);
  if(usadoSemCadastro){ toast('Cadastre o aparelho da troca'); return; }
  let aReceber=0;
  if(falta>0){
    const chk=el('pag-receber');
    if(chk&&chk.checked) aReceber=falta;
    else { toast('Falta '+money(falta)+' para fechar'); return; }
  }
  const liquido=pagState.reduce((s,p)=>s+liquidoDe(p),0) - (falta>0?0:0);
  const p=produtoAtualVenda();
  if(!p){ toast('Aparelho não encontrado, selecione novamente'); return; }
  const ehCarrinho = p && p._carrinho;
  const ehAcessorio = p && p._acessorios;
  let itensVenda;
  if(ehCarrinho){
    itensVenda=[];
    carrinho.forEach(it=>{
      if(it.tipo==='aparelho'){ const pr=db.produtos.find(x=>x.id===it.id); if(pr) itensVenda.push({prodId:pr.id, nome:pr.marca+' '+pr.modelo, cat:pr.cat, serie:pr.serie||'', imei:pr.imei||'', bateria:pr.bateria||'', pecas:pr.pecas||'', venda:Number(pr.venda)||0, compra:Number(pr.compra)||0}); }
      if(it.tipo==='acessorio'){ const a=(db.acessorios||[]).find(x=>x.id===it.id); if(a) itensVenda.push({acessId:a.id, nome:a.nome, cat:'Acessório', sub:a.sub, qtd:it.qtd, venda:(Number(a.venda)||0)*it.qtd, compra:(Number(a.custo)||0)*it.qtd}); }
    });
  }else if(ehAcessorio){
    const acess=db.acessorios||[];
    itensVenda=carrinhoAcess.map(it=>{ const a=acess.find(x=>x.id===it.id)||{}; return {acessId:it.id, nome:a.nome, cat:'Acessório', sub:a.sub, qtd:it.qtd, venda:(Number(a.venda)||0)*it.qtd, compra:(Number(a.custo)||0)*it.qtd}; });
  }else{
    itensVenda=[{prodId:p.id, nome:p.marca+' '+p.modelo, cat:p.cat, serie:p.serie||'', imei:p.imei||'', bateria:p.bateria||'', pecas:p.pecas||'', venda:p.venda, compra:p.compra}];
  }
  const venda={
    id:uid(), clienteId:vendaCart.cliente.id, clienteNome:vendaCart.cliente.nome,
    clienteTel:vendaCart.cliente.telefone||'', clienteCpf:vendaCart.cliente.cpf||'',
    data:todayStr(), hora:new Date().toLocaleTimeString('pt-BR'),
    vendedor:session.nome,
    itens:itensVenda,
    tipo: ehCarrinho?'carrinho':(ehAcessorio?'acessorio':'aparelho'),
    obs: vendaCart.obs||'',
    total, desconto:vendaCart.desconto||0,
    pagamentos:pagState.map(x=>({...x})),
    liquido: aReceber>0? liquido : liquido,
    aReceber
  };
  db.vendas.push(venda);
  if(ehCarrinho){
    carrinho.forEach(it=>{
      if(it.tipo==='aparelho'){ const pr=db.produtos.find(x=>x.id===it.id); if(pr){ pr.status='Vendido'; pr.vendidoEm=todayStr(); } }
      if(it.tipo==='acessorio'){ const a=(db.acessorios||[]).find(x=>x.id===it.id); if(a){ a.qtd=Math.max(0,(Number(a.qtd)||0)-it.qtd); if(a.qtd<=0 && (!a.situacao||a.situacao==='Disponível')) a.situacao='Sem estoque'; } }
    });
    carrinho=[]; carrinhoAcess=[];
    atualizarBadgeCarrinho();
  }else if(ehAcessorio){
    carrinhoAcess.forEach(it=>{ const a=(db.acessorios||[]).find(x=>x.id===it.id); if(a){ a.qtd=Math.max(0,(Number(a.qtd)||0)-it.qtd); if(a.qtd<=0 && (!a.situacao||a.situacao==='Disponível')) a.situacao='Sem estoque'; } });
  }else{
    p.status='Vendido';
    p.vendidoEm=todayStr();
  }
  saveDB();
  closeSheet();
  resetVenda();
  vendaModo='aparelho';
  toast('Venda registrada ✓');
  go('dash');
}

let orcBusca='', orcDraft=null, orcListaGerada='', orcAba='comparar', orcCustoBusca='';
function orcEsc(v){

}
function orcNorm(v){
  return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase()
    .replace(/\b(1[1-9])\s*PM\b/g,'$1 PRO MAX')
    .replace(/\b(1[1-9])[-–]+(PRO|PLUS|MINI)/g,'$1 $2')
    .replace(/(\d)(PRO\s*MAX|PROMAX|PRO|PLUS|MINI)\b/g,'$1 $2')
    .replace(/PRO[\s-]*MAX/g,'PRO MAX').replace(/\s+/g,' ').trim();
}
function orcValor(v){
  let s=String(v||'').replace(/[^\d,.-]/g,'');
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=Number(s);
  return Number.isFinite(n)&&n>0?n:0;

function orcPrecoNaLinha(linha){
  const rx=/(?:R\$\s*|\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d{2,6}(?:,\d{1,2})?)(?![\dA-Za-z])/gi;
  const achados=[]; let m;
  while((m=rx.exec(linha))){
    const resto=linha.slice(m.index+m[0].length);
    if(/^\s*(?:GB|G\b|TB|T\b|W\b|MM\b|UN\b|X\b|%)/i.test(resto)) continue;
    const explicito=/^\s*(?:R\$|\$)/i.test(m[0]);
    const valor=orcValor(m[1]);
    if(!explicito && (valor<30 || [64,128,256,512,1024].includes(valor))) continue;
    if(valor<1) continue;
    achados.push({valor,indice:m.index,fim:m.index+m[0].length,explicito});
  }
  const comMoeda=achados.filter(a=>a.explicito);
  if(comMoeda.length>1||achados.filter(a=>a.valor>=300).length>1) return {ambiguo:true};
  const escolhido=comMoeda[0]||achados[achados.length-1];

const ORC_CORES=[
  ['TITANIO NATURAL','Titânio natural'],['TITANIO DESERTO','Titânio deserto'],['TITANIO BRANCO','Titânio branco'],['TITANIO PRETO','Titânio preto'],
  ['DESERT TITANIUM','Titânio deserto'],['NATURAL TITANIUM','Titânio natural'],['SPACE GRAY','Cinza espacial'],
  ['CINZA ESPACIAL','Cinza espacial'],['MEIA NOITE','Meia-noite'],['STARLIGHT','Estelar'],
  ['PRETO','Preto'],['BLACK','Preto'],['BRANCO','Branco'],['WHITE','Branco'],['AZUL','Azul'],['BLUE','Azul'],
  ['VERDE','Verde'],['GREEN','Verde'],['ROSA','Rosa'],['PINK','Rosa'],['ROXO','Roxo'],['PURPLE','Roxo'],
  ['PRATA','Prata'],['SILVER','Prata'],['DOURADO','Dourado'],['GOLD','Dourado'],['NATURAL','Natural'],
  ['DESERTO','Deserto'],['AMARELO','Amarelo'],['YELLOW','Amarelo'],['VERMELHO','Vermelho'],['RED','Vermelho'],
  ['LARANJA','Laranja'],['ORANGE','Laranja']
];
function orcCores(texto){
  let resto=' '+orcNorm(texto)+' ';
  const cores=[];
  ORC_CORES.forEach(([termo,nome])=>{
    const rx=new RegExp('\\b'+termo.replace(/ /g,'\\s+')+'\\b','g');
    if(rx.test(resto)){cores.push(nome);resto=resto.replace(rx,' ');}
  });

}
function orcArmazenamento(texto){
  const t=orcNorm(texto);
  const tera=t.match(/\b1\s*(?:TB|T)\b/);
  if(tera) return '1 TB';
  const giga=t.match(/\b(64|128|256|512|1024)\s*(?:GB|G)\b/);
  if(giga) return giga[1]==='1024'?'1 TB':giga[1]+' GB';
  const semUnidade=t.match(/\b(64|128|256|512|1024)\b/);
  return semUnidade?(semUnidade[1]==='1024'?'1 TB':semUnidade[1]+' GB'):'';
}
function orcCondicao(texto){
  const t=orcNorm(texto);
  if(/\b(CPO|SEMINOVOS?|SEMI NOVOS?|USADOS?|VITRINE|RECONDICIONADOS?)\b/.test(t)) return 'Seminovo';
  if(/\b(NOVOS?|LACRADOS?|LACRADAS?|ZERADOS?)\b/.test(t)) return 'Novo';
  return '';
}
function orcModelo(texto){
  let t=orcNorm(texto);
  const acessorio=/\b(CAPINHA|CASE|PELICULA|CABO|FONTE|CARREGADOR|SUPORTE)\b/.test(t);
  if(!acessorio){
    const m=t.match(/\b(?:IPHONE\s*|IP\s*HONE\s*)?(1[1-9])\s*(PRO\s*MAX|PRO|PLUS|MINI|E\b)?\b/);
    if(m && (/(?:IPHONE|IP\s*HONE)/.test(t)||/\b(PRO|PLUS|MINI)\b/.test(t)||/^\s*1[1-9]\b/.test(t))){
      return 'iPhone '+m[1]+(m[2]?' '+m[2].replace(/\s+/g,' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()):'');
    }
  }
  t=t.replace(/\b(?:64|128|256|512|1024)\s*(?:GB|G)?\b|\b1\s*(?:TB|T)\b/g,' ')
    .replace(/\b(CPO|SEMINOVOS?|SEMI NOVOS?|USADOS?|VITRINE|RECONDICIONADOS?|NOVOS?|LACRADOS?|LACRADAS?|ZERADOS?)\b/g,' ')
    .replace(/\b\d+\s*(?:UN|UNIDADES|PCS)\b/g,' ');
  ORC_CORES.forEach(([termo])=>{t=t.replace(new RegExp('\\b'+termo.replace(/ /g,'\\s+')+'\\b','g'),' ');});
  t=t.replace(/[✱*#|•:—–\-\/]/g,' ').replace(/[^A-Z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
  if(!/[A-Z]{3}/.test(t)) return '';
  return t.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())
    .replace(/\bIphone\b/g,'iPhone').replace(/\bIpad\b/g,'iPad').replace(/\bMacbook\b/g,'MacBook')
    .replace(/\bAirpods\b/g,'AirPods').replace(/\bApple Watch\b/g,'Apple Watch');
}
function orcInterpretar(texto){
  const ofertas=[], pendentes=[];
  let contexto={modelo:'',armazenamento:'',condicao:''};
  let condicaoSecao='';
  String(texto||'').split(/\r?\n/).forEach((original,numero)=>{
    const linha=original.trim(); if(!linha) return;
    const preco=orcPrecoNaLinha(linha);
    if(preco&&preco.ambiguo){pendentes.push({linha:numero+1,texto:linha,motivo:'Mais de um preço na linha'});return;}
    const semPreco=preco?linha.slice(0,preco.indice)+' '+linha.slice(preco.fim):linha;
    const modeloEncontrado=orcModelo(semPreco);
    const mudouModelo=modeloEncontrado&&orcNorm(modeloEncontrado)!==orcNorm(contexto.modelo);
    const modelo=modeloEncontrado||contexto.modelo;
    const armazenamento=orcArmazenamento(semPreco)||(mudouModelo?'':contexto.armazenamento);
    const condicao=orcCondicao(semPreco)||(mudouModelo?condicaoSecao:contexto.condicao)||condicaoSecao||'Não informada';
    if(!preco){
      if(!modeloEncontrado&&/^\s*[*#\s]*(?:(?:NOVOS?|LACRADOS?|LACRADAS?|SEMINOVOS?|USADOS?|CPO)\s*)+[*#\s]*$/i.test(orcNorm(semPreco))){
        condicaoSecao=orcCondicao(semPreco);contexto.condicao=condicaoSecao;return;
      }
      if(modeloEncontrado && /\b(IPHONE|IPAD|MACBOOK|AIRPODS|WATCH|GALAXY|SAMSUNG|STARLINK|CAPINHA|CASE|PELICULA|FONTE|CARREGADOR|CABO)\b|\d/i.test(orcNorm(semPreco)))
        contexto={modelo:modeloEncontrado,armazenamento:orcArmazenamento(semPreco),condicao:orcCondicao(semPreco)||condicaoSecao};
      else if(/^\s*[*#\s]*(?:64|128|256|512|1024)\s*(?:GB|G)?\s*[*#\s]*$/i.test(orcNorm(semPreco))) contexto.armazenamento=orcArmazenamento(semPreco);
      else if(/R\$|\b\d[\d.,]*\s*K\b/i.test(linha)) pendentes.push({linha:numero+1,texto:linha,motivo:'Preço não reconhecido'});
      return;
    }
    if(!modelo){pendentes.push({linha:numero+1,texto:linha,motivo:'Produto não identificado'});return;}
    const cores=orcCores(semPreco);
    (cores.length?cores:['Não informada']).forEach(cor=>ofertas.push({id:uid(),modelo,armazenamento:armazenamento||'Não informado',
      condicao,cor,preco:preco.valor,origem:linha}));
    if(modeloEncontrado) contexto={modelo:modeloEncontrado,armazenamento:orcArmazenamento(semPreco),condicao:orcCondicao(semPreco)||condicaoSecao};
  });
  return {ofertas,pendentes};
}
function orcAgrupar(busca=''){
  const termos=orcNorm(busca).replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
  const grupos=new Map();
  (db.fornecedores||[]).forEach(f=>{
    (f.ofertas||[]).forEach(o=>{
      if(!o.modelo||!(Number(o.preco)>0)) return;
      const alvo=orcNorm([o.modelo,o.armazenamento,o.condicao,o.cor].join(' ')).replace(/[^A-Z0-9 ]/g,' ');
      if(!termos.every(t=>alvo.split(/\s+/).some(p=>p.startsWith(t)))) return;
      const chave=[o.modelo,o.armazenamento||'Não informado',o.condicao||'Não informada'].map(orcNorm).join('|');
      if(!grupos.has(chave)) grupos.set(chave,{modelo:o.modelo,armazenamento:o.armazenamento||'Não informado',condicao:o.condicao||'Não informada',porFornecedor:new Map()});
      const g=grupos.get(chave),atual=g.porFornecedor.get(f.id);
      if(!atual||Number(o.preco)<Number(atual.preco)) g.porFornecedor.set(f.id,{...o,fornecedor:f.nome,fornecedorId:f.id});
    });
  });
  return [...grupos.values()].map(g=>({
    modelo:g.modelo,armazenamento:g.armazenamento,condicao:g.condicao,
    ranking:[...g.porFornecedor.values()].sort((a,b)=>Number(a.preco)-Number(b.preco)||a.fornecedor.localeCompare(b.fornecedor,'pt-BR'))
  })).sort((a,b)=>a.modelo.localeCompare(b.modelo,'pt-BR',{numeric:true})||a.armazenamento.localeCompare(b.armazenamento,'pt-BR',{numeric:true}));
}

function orcGanhoProduto(grupo){

function orcPrecoSugerido(grupo){
  const margem=orcGanhoProduto(grupo), ganho=margem?.valor, custo=Number(grupo.ranking[0]?.preco);
  const cfg=db.custoVenda||{}, tx=db.taxasCartao||{};

  if(!margem||!Number.isFinite(ganho)||ganho<0||!(custo>0)||imposto+debito>=100||imposto>=100||desconto>=100) return null;
  const arredonda=v=>Math.ceil((v-1e-9)*100)/100;
  const liquido=custo+ganho;
  const referencia=arredonda(liquido/((1-imposto/100)*(1-desconto/100)));
  const pix=arredonda(referencia*(1-desconto/100));
  const cartao=n=>{
    const taxa=Number((tx.credito||[])[n-1])||0;
    return imposto+taxa>=100?null:arredonda(Math.max(referencia,liquido/(1-(imposto+taxa)/100)));
  };
  return {custo,ganho,origem:margem.origem,referencia,pix,debito:arredonda(Math.max(referencia,liquido/(1-(imposto+debito)/100))),cartao};
}

function orcSalvarCustoVenda(){
  if(!podeEditar())return;
  const imposto=orcNumeroCampo('orc-imposto'),debito=orcNumeroCampo('orc-debito');
  const pixDesconto=orcNumeroCampo('orc-pix-desc'),ganhoPadrao=orcNumeroCampo('orc-ganho-padrao');
  const credito=Array.from({length:21},(_,i)=>orcNumeroCampo('orc-cred-'+i));
  const categorias={};let categoriaInvalida=false;
  ORC_CATEGORIAS.forEach(c=>{
    const input=el('orc-cat-'+c.id),valor=orcNumeroCampo('orc-cat-'+c.id);
    if(valor!==null){
      if(!Number.isFinite(valor)||valor<0)categoriaInvalida=true;
      else categorias[c.id]={tipo:input?.dataset.tipo==='percentual'?'percentual':'valor',valor};
    }
  });
  const taxas=[imposto,debito,pixDesconto,...credito];
  if(taxas.some(n=>n===null||!Number.isFinite(n)||n<0||n>=100)||ganhoPadrao!==null&&(!Number.isFinite(ganhoPadrao)||ganhoPadrao<0)||categoriaInvalida){
    toast('Confira os valores: taxas e desconto entre 0 e 99,99%; margens iguais ou maiores que zero.');return;
  }
  if([debito,...credito].some(taxa=>imposto+taxa>=100)){
    toast('A soma do imposto com cada taxa da maquininha precisa ser menor que 100%.');return;
  }
  const anteriorTx=db.taxasCartao,anteriorCfg=db.custoVenda;
  db.taxasCartao={...anteriorTx,imposto,debito,credito};
  db.custoVenda={...anteriorCfg,ganhoPadrao,pixDesconto,categorias,ganhos:{...(anteriorCfg?.ganhos||{})}};
  if(JSON.stringify(db).length>1048000){db.taxasCartao=anteriorTx;db.custoVenda=anteriorCfg;toast('Base perto do limite da nuvem. Libere espaço antes de salvar.');return;}
  try{saveDB();renderOrcamentos();toast('Condições da venda salvas');}
  catch(e){db.taxasCartao=anteriorTx;db.custoVenda=anteriorCfg;toast('Não foi possível salvar as condições');}
}
function orcSalvarGanho(indice){
  if(!podeEditar())return;
  const grupo=orcAgrupar(orcCustoBusca)[indice];if(!grupo)return;
  const ganho=orcNumeroCampo('orc-gain-'+indice);
  if(ganho!==null&&(!Number.isFinite(ganho)||ganho<0)){toast('Informe um ganho válido, igual ou maior que zero.');return;}
  const anterior=db.custoVenda;
  const cfg=anterior||{ganhoPadrao:null,pixDesconto:0,ganhos:{}};
  const ganhos={...(cfg.ganhos||{})};
  if(ganho===null)delete ganhos[orcChaveCusto(grupo)];else ganhos[orcChaveCusto(grupo)]=ganho;
  db.custoVenda={...cfg,ganhos};
  if(JSON.stringify(db).length>1048000){db.custoVenda=anterior;toast('Base perto do limite da nuvem. Libere espaço antes de salvar.');return;}
  try{saveDB();orcRenderProdutosCusto();toast('Ganho do produto salvo');}
  catch(e){db.custoVenda=anterior;toast('Não foi possível salvar o ganho');}
}

function orcAbrirFornecedor(id){
  if(!podeEditar()){ toast('Somente o administrador pode alterar fornecedores'); return; }

  orcDraft={id:f?f.id:uid(),nome:f?f.nome:'',raw:f?f.raw:'',

  const html=`
    ${fld('Nome do fornecedor','orc-nome',{val:orcDraft.nome,ph:'ex: Distribuidora Alfa'})}

function orcLerArquivo(e){
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  if(file.size>250000){ toast('Arquivo grande demais. Use uma lista de até 250 KB.'); return; }
  const reader=new FileReader();
  reader.onload=()=>{ el('orc-raw').value=String(reader.result||''); toast('Arquivo carregado. Clique em Interpretar lista.'); };
  reader.onerror=()=>toast('Não foi possível ler o arquivo');
  reader.readAsText(file,'UTF-8');
}
function orcInterpretarDraft(){
  if(!orcDraft) return;
  orcDraft.nome=getV('orc-nome'); orcDraft.raw=getV('orc-raw');
  const result=orcInterpretar(orcDraft.raw);
  orcDraft.ofertas=result.ofertas;orcDraft.pendentes=result.pendentes;orcDraft.editando=-1;
  orcRenderPreview();
  toast(result.ofertas.length+' oferta(s) reconhecida(s) · '+result.pendentes.length+' linha(s) para revisar');
}
function orcRenderPreview(){
  const alvo=el('orc-preview'); if(!alvo||!orcDraft) return;

  const editor=(o,i)=>`<div class="orc-edit-grid">

    <div class="orc-actions"><button onclick="orcAdicionarManual()">+ Adicionar oferta manualmente</button></div>
    ${ofertas.map((o,i)=>`<div class="orc-preview-row"><b>${orcEsc(o.modelo||'Preencha o produto')} · ${orcEsc(o.armazenamento||'Não informado')}</b>
      <small>${orcEsc(o.cor||'Não informada')} · ${orcEsc(o.condicao||'Não informada')} · ${money(o.preco||0)}</small>
      ${orcDraft.editando===i?editor(o,i):`<div class="orc-actions"><button onclick="orcDraft.editando=${i};orcRenderPreview()">Corrigir</button><button onclick="orcExcluirOferta(${i})" style="color:var(--red)">Excluir oferta</button></div>`}
    </div>`).join('')}
    ${pendentes.length?`<div class="orc-review"><b>Linhas para revisar (fora da comparação):</b>${pendentes.map((p,i)=>`<div style="margin-top:9px">Linha ${p.linha}: ${orcEsc(p.texto)}<br><small>${orcEsc(p.motivo)}</small><br><button onclick="orcAdicionarPendente(${i})" style="color:var(--blue);font-weight:700">Corrigir e adicionar</button></div>`).join('')}</div>`:''}

function orcAdicionarPendente(i){
  const p=orcDraft&&orcDraft.pendentes.splice(i,1)[0]; if(!p) return;
  orcDraft.ofertas.push({id:uid(),modelo:'',armazenamento:'Não informado',condicao:'Não informada',cor:'Não informada',preco:0,origem:p.texto});

}
function orcAdicionarManual(){
  if(!orcDraft)return;
  orcDraft.ofertas.push({id:uid(),modelo:'',armazenamento:'Não informado',condicao:'Não informada',cor:'Não informada',preco:0,origem:'Adicionada manualmente'});

function orcSalvarCorrecao(i){
  const o=orcDraft&&orcDraft.ofertas[i];if(!o)return;
  const modelo=getV('orc-ed-modelo'),preco=orcValor(getV('orc-ed-preco'));
  if(!modelo||!preco){toast('Informe produto e preço válido');return;}
  Object.assign(o,{modelo,armazenamento:getV('orc-ed-arm')||'Não informado',condicao:getV('orc-ed-cond')||'Não informada',cor:getV('orc-ed-cor')||'Não informada',preco});
  orcDraft.editando=-1;orcRenderPreview();
}
function orcExcluirOferta(i){if(!orcDraft)return;orcDraft.ofertas.splice(i,1);orcDraft.editando=-1;orcRenderPreview();}
function orcGravarFornecedores(novos){
  const anterior=db.fornecedores||[];
  db.fornecedores=novos;
  if(JSON.stringify(db).length>1048000){db.fornecedores=anterior;toast('Base perto do limite da nuvem. Remova listas antigas antes de salvar.');return false;}
  try{saveDB();return true;}
  catch(e){db.fornecedores=anterior;toast('Não foi possível salvar as listas neste dispositivo');return false;}
}
function orcSalvarFornecedor(){
  if(!podeEditar()||!orcDraft)return;
  const nome=getV('orc-nome'),raw=getV('orc-raw');
  if(!nome){toast('Informe o nome do fornecedor');return;}
  if(!raw){toast('Cole ou importe uma lista');return;}
  if(raw!==orcDraft.raw){toast('Clique em Interpretar lista antes de salvar o texto alterado');return;}
  if(!orcDraft.ofertas.length){toast('Nenhuma oferta válida. Revise as linhas e interprete novamente.');return;}
  if(orcDraft.editando>=0){toast('Aplique a correção aberta antes de salvar');return;}
  if(orcDraft.ofertas.some(o=>!o.modelo||!(Number(o.preco)>0))){toast('Corrija ou exclua as ofertas sem produto/preço');return;}
  const atuais=db.fornecedores||[];
  if(atuais.some(f=>f.id!==orcDraft.id&&orcNorm(f.nome)===orcNorm(nome))){toast('Já existe uma lista com este nome. Abra-a para atualizar.');return;}
  const registro={id:orcDraft.id,nome,raw,ofertas:orcDraft.ofertas.map(o=>({...o})),pendentes:orcDraft.pendentes.map(p=>({...p})),atualizado:todayStr()};
  const novos=atuais.some(f=>f.id===registro.id)?atuais.map(f=>f.id===registro.id?registro:f):[...atuais,registro];
  if(!orcGravarFornecedores(novos))return;
  orcDraft=null;closeSheet();renderOrcamentos();toast('Lista de '+nome+' salva');
}
function orcRemoverFornecedor(id){
  if(!podeEditar())return;

function orcGerarLista(){

    <button class="btn" onclick="orcCopiarLista()" style="margin-top:12px">Copiar lista</button>
    <button class="btn secondary" onclick="orcBaixarLista()" style="margin-top:8px">Baixar TXT</button>`);

function orcCopiarLista(){
  const done=()=>toast('Lista copiada');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(orcListaGerada).then(done).catch(()=>copiarFallback(orcListaGerada,done));
  else copiarFallback(orcListaGerada,done);
}
function orcBaixarLista(){
  const blob=new Blob(['\uFEFF',orcListaGerada],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='itronic-melhores-fornecedores-'+todayStr()+'.txt';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);

function valorSim(id){
  let texto=String(getV(id)||'').replace(/[^\d,.-]/g,'');
  if(texto.includes(',')) texto=texto.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(texto)) texto=texto.replace(/\./g,'');
  const valor=Number(texto);
  return Number.isFinite(valor)?Math.max(0,valor):0;
}
function valoresSimTroca(){
  const novo=valorSim('sim-val-novo');
  const usado=simState.semTroca?0:valorSim('sim-val-usado');
  const entrada=valorSim('sim-val-entrada');
  const antesEntrada=Math.max(0,novo-usado);
  return {novo,usado,entrada,saldo:Math.max(0,antesEntrada-entrada),entradaExcedente:entrada>antesEntrada};
}
function calcSimTroca(){
  const {saldo,entradaExcedente}=valoresSimTroca();
  const eldif=el('sim-difer'); if(eldif) eldif.textContent=money(saldo);
  const out=el('sim-out');
  if(entradaExcedente){
    if(out) out.innerHTML='<div class="sim-alert" role="alert">A entrada não pode ser maior que o valor restante da compra. Ajuste o valor para continuar.</div>';
    return;
  }
  const tx=db.taxasCartao||{debito:1.5,imposto:0,credito:[]};
  const imposto=Number(tx.imposto)||0;
  const parc=simState.parcCred||1;
  // taxa + imposto repassados pro cliente: valor / (1 - (taxa+imposto)%)
  const comTaxa=(base,taxa)=>{ const t=taxa+imposto; return t>0 ? base/(1-t/100) : base; };
  const taxaCred=(tx.credito&&tx.credito[parc-1])||0;
  const vDebito=comTaxa(saldo,tx.debito);
  const vCredito=comTaxa(saldo,taxaCred);
  if(out){
    out.innerHTML=`
      <div class="pay-opt pay-pix">
        <div class="pay-ico">${vectorIcon('cash')}</div>
        <div class="pay-mid"><div class="pay-nome">À vista no Pix</div><div class="pay-sub">Sem taxa</div></div>
        <div class="pay-val">${money(saldo)}</div>
      </div>
      <div class="pay-opt pay-deb">
        <div class="pay-ico">${vectorIcon('card')}</div>
        <div class="pay-mid"><div class="pay-nome">Débito</div><div class="pay-sub">taxa ${tx.debito}%${imposto?' + imp '+imposto+'%':''}</div></div>
        <div class="pay-val">${money(vDebito)}</div>
      </div>
      <div class="pay-opt pay-cred">
        <div class="pay-ico">${vectorIcon('card')}</div>
        <div class="pay-mid"><div class="pay-nome">Crédito ${parc}x</div><div class="pay-sub">taxa ${taxaCred}%${imposto?' + imp '+imposto+'%':''}</div></div>
        <div class="pay-val">${money(vCredito)}<div class="pay-parc">${parc}x de ${money(vCredito/parc)}</div></div>
      </div>
    `;
  }
}
function textoSimTroca(){
  const semTroca=simState.semTroca;
  const {novo:vNovo,usado:vUsado,entrada,saldo,entradaExcedente}=valoresSimTroca();
  if(entradaExcedente) return '';
  const modNovo=getV('sim-mod-novo'), modUsado=semTroca?'':getV('sim-mod-usado');
  const armNovo=getV('sim-arm-novo')||simState.armNovo;
  const armUsado=semTroca?'':(getV('sim-arm-usado')||simState.armUsado);
  const tx=db.taxasCartao||{debito:1.5,imposto:0,credito:[]};
  const imposto=Number(tx.imposto)||0;
  const parc=simState.parcCred||1;
  const comTaxa=(base,taxa)=>{ const t=taxa+imposto; return t>0 ? base/(1-t/100) : base; };
  const taxaCred=(tx.credito&&tx.credito[parc-1])||0;
  const vDebito=comTaxa(saldo,tx.debito);
  const vCredito=comTaxa(saldo,taxaCred);
  const L=[];
  L.push('📱 *'+(semTroca?'Orçamento':'Proposta de troca')+' — iTronic Rio Verde*');
  L.push('');
  L.push((semTroca?'Aparelho: *':'Novo: *')+[modNovo,armNovo].filter(Boolean).join(' ')+'* — '+money(vNovo));
  if(!semTroca){
    L.push('Seu usado: '+[modUsado,armUsado].filter(Boolean).join(' ')+' — '+money(vUsado));
  }
  if(entrada>0) L.push('Entrada em dinheiro ou Pix: '+money(entrada));
  L.push('');
  L.push('*Saldo a pagar: '+money(saldo)+'*');
  L.push('');
  L.push('*Formas de pagamento do saldo:*');
  L.push('💠 À vista Pix: '+money(saldo));
  L.push('💳 Débito: '+money(vDebito));
  L.push('💳 Crédito '+parc+'x: '+parc+'x de '+money(vCredito/parc)+' (total '+money(vCredito)+')');
  L.push('');
  L.push('📲 iTronic Rio Verde');
  return L.join('\n');
}
function copiarSimTroca(){
  const texto=textoSimTroca();
  if(!texto){ toast('A entrada não pode ser maior que o valor restante da compra'); return; }
  const ok=()=>toast('Orçamento copiado');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok).catch(()=>copiarFallback(texto,ok));
  else copiarFallback(texto,ok);
}

let caixaPeriodo='dia';
function caixaSaldoHoje(){ return resumoCaixa('dia').saldo; }
function movimentosCaixa(periodo){
  // junta entradas de vendas (automáticas) + lançamentos manuais
  const t=todayStr(), mes=t.slice(0,7);
  const dentro = (data)=> periodo==='dia' ? data===t : data.slice(0,7)===mes;
  const movs=[];
  // vendas = entradas automáticas (valor líquido, na data da venda)
  db.vendas.forEach(v=>{
    if(dentro(v.data)){
      movs.push({ auto:true, tipo:'entrada', data:v.data, hora:v.hora||'',
        cat:'Venda', desc:v.clienteNome+' · '+v.itens.map(i=>i.nome).join(', '),
        valor:vendaCaixa(v), ref:v.id });
    }
  });
  // lançamentos manuais do caixa
  (db.caixa||[]).forEach(m=>{
    if(dentro(m.data)) movs.push(Object.assign({auto:false},m));
  });
  movs.sort((a,b)=> (b.data+ (b.hora||'')).localeCompare(a.data+(a.hora||'')) );
  return movs;
}
function resumoCaixa(periodo){
  const movs=movimentosCaixa(periodo);
  let entrada=0, saida=0;
  movs.forEach(m=>{ if(m.tipo==='entrada') entrada+=Number(m.valor)||0; else saida+=Number(m.valor)||0; });
  return {entrada, saida, saldo:entrada-saida, movs};
}

function diasPara(dateStr){
  if(!dateStr) return null;
  const hoje=new Date(todayStr()+'T12:00');
  const venc=new Date(dateStr+'T12:00');
  return Math.round((venc-hoje)/86400000);
}

/* ============ BACKUP ============ */
function montarBackupCompleto(){
  // devolve uma cópia do db com as fotos embutidas (resolve refs pelo cache) — backup completo
  const copia=JSON.parse(JSON.stringify(db));
  const embutir=(arr)=>{ (arr||[]).forEach(o=>{ if(Array.isArray(o.fotos)) o.fotos=o.fotos.map(f=> ehRefFoto(f) ? (window.fotoCache[idDaRef(f)]||f) : f ); }); };
  embutir(copia.produtos); embutir(copia.acessorios); embutir(copia.servicos);
  return JSON.stringify(copia);
}
function exportBackup(){
  const dados=montarBackupCompleto();
  const kb=Math.round(dados.length/1024);
  const html=`
    <div style="text-align:center;margin:6px 0 4px">
      <div class="thumb" style="width:60px;height:60px;font-size:28px;margin:0 auto 12px">${vectorIcon('save')}</div>
      <div style="font-size:15px;color:var(--text2);line-height:1.5;padding:0 6px">Escolha onde salvar a cópia dos seus dados.<br>Guarde num lugar seguro fora do celular.</div>
    </div>
    <div class="list" style="margin-top:18px">
      <div class="row" onclick="bkpArquivos()"><div class="thumb">${vectorIcon('folder')}</div><div class="info"><div class="t">Salvar no aparelho</div><div class="s">Baixa o arquivo · o iPhone pergunta onde guardar</div></div>${chev()}</div>
      <div class="row" onclick="bkpWhatsapp()"><div class="thumb">${vectorIcon('message')}</div><div class="info"><div class="t">Enviar pelo WhatsApp</div><div class="s">Abre o WhatsApp pra você mandar pra si mesmo</div></div>${chev()}</div>
      <div class="row" onclick="bkpCopiar()"><div class="thumb">${vectorIcon('copy')}</div><div class="info"><div class="t">Copiar</div><div class="s">Copia os dados pra colar onde quiser</div></div>${chev()}</div>
    </div>
    <div style="text-align:center;color:var(--text2);font-size:12px;margin-top:14px">Tamanho do backup: ${kb} KB</div>
    <div style="height:20px"></div>
  `;
  openSheet('Salvar backup', html);
}
async function bkpArquivos(){
  const nome='itronic-backup-'+todayStr()+'.json';
  const dados=montarBackupCompleto();
  // Melhor caminho no iPhone: compartilhar o ARQUIVO pela tela nativa do iOS
  // (abre "Salvar em Arquivos", WhatsApp, etc). Só funciona por HTTPS.
  try{
    if(navigator.canShare){
      const file=new File([dados],nome,{type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'Backup iTronic'});
        toast('Backup pronto para salvar');
        return;
      }
    }
  }catch(e){
    if(e&&e.name==='AbortError'){ return; } // usuário cancelou, tudo bem
  }
  // Reserva: download tradicional
  try{
    const blob=new Blob([dados],{type:'application/octet-stream'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('Backup baixado');
  }catch(e){
    toast('Não consegui salvar. Use a opção Copiar.');
  }
}
function bkpWhatsapp(){
  const dados=montarBackupCompleto();
  // WhatsApp por link só manda texto. Backups grandes (com muitas fotos) não cabem.
  if(dados.length > 30000){
    askConfirm('Este backup é grande (tem fotos) e não cabe no WhatsApp como mensagem. Use "Salvar no aparelho" e depois anexe o arquivo no WhatsApp manualmente.', bkpArquivos, 'Salvar no aparelho');
    return;
  }
  const txt='Backup iTronic '+todayStr()+' (não apague, serve para restaurar o sistema):\n\n'+dados;
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
  toast('Abrindo WhatsApp...');
}
function bkpCopiar(){
  const dados=montarBackupCompleto();
  const done=()=>toast('Backup copiado ✓');
  const fail=()=>toast('Não consegui copiar. Use Salvar no aparelho.');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(dados).then(done).catch(fail);
  }else{
    // fallback antigo
    const ta=document.createElement('textarea'); ta.value=dados; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ fail(); } ta.remove();
  }
}
function importBackup(e){
  const file=e.target.files[0]; if(!file)return;
  const doImport=()=>{
    const r=new FileReader();
    r.onload=()=>{ try{ db=JSON.parse(r.result); if(!db.logins)db.logins=[]; saveDB(); applyTheme(); closeSheet(); render(currentTab); toast('Backup restaurado'); }catch(err){ toast('Arquivo inválido'); } };
    r.readAsText(file);
  };
  e.target.value='';
  askConfirm('Importar vai substituir todos os dados atuais. Continuar?', doImport, 'Importar');
}

/* confirmação própria (o confirm nativo é bloqueado em muitos navegadores de celular) */
let confirmFn=null;
function askConfirm(msg, onYes, yesLabel){
  confirmFn=onYes;
  el('confirm-msg').textContent=msg;
  el('confirm-yes').textContent=yesLabel||'Remover';
  el('confirm-bg').classList.add('show');
}
function confirmYes(){ el('confirm-bg').classList.remove('show'); if(confirmFn){const f=confirmFn;confirmFn=null;f();} }
function confirmNo(){ el('confirm-bg').classList.remove('show'); confirmFn=null; }

/* ============ INIT ============ */
loadDB();
// quando o usuário sai de um campo, se havia atualização da nuvem esperando, aplica agora
document.addEventListener('focusout', ()=>{
  setTimeout(()=>{
    const aindaDigitando = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
    const sheetAberta = el('sheet') && el('sheet').classList.contains('show');
    const noMeioDaVenda = currentTab==='venda' && vendaCart && vendaCart.produto;
    if(renderPendente && !aindaDigitando && !sheetAberta && !noMeioDaVenda){
      renderPendente=false;
      if(session && typeof currentTab!=='undefined') render(currentTab);
    }
  }, 150);
});
applyTheme();

try{
  const last=localStorage.getItem('itronic_lastbackup');
  if(last!==todayStr()){ localStorage.setItem('itronic_autobackup', JSON.stringify(db)); localStorage.setItem('itronic_lastbackup', todayStr()); }
}catch(e){}
